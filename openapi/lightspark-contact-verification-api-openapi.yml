openapi: 3.2.0
info:
  title: Grid Contact Verification API
  description: API for managing global payments on the open Money Grid. Built by Lightspark. See the full documentation at https://docs.lightspark.com/.
  version: '2025-10-13'
  contact:
    name: Lightspark Support
    email: support@lightspark.com
  license:
    name: Proprietary
    url: https://lightspark.com/terms
servers:
- url: https://api.lightspark.com/grid/2025-10-13
  description: Production server
security:
- BasicAuth: []
- AgentAuth: []
tags:
- name: Contact Verification
  description: Endpoints for verifying a customer's email and phone via one-time codes. Required only for customers whose payment provider mandates contact verification (e.g. EU customers); other providers return 409.
paths:
  /customers/{customerId}/verify-email:
    parameters:
    - name: customerId
      in: path
      description: The Grid customer ID to send an email verification code to.
      required: true
      schema:
        type: string
    post:
      summary: Send an email verification code to a customer
      description: 'Send (or resend) a one-time code to the customer''s email address to begin

        email verification.


        This endpoint is only meaningful for customers whose payment provider

        requires contact verification (e.g. EU customers); the customer''s

        `contactVerification.email` status reflects progress. For customers whose

        provider has no such requirement, this returns `409`.


        Call `POST /customers/{customerId}/verify-email/confirm` with the received

        code to complete verification. Re-POST this endpoint to resend the code.


        In sandbox, no email is sent and the code is always `123456`.'
      operationId: sendCustomerEmailVerification
      tags:
      - Contact Verification
      security:
      - BasicAuth: []
      responses:
        '204':
          description: Verification code sent.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: The customer's payment provider does not require contact verification, or the email is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/{customerId}/verify-email/confirm:
    parameters:
    - name: customerId
      in: path
      description: The Grid customer ID whose email is being verified.
      required: true
      schema:
        type: string
    post:
      summary: Confirm a customer's email verification code
      description: 'Submit the one-time code the customer received by email to mark their email

        as `VERIFIED`. On success, `contactVerification.email` becomes `VERIFIED`.


        Both email and phone must be `VERIFIED` before the customer can begin KYC.


        In sandbox, the code is always `123456`.'
      operationId: confirmCustomerEmailVerification
      tags:
      - Contact Verification
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactVerificationConfirmRequest'
      responses:
        '200':
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOneOf'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: The customer's payment provider does not require contact verification, or the email is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/{customerId}/verify-phone:
    parameters:
    - name: customerId
      in: path
      description: The Grid customer ID to send a phone verification code to.
      required: true
      schema:
        type: string
    post:
      summary: Send a phone verification code to a customer
      description: 'Send (or resend) a one-time code via SMS to the customer''s phone number to

        begin phone verification.


        This endpoint is only meaningful for customers whose payment provider

        requires contact verification (e.g. EU customers); the customer''s

        `contactVerification.phone` status reflects progress. For customers whose

        provider has no such requirement, this returns `409`.


        Call `POST /customers/{customerId}/verify-phone/confirm` with the received

        code to complete verification. Re-POST this endpoint to resend the code.


        In sandbox, no SMS is sent and the code is always `123456`.'
      operationId: sendCustomerPhoneVerification
      tags:
      - Contact Verification
      security:
      - BasicAuth: []
      responses:
        '204':
          description: Verification code sent.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: The customer's payment provider does not require contact verification, or the phone is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/{customerId}/verify-phone/confirm:
    parameters:
    - name: customerId
      in: path
      description: The Grid customer ID whose phone is being verified.
      required: true
      schema:
        type: string
    post:
      summary: Confirm a customer's phone verification code
      description: 'Submit the one-time code the customer received via SMS to mark their phone

        as `VERIFIED`. On success, `contactVerification.phone` becomes `VERIFIED`.


        Both email and phone must be `VERIFIED` before the customer can begin KYC.


        In sandbox, the code is always `123456`.'
      operationId: confirmCustomerPhoneVerification
      tags:
      - Contact Verification
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactVerificationConfirmRequest'
      responses:
        '200':
          description: Phone verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerOneOf'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: The customer's payment provider does not require contact verification, or the phone is already verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  schemas:
    BusinessInfoUpdate:
      type: object
      description: Additional information for business entities
      properties:
        legalName:
          type: string
          maxLength: 250
          description: Legal name of the business
          example: Acme Corporation, Inc.
        doingBusinessAs:
          type: string
          maxLength: 250
          description: Trade name or DBA name of the business, if different from the legal name
          example: Acme
        country:
          type: string
          description: Country of incorporation or registration (ISO 3166-1 alpha-2)
          example: US
        registrationNumber:
          type: string
          maxLength: 100
          description: Business registration number
          example: '5523041'
        incorporatedOn:
          type: string
          format: date
          description: Date of incorporation in ISO 8601 format (YYYY-MM-DD)
          example: '2018-03-14'
        entityType:
          $ref: '#/components/schemas/EntityType'
        taxId:
          type: string
          maxLength: 100
          description: Tax identification number
          example: 47-1234567
        countriesOfOperation:
          type: array
          items:
            type: string
          description: List of countries where the business operates (ISO 3166-1 alpha-2)
          example:
          - US
        businessType:
          $ref: '#/components/schemas/BusinessType'
        purposeOfAccount:
          $ref: '#/components/schemas/PurposeOfAccount'
        sourceOfFunds:
          type: string
          maxLength: 500
          description: The primary source of funds for the business
          example: Funds derived from customer payments for software services
        expectedMonthlyTransactionCount:
          $ref: '#/components/schemas/ExpectedMonthlyTransactionCount'
        expectedMonthlyTransactionVolume:
          $ref: '#/components/schemas/ExpectedMonthlyTransactionVolume'
        expectedRecipientJurisdictions:
          type: array
          items:
            type: string
          description: List of countries where the business expects to send payments (ISO 3166-1 alpha-2)
          example:
          - US
        naicsCode:
          type: string
          pattern: ^\d{2,6}$
          description: NAICS code describing the nature of the business (2-6 digits)
          example: '541511'
        sourceOfFundsCategories:
          type: array
          items:
            $ref: '#/components/schemas/SourceOfFundsCategory'
          description: Structured source-of-funds categories for the business
          example:
          - OPERATING_REVENUE
        sourceOfFundsOtherDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Description of the source of funds when OTHER is selected
          example: Proceeds from a legal settlement
        purposeOfAccountOtherDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Description of the account purpose when OTHER is selected
          example: Escrow for equipment leases
        expectedCounterpartyCountries:
          type: array
          items:
            type: string
          description: List of countries of the business's expected transaction counterparties (ISO 3166-1 alpha-2)
          example:
          - US
        primaryContactFirstName:
          type: string
          maxLength: 250
          description: First name of the business's primary contact — a registered director or authorised representative of the business. Required in regions where a named individual is verified against the business during onboarding (e.g. the EU). The customer's `email` and `phoneNumber` are this person's contact details.
          example: Jane
        primaryContactLastName:
          type: string
          maxLength: 250
          description: Last name of the business's primary contact.
          example: Smith
    PaymentDocumentRequirementId:
      type: string
      description: 'A stable identifier for one required document within a purpose''s requirements. The same ID means the same requirement across quotes. It is separate from `PaymentDocumentType`. The requirement ID names the document to supply, and the document type names what a file is. The two differ where a requirement accepts alternatives. For example, a file declared as either `PURCHASE_ORDER` or `DELIVERY_SLIP` fills the `SUPPORTING_PROOF` requirement.


        [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents) lists the IDs each purpose requires.


        Treat the ID as an opaque value, not a member of a fixed list. Grid may add new IDs as requirements change.'
      example: SUPPORTING_PROOF
    ContactVerificationStatus:
      type: string
      description: Status of an individual contact-verification channel (email or phone). `PENDING` means verification is required but not yet completed; `VERIFIED` means the channel has been confirmed.
      enum:
      - PENDING
      - VERIFIED
      example: VERIFIED
    KycStatus:
      type: string
      enum:
      - UNVERIFIED
      - PENDING
      - APPROVED
      - REJECTED
      - HOLD
      description: The current KYC status of a customer. `HOLD` means the customer is placed on hold and may be required to update or provide more information.
      example: APPROVED
    Customer:
      type: object
      required:
      - umaAddress
      - platformCustomerId
      - customerType
      properties:
        id:
          type: string
          description: System-generated unique identifier
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        platformCustomerId:
          type: string
          description: Platform-specific customer identifier
          example: 9f84e0c2a72c4fa
        customerType:
          $ref: '#/components/schemas/CustomerType'
        endUserTermsConsent:
          deprecated: true
          readOnly: true
          allOf:
          - $ref: '#/components/schemas/EndUserTermsConsent'
          description: Deprecated; read `agreementConsents` instead. Mirrors the customer's `LIGHTSPARK_END_USER_TERMS` acceptance when one is on file, and is omitted otherwise.
        agreementConsents:
          type: array
          readOnly: true
          description: The customer's recorded agreement acceptances, one entry per accepted type holding that type's most recent acceptance. Omitted when the customer has not accepted any agreement yet.
          items:
            $ref: '#/components/schemas/AgreementConsent'
        region:
          type: string
          description: Country code (ISO 3166-1 alpha-2) representing the customer's regional identity and regulatory jurisdiction.
          example: US
        currencies:
          type: array
          items:
            type: string
          description: List of currency codes enabled for this customer.
          example:
          - USD
          - USDC
        email:
          type: string
          format: email
          description: Email address for the customer.
          example: john.doe@example.com
        phoneNumber:
          type: string
          pattern: ^\+[1-9]\d{1,14}$
          description: Phone number for the customer in strict E.164 format.
          example: '+14155551234'
        umaAddress:
          type: string
          description: Full UMA address (always present in responses, even if system-generated). This is an optional identifier to route payments to the customer.
          example: $john.doe@uma.domain.com
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2025-07-21T17:32:28Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2025-07-21T17:32:28Z'
        isDeleted:
          type: boolean
          description: Whether the customer is marked as deleted
          example: false
        contactVerification:
          allOf:
          - $ref: '#/components/schemas/ContactVerification'
          description: Email and phone verification state. **Only present when the customer's payment provider requires it** (e.g. EU customers); omitted otherwise.
    ContactVerificationConfirmRequest:
      type: object
      description: Request body for confirming an email or phone verification challenge.
      required:
      - code
      properties:
        code:
          type: string
          description: The one-time verification code the customer received via email or SMS. In sandbox, the code is always `123456`.
          example: '123456'
    BeneficialOwnerPersonalInfo:
      type: object
      required:
      - firstName
      - lastName
      - birthDate
      - nationality
      - address
      - idType
      - identifier
      properties:
        firstName:
          type: string
          maxLength: 250
          description: First name of the individual
          example: Jane
        middleName:
          type: string
          maxLength: 250
          description: Middle name of the individual
          example: Marie
        lastName:
          type: string
          maxLength: 250
          description: Last name of the individual
          example: Smith
        birthDate:
          type: string
          format: date
          description: Date of birth in ISO 8601 format (YYYY-MM-DD)
          example: '1978-06-15'
        nationality:
          type: string
          description: Country of nationality (ISO 3166-1 alpha-2)
          example: US
        email:
          type: string
          format: email
          maxLength: 255
          description: Email address of the individual
          example: jane.smith@acmecorp.com
        phoneNumber:
          type: string
          description: Phone number in E.164 format
          example: '+14155550192'
          pattern: ^\+[1-9]\d{1,14}$
        address:
          $ref: '#/components/schemas/Address'
        idType:
          $ref: '#/components/schemas/IdentificationType'
        identifier:
          type: string
          maxLength: 100
          description: The identification number or value
          example: 123-45-6789
        countryOfIssuance:
          type: string
          description: Country that issued the identification (ISO 3166-1 alpha-2)
          example: US
    IndividualSourceOfFundsCategory:
      type: string
      enum:
      - SALARY
      - SELF_EMPLOYMENT_INCOME
      - INVESTMENT_INCOME
      - PENSION
      - RENTAL_INCOME
      - GIFT
      - INHERITANCE
      - LOAN
      - SAVINGS
      - SALE_OF_ASSETS
      - OTHER
      description: A structured source-of-funds category for an individual customer (FLOW of funds into this account). Distinct from `SourceOfFundsCategory`, which covers business customers.
      example: SALARY
    AgreementType:
      type: string
      description: 'Identifies which Grid agreement a consent record or document refers to. Values are stable identifiers: a document''s hosted URL or version may change, but its type does not. Accepting one agreement never implies acceptance of another, even when two agreements share a hosted page. The cardholder and accountholder agreements differ by customer kind: an `INDIVIDUAL` customer accepts the `_CONSUMER_` variant, and a `BUSINESS` customer accepts the `_COMMERCIAL_` one.'
      enum:
      - LIGHTSPARK_END_USER_TERMS
      - LIGHTSPARK_E_SIGN_CONSENT
      - LIGHTSPARK_PRIVACY_POLICY
      - LEAD_E_SIGN_CONSENT
      - LEAD_ACCOUNTHOLDER_CONSUMER_AGREEMENT
      - LEAD_ACCOUNTHOLDER_COMMERCIAL_AGREEMENT
      - LEAD_PRIVACY_POLICY
      - LEAD_CARDHOLDER_CONSUMER_AGREEMENT
      - LEAD_CARDHOLDER_COMMERCIAL_AGREEMENT
      example: LIGHTSPARK_END_USER_TERMS
    AgreementAcceptanceMethod:
      type: string
      description: Method the customer used to affirmatively accept an agreement.
      enum:
      - CHECKBOX
      - CLICK_TO_ACCEPT
      example: CHECKBOX
    IdentificationType:
      type: string
      enum:
      - SSN
      - ITIN
      - EIN
      - NON_US_TAX_ID
      description: Type of tax identification
      example: SSN
    BusinessCustomer:
      title: Business Customer
      allOf:
      - $ref: '#/components/schemas/Customer'
      - $ref: '#/components/schemas/BusinessCustomerFields'
      - type: object
        properties:
          businessInfo:
            $ref: '#/components/schemas/BusinessInfoResponse'
          beneficialOwners:
            type: array
            items:
              $ref: '#/components/schemas/BeneficialOwner'
    Address:
      type: object
      required:
      - line1
      - postalCode
      - country
      properties:
        line1:
          type: string
          description: Street address line 1
          example: 123 Main Street
        line2:
          type: string
          description: Street address line 2
          example: Apt 4B
        city:
          type: string
          description: City
          example: San Francisco
        state:
          type: string
          description: State/Province/Region
          example: CA
        postalCode:
          type: string
          description: Postal/ZIP code
          example: '94105'
        country:
          type: string
          description: Country code (ISO 3166-1 alpha-2)
          example: US
    SourceOfWealthCategory:
      type: string
      enum:
      - SALARY
      - BUSINESS_INCOME
      - INVESTMENTS
      - INHERITANCE
      - PROPERTY_SALE
      - GIFT
      - RETIREMENT
      - SAVINGS
      - OTHER
      description: Origin of the customer's accumulated wealth (STOCK). Distinct from `SourceOfFundsCategory` which describes the FLOW of funds for this specific account.
      example: SALARY
    FieldError:
      type: object
      required:
      - field
      description: One field-level validation failure. Field-validation errors on submit endpoints (e.g. `POST /customers`, `PATCH /customers/{id}`) emit an array of these under `details.errors` so platforms can render form-field-level UX for every failure in a single round-trip.
      properties:
        field:
          type: string
          description: Dot-notation path to the offending field.
          example: identifier
        constraint:
          $ref: '#/components/schemas/FieldConstraint'
        message:
          type: string
          description: Human-readable explanation of what's wrong with this field.
          example: Value is not one of the allowed enum members.
    PurposeOfAccount:
      type: string
      enum:
      - CONTRACTOR_PAYOUTS
      - CREATOR_PAYOUTS
      - EMPLOYEE_PAYOUTS
      - MARKETPLACE_SELLER_PAYOUTS
      - SUPPLIER_PAYMENTS
      - CROSS_BORDER_B2B
      - AR_AUTOMATION
      - AP_AUTOMATION
      - EMBEDDED_PAYMENTS
      - PLATFORM_FEE_COLLECTION
      - P2P_TRANSFERS
      - CHARITABLE_DONATIONS
      - OTHER
      description: The intended purpose for using the Grid account
      example: CONTRACTOR_PAYOUTS
    SourceOfFundsCategory:
      type: string
      enum:
      - OPERATING_REVENUE
      - INVESTMENT_INCOME
      - LOANS
      - VENTURE_CAPITAL
      - PERSONAL_SAVINGS
      - DONATIONS
      - OTHER
      description: A structured source-of-funds category for the business
      example: OPERATING_REVENUE
    PepStatus:
      type: string
      enum:
      - NONE
      - DOMESTIC
      - FOREIGN
      - HIO
      - FAMILY_OR_ASSOCIATE
      description: Political exposure declaration (Politically Exposed Person status). `HIO` = head of an international organization. `FAMILY_OR_ASSOCIATE` covers close family members and known close associates of a PEP.
      example: NONE
    AgreementConsentRequest:
      type: object
      required:
      - type
      - acceptedAt
      - ipAddress
      - termsVersion
      - acceptanceMethod
      properties:
        type:
          $ref: '#/components/schemas/AgreementType'
        acceptedAt:
          type: string
          format: date-time
          description: Date and time when the customer accepted this agreement. Must include a timezone offset and must not be in the future.
        ipAddress:
          type: string
          maxLength: 45
          description: IP address of the device the customer used when accepting this agreement.
          example: 198.51.100.24
        termsVersion:
          type: string
          maxLength: 64
          description: Version identifier of the accepted agreement, as returned for this type by the agreement documents endpoint. A version is scoped to its type; a version valid for one agreement is not valid for another.
          example: '2025-10-13'
        acceptanceMethod:
          $ref: '#/components/schemas/AgreementAcceptanceMethod'
    ContactVerification:
      type: object
      description: 'Email and/or phone verification state for the customer. This object is **only present when the customer''s regulatory jurisdiction requires contact verification** (e.g. EU customers). For customers who have no such requirement, this object is omitted entirely — no action is needed.


        Each channel is reported independently: only the channels the customer''s provider actually requires are present. A provider may require both email and phone, just one of them, or — when the object is absent — neither. Every channel that **is** present must reach `VERIFIED` before the customer can begin KYC. Drive each present channel with `POST /customers/{customerId}/verify-email` and/or `POST /customers/{customerId}/verify-phone` (and their `/confirm` sub-routes).'
      properties:
        email:
          $ref: '#/components/schemas/ContactVerificationStatus'
          description: Verification status of the customer's email address. Present only when the provider requires email verification.
        phone:
          $ref: '#/components/schemas/ContactVerificationStatus'
          description: Verification status of the customer's phone number. Present only when the provider requires phone verification.
    BeneficialOwner:
      type: object
      required:
      - id
      - customerId
      - roles
      - ownershipPercentage
      - personalInfo
      - kycStatus
      - createdAt
      properties:
        id:
          type: string
          description: Unique identifier for this beneficial owner
          example: BeneficialOwner:019542f5-b3e7-1d02-0000-000000000001
        customerId:
          type: string
          description: The ID of the business customer this beneficial owner is associated with
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        roles:
          type: array
          items:
            $ref: '#/components/schemas/BeneficialOwnerRole'
          description: Roles of this person within the business
          example:
          - UBO
          - DIRECTOR
        ownershipPercentage:
          type: integer
          description: Percentage of ownership in the business (0-100)
          minimum: 0
          maximum: 100
          example: 51
        personalInfo:
          $ref: '#/components/schemas/BeneficialOwnerPersonalInfo'
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
        createdAt:
          type: string
          format: date-time
          description: When this beneficial owner was created
          example: '2025-10-03T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: When this beneficial owner was last updated
          example: '2025-10-03T12:00:00Z'
    KybStatus:
      type: string
      enum:
      - UNVERIFIED
      - PENDING
      - APPROVED
      - REJECTED
      - HOLD
      description: The current KYB status of a business customer. `HOLD` means the customer is placed on hold and may be required to update or provide more information.
      example: APPROVED
    AnnualIncomeRange:
      type: string
      enum:
      - UNDER_50K
      - RANGE_50K_100K
      - RANGE_100K_250K
      - RANGE_250K_1M
      - OVER_1M
      description: Bucketed annual income (USD equivalent). Used for enhanced due diligence on higher-risk profiles.
      example: RANGE_100K_250K
    BusinessInfoResponse:
      type: object
      description: 'Business information returned on a customer. `taxId` and `incorporatedOn` are

        required on creation only when the customer''s currency uses direct

        customer-owned accounts, so both are optional in responses.

        '
      required:
      - legalName
      properties:
        legalName:
          type: string
          description: Legal name of the business
          example: Acme Corporation, Inc.
        doingBusinessAs:
          type: string
          description: Trade name or DBA name of the business, if different from the legal name
          example: Acme
        country:
          type: string
          description: Country of incorporation or registration (ISO 3166-1 alpha-2)
          example: US
        registrationNumber:
          type: string
          description: Business registration number
          example: '5523041'
        incorporatedOn:
          type: string
          format: date

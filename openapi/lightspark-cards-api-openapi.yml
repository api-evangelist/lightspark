        details:
          type: object
          description: Additional error details
          additionalProperties: true
    GridEnvironment:
      type: string
      enum:
      - SANDBOX
      - PRODUCTION
      description: Session environment. The iframeUrl already selects the matching environment.
      example: SANDBOX
    Card:
      type: object
      required:
      - id
      - customerId
      - status
      - form
      - fundingSource
      - maxSpendPerTransaction
      - maxSpendPerDay
      - maxTransactionsPerDay
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          description: System-generated unique card identifier
          example: Card:019542f5-b3e7-1d02-0000-000000000010
        customerId:
          type: string
          description: The id of the `Customer` who holds this card.
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        platformCardId:
          type: string
          description: Platform-specific card identifier generated by the server.
          example: card-emp-001
        status:
          $ref: '#/components/schemas/CardStatus'
        statusReason:
          $ref: '#/components/schemas/CardStatusReason'
          description: Reason associated with the current `status`. Present when the card is `PENDING_AUTH`, `CLOSED`, or when provisioning was rejected; absent otherwise.
        brand:
          $ref: '#/components/schemas/CardBrand'
        form:
          $ref: '#/components/schemas/CardForm'
        pinStatus:
          $ref: '#/components/schemas/CardPinStatus'
        pinUnblockAvailableAt:
          type: string
          format: date-time
          readOnly: true
          description: Earliest time another PIN unblock attempt is allowed. Absent until the unblock allowance is used. Changing the PIN does not reset this time.
          example: '2026-10-15T15:00:00Z'
        last4:
          type: string
          description: Last four digits of the card PAN.
          example: '4242'
        expMonth:
          type: integer
          minimum: 1
          maximum: 12
          description: Card expiration month (1–12).
          example: 12
        expYear:
          type: integer
          description: Card expiration year (four digits).
          example: 2029
        fundingSource:
          type: string
          description: Internal account id that funds this card.
          example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
        cardCapabilities:
          $ref: '#/components/schemas/CardCapabilities'
          description: Actions supported for this card by the issuer selected at issuance. Present for cards whose program has been resolved; absent otherwise. These capabilities are fixed at issuance for the card's lifetime.
        maxSpendPerTransaction:
          anyOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
          description: The largest amount this card can authorize on a single transaction, in the smallest unit of its `currency` (cents for USD). An authorization for exactly the limit is allowed. A later clearing can still settle above it — a restaurant tip, for example — so this caps the authorization, not the final settled amount. `null` means the card sets no limit of its own. If your platform config also sets `cardConfigs.maxSpendPerTransaction` (the platform-level limit), the lower of the two applies and this value stays as you set it.
          example: 5000
        maxSpendPerDay:
          anyOf:
          - type: integer
            format: int64
            minimum: 1
            maximum: 9007199254740991
          - type: 'null'
          description: Card-specific cap on cumulative new spend during one UTC calendar day, in the smallest unit of the card's `currency`. The window resets at 00:00 UTC. Null means the card has no card-specific daily cap. When the platform config also supplies `cardConfigs.maxSpendPerDay`, Grid enforces the lower of the two values without replacing this configured value. Refunds, reversals, and authorization expiries do not restore capacity during the day. Spend exactly equal to the effective limit is allowed.
          example: 25000
        maxTransactionsPerDay:
          anyOf:
          - type: integer
            format: int32
            minimum: 1
            maximum: 2147483647
          - type: 'null'
          description: Card-specific cap on the number of transactions the card may authorize during one UTC calendar day. The window resets at 00:00 UTC. Null means the card has no card-specific daily transaction cap. When the platform config also supplies `cardConfigs.maxTransactionsPerDay`, Grid enforces the lower of the two values without replacing this configured value. Each approved authorization counts once for the day it was authorized; refunds, reversals, and authorization expiries do not restore capacity during the day. A transaction that brings the day's count exactly to the effective limit is allowed.
          example: 20
        allowedMccs:
          type: array
          minItems: 1
          description: Merchant category codes the card may spend at. Present only on a card issued for an agent; absent when that card may spend at any category not blocked.
          items:
            type: string
            pattern: ^[0-9]{4}$
          example:
          - '5411'
        blockedMccs:
          type: array
          description: 'Merchant category codes a card issued for an agent declines, with `cardDeclinedReason: BLOCKED`. Present only on such a card, which also declines Grid''s default agent categories unless `defaultMccBlocksLifted` is true.'
          items:
            type: string
            pattern: ^[0-9]{4}$
          example:
          - '7995'
        agentId:
          type: string
          description: The agent the card was issued for, when there is one.
          example: Agent:019542f5-b3e7-1d02-0000-000000000042
        defaultMccBlocksLifted:
          type: boolean
          description: Whether the platform lifted Grid's default agent merchant-category blocks on this card. Present only for a card issued for an agent.
          example: false
        currency:
          type: string
          description: Currency the card transacts in, fixed at issuance by its card program. USDB-funded cards transact in USD, with funding converted at 1 USDB = 1 USD. Spending limits use the smallest unit of the card's currency (USD cents for USDB-funded cards). Changing the funding source does not change the card's currency or spending-limit units.
          example: USD
        processorRef:
          type: string
          description: Opaque processor-side reference for the card (e.g. the Lithic card token). Useful for cross-referencing in the processor's dashboards; not used for any Grid request routing.
          example: card_b81c2a4f
        issuerRef:
          type: string
          description: Opaque identifier for the card on the issuer of record (e.g. the Lead Bank account/card identifier). Useful for cross-referencing in issuer dashboards; not used for any Grid request routing.
          example: lead_card_7a1b9c3d
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp
          example: '2026-05-08T14:10:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp
          example: '2026-05-08T14:11:00Z'
    CardListResponse:
      type: object
      required:
      - data
      - hasMore
      properties:
        data:
          type: array
          description: List of cards matching the filter criteria
          items:
            $ref: '#/components/schemas/Card'
        hasMore:
          type: boolean
          description: Indicates if more results are available beyond this page
        nextCursor:
          type: string
          description: Cursor to retrieve the next page of results (only present if hasMore is true)
        totalCount:
          type: integer
          description: Total number of cards matching the criteria (excluding pagination)
    Error409:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | TRANSACTION_NOT_PENDING_PLATFORM_APPROVAL | Transaction is not pending platform approval |

            | TRANSACTION_NOT_CANCELLABLE | Transaction has already settled or is otherwise past the point where it can be cancelled |

            | UMA_ADDRESS_EXISTS | UMA address already exists |

            | EMAIL_OTP_EMAIL_ALREADY_EXISTS | Email address is already associated with an EMAIL_OTP credential |

            | EMAIL_OTP_CREDENTIAL_SET_CHANGED | Tied EMAIL_OTP credential set changed after the signed-retry challenge was issued |

            | PASSKEY_ALREADY_ENROLLED | The customer already has an enrolled passkey factor; only one passkey per customer is supported. Delete the existing one before enrolling another |

            | SCA_SESSION_REQUIRED | The customer''s Strong Customer Authentication login session is missing or expired. Re-authenticate the customer, then retry the request. Distinct from a `401`, which means the platform''s own API credentials were rejected |

            | BENEFICIARY_TRUSTED | The external account is currently a trusted beneficiary, so it cannot be deleted. Untrust it first via `POST /customers/external-accounts/{externalAccountId}/untrust` (and its `/confirm`), then delete |

            | BANK_ACCOUNT_VALIDATION_PENDING | The US bank account on this request is still being validated. Grid verifies a newly added ACH account by sending a micro-entry and waiting out the return window, which takes a few banking days. The account is not rejected; retry once validation completes. A permanently failed account returns `400 INVALID_BANK_ACCOUNT` instead |

            | INVALID_STATE_TRANSITION | The requested card `status` transition is not one of `ACTIVE ⇄ FROZEN` or `ACTIVE \| FROZEN → CLOSED`, or the card cannot be unfrozen by the platform because Grid froze it for review, it was frozen as `COMPROMISED`, or its customer is not `ACTIVE` |

            | CARD_ALREADY_CLOSED | `status: CLOSED` was requested for a card that is already `CLOSED` |

            | CARD_NOT_MUTABLE | The card is `CLOSED`, so it can no longer be mutated |

            | PIN_CHANGE_REQUIRED | The card''s PIN unblock allowance is consumed for seven days. Change the PIN to recover sooner. `details.pinUnblockAvailableAt` gives the next allowed unblock time |

            | CARD_LIMIT_REACHED | The platform has reached the maximum number of live cards it may hold, or the cardholder already holds a card and the platform is limited to one per cardholder. Closing a card frees its slot; contact Lightspark to raise the limit |

            | STABLECOIN_GRID_ENABLEMENT_NOT_REQUESTABLE | Grid enablement can only be requested while the stablecoin is `NOT_ENABLED` (a repeat request while already `PENDING_APPROVAL` succeeds). `ENABLING`, `ENABLED` and `DISABLED` are driven by Lightspark and cannot be requested |

            | NOT_YET_AVAILABLE | The request is valid, but its result is not available yet because the data it depends on could still change. Retry later. `reason` says what is outstanding. For balance changes, card settlement for a window boundary has not closed |

            | CONFLICT | Generic resource-state conflict. Returned, for example, when `platformCustomerId` on a customer create call collides with an existing active customer on the same platform |

            | DOCUMENT_ALREADY_EXISTS | A document of this type already exists for the holder; replace it with PUT |

            | DUPLICATE_EXTERNAL_ACCOUNT | An equivalent external account already exists. When the conflicting account belongs to your platform, `details.externalAccountId` and `details.platformAccountId` identify it; otherwise `details` is omitted |

            | DUPLICATE_PAY_REQUEST | A pay request with this idempotency key already exists |

            | OPERATION_IN_PROGRESS | A conflicting Embedded Wallet operation is still in progress |

            | SMS_OTP_CREDENTIAL_SET_CHANGED | The SMS_OTP credential set changed while the request was in flight |

            | SMS_OTP_PHONE_NUMBER_ALREADY_EXISTS | The phone number is already associated with an SMS_OTP credential |

            | STABLECOIN_SYMBOL_ALREADY_EXISTS | A stablecoin with this symbol is already registered |

            | STABLECOIN_TOKEN_IDENTIFIER_ALREADY_EXISTS | A stablecoin with this token identifier is already registered |

            | WALLET_NOT_PROVISIONED | The embedded wallet has not been provisioned |

            | PAYMENT_DOCUMENT_ALREADY_USED | The payment document is already attached to a quote. A document can be used on one quote only, so upload the file again to use it on another quote |

            '
          enum:
          - TRANSACTION_NOT_PENDING_PLATFORM_APPROVAL
          - TRANSACTION_NOT_CANCELLABLE
          - UMA_ADDRESS_EXISTS
          - EMAIL_OTP_EMAIL_ALREADY_EXISTS
          - EMAIL_OTP_CREDENTIAL_SET_CHANGED
          - PASSKEY_ALREADY_ENROLLED
          - SCA_SESSION_REQUIRED
          - BENEFICIARY_TRUSTED
          - BANK_ACCOUNT_VALIDATION_PENDING
          - INVALID_STATE_TRANSITION
          - CARD_ALREADY_CLOSED
          - CARD_NOT_MUTABLE
          - PIN_CHANGE_REQUIRED
          - CARD_LIMIT_REACHED
          - STABLECOIN_GRID_ENABLEMENT_NOT_REQUESTABLE
          - NOT_YET_AVAILABLE
          - CONFLICT
          - DOCUMENT_ALREADY_EXISTS
          - DUPLICATE_EXTERNAL_ACCOUNT
          - DUPLICATE_PAY_REQUEST
          - OPERATION_IN_PROGRESS
          - SMS_OTP_CREDENTIAL_SET_CHANGED
          - SMS_OTP_PHONE_NUMBER_ALREADY_EXISTS
          - STABLECOIN_SYMBOL_ALREADY_EXISTS
          - STABLECOIN_TOKEN_IDENTIFIER_ALREADY_EXISTS
          - WALLET_NOT_PROVISIONED
          - PAYMENT_DOCUMENT_ALREADY_USED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true

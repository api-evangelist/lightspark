    Error401:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | UNAUTHORIZED | Issue with API credentials |

            | INVALID_SIGNATURE | Signature header is invalid |

            | WALLET_SIGNATURE_MISSING | The `Grid-Wallet-Signature` header is required for this Embedded Wallet action but was not supplied |

            | WALLET_SIGNATURE_MALFORMED | The `Grid-Wallet-Signature` header could not be parsed (bad encoding, structure, or fields) |

            | WALLET_SIGNATURE_BODY_MISMATCH | The `Grid-Wallet-Signature` was computed over a different request body than the one received |

            | WALLET_SIGNATURE_INVALID | The `Grid-Wallet-Signature` failed cryptographic verification against the registered credential |

            | REQUEST_ID_MISSING | The `Request-Id` header is required on the signed retry but was not supplied (paired with `Grid-Wallet-Signature`) |

            '
          enum:
          - UNAUTHORIZED
          - INVALID_SIGNATURE
          - WALLET_SIGNATURE_MISSING
          - WALLET_SIGNATURE_MALFORMED
          - WALLET_SIGNATURE_BODY_MISMATCH
          - WALLET_SIGNATURE_INVALID
          - REQUEST_ID_MISSING
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    ApplePayTokenizationResponse:
      title: Apple Pay Tokenization Response
      allOf:
      - $ref: '#/components/schemas/CardTokenizationResponse'
      - $ref: '#/components/schemas/ApplePayTokenizationResponseFields'
    DigitalWallet:
      type: string
      enum:
      - APPLE_PAY
      - GOOGLE_PAY
      - SAMSUNG_PAY
      description: The digital wallet a card is being added to.
      example: APPLE_PAY
    FieldConstraint:
      type: object
      description: Machine-readable validator hint accompanying a 400 `INVALID_INPUT` error. Consumers use it to drive form UI (input types, dropdowns, masking, length limits) and to pre-validate the field client-side before re-submitting. Fields are additive.
      properties:
        format:
          type: string
          description: Named format the value must satisfy — HTML5 input type names (`email`, `tel`, `url`, `date`, ...) or semantic slugs (`iso3166-1-alpha-2`, `bcp47-language-tag`, `us-ssn`, `e.164`).
          example: email
        pattern:
          type: string
          description: Regular expression the value must match (JavaScript-flavor).
          example: ^\d{5}(-\d{4})?$
        enum:
          type: array
          items:
            type: string
          description: Allowed values when the field is drawn from a fixed set.
          example:
          - SSN
          - ITIN
          - NON_US_TAX_ID
        minLength:
          type: integer
          description: Minimum length in characters.
          example: 1
        maxLength:
          type: integer
          description: Maximum length in characters.
          example: 500
    GooglePayTokenizationRequestFields:
      type: object
      required:
      - wallet
      - walletAccountId
      - serverSessionId
      properties:
        wallet:
          type: string
          enum:
          - GOOGLE_PAY
          description: Discriminator value identifying a Google Pay request.
          example: GOOGLE_PAY
        walletAccountId:
          type: string
          description: The stable identifier of the Google Wallet account the card is being added to, as reported by the TapAndPay client.
          example: wallet-account-8f14e45f
        serverSessionId:
          type: string
          format: uuid
          description: The `serverSessionId` Google supplies in the TapAndPay payment-credentials callback under Unified Push Provisioning.
          example: 8c3b8a7e-2a5d-4b7f-9c1e-6d2f0a1b3c4d
        deviceId:
          type: string
          description: The stable device identifier from `getStableHardwareId`, when the SDK supplies one. Unified Push Provisioning does not always.
          example: device-3c59dc04
        opaquePaymentCardRequested:
          type: boolean
          default: false
          description: Set to the value Google supplies in the payment-credentials callback. When `true`, the response also carries `googleAccountPayload`, which saves the card to the cardholder's Google Account for online payments in addition to the device token.
          example: false
    ApplePayTokenizationResponseFields:
      type: object
      required:
      - wallet
      - applePay
      properties:
        wallet:
          type: string
          enum:
          - APPLE_PAY
          description: Discriminator value identifying an Apple Pay response.
          example: APPLE_PAY
        applePay:
          $ref: '#/components/schemas/CardTokenizationApplePayPayload'
    Error403:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | FORBIDDEN | Insufficient permissions |

            | USER_NOT_READY | Customer exists but is not ready for operation |

            | COUNTERPARTY_NOT_ALLOWED | Counterparty has not been enabled for your account |

            | VELOCITY_LIMIT_EXCEEDED | Counterparty has exceeded velocity limits |

            | END_USER_TERMS_NOT_ACCEPTED | Customer has not accepted the End User Terms |

            | CUSTOMER_NOT_VERIFIED | The customer is not verified and cannot perform this action |

            | SANCTION_BLOCKED | Blocked by sanction screening |

            | DESTINATION_NOT_ALLOWED | The agent may not pay this destination |

            '
          enum:
          - FORBIDDEN
          - USER_NOT_READY
          - COUNTERPARTY_NOT_ALLOWED
          - VELOCITY_LIMIT_EXCEEDED
          - END_USER_TERMS_NOT_ACCEPTED
          - CUSTOMER_NOT_VERIFIED
          - SANCTION_BLOCKED
          - DESTINATION_NOT_ALLOWED
        reason:
          type: string

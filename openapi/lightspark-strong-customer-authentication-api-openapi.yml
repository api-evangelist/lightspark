    ScaLoginCompleteRequest:
      type: object
      description: Completes an SCA login by submitting the proof for the started factor. Carries the same proof fields as an `ScaAuthorization` (`code` for `SMS_OTP` / `TOTP`, or `passkeyAssertion` + `origin` for `PASSKEY`), plus the `factor` being completed and, for `SMS_OTP`, the `challengeId` returned by the login start.
      required:
      - factor
      anyOf:
      - required:
        - code
      - required:
        - passkeyAssertion
        - origin
      properties:
        factor:
          $ref: '#/components/schemas/ScaFactor'
          description: The factor being completed; must match the started login.
        challengeId:
          type:
          - string
          - 'null'
          description: The challenge handle returned by the login start, required for `SMS_OTP` and omitted for other factors.
        code:
          type:
          - string
          - 'null'
          description: The one-time code the customer received by SMS, or read from their authenticator app. Provide for `SMS_OTP` / `TOTP`. In sandbox, the code is always `123456`.
          example: '123456'
        passkeyAssertion:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Opaque WebAuthn assertion produced by the device from the login start's `passkeyOptions`. Required when completing a `PASSKEY` login.
        origin:
          type:
          - string
          - 'null'
          description: The WebAuthn origin the `passkeyAssertion` was produced against (one of the login start's `allowedOrigins`). Required alongside `passkeyAssertion`; omit it for the `code` path.
          example: https://app.example.com
    ScaFactorEnrollRequestOneOf:
      oneOf:
      - $ref: '#/components/schemas/TotpFactorEnrollRequest'
      - $ref: '#/components/schemas/PasskeyFactorEnrollRequest'
      discriminator:
        propertyName: type
        mapping:
          TOTP: '#/components/schemas/TotpFactorEnrollRequest'
          PASSKEY: '#/components/schemas/PasskeyFactorEnrollRequest'
      description: Which SCA factor to begin enrolling, selected by `type`. `SMS_OTP` is not enrollable (it uses the customer's verified phone), so only `TOTP` and `PASSKEY` are valid here.
    Currency:
      type: object
      properties:
        code:
          type: string
          description: Three-letter currency code (ISO 4217) for fiat currencies. Some cryptocurrencies may use their own ticker symbols (e.g. "BTC" for Bitcoin, "USDC" for USDC, etc.)
          example: USD
        name:
          type: string
          description: Full name of the currency
          example: United States Dollar
        symbol:
          type: string
          description: Symbol of the currency
          example: $
        decimals:
          type: integer
          description: Number of decimal places for the currency
          minimum: 0
          example: 2
    Error423:
      type: object
      required:
      - message
      - status
      - code
      properties:
        status:
          type: integer
          enum:
          - 423
          description: HTTP status code
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | ACCOUNT_LOCKED | The customer''s login is temporarily locked (or suspended) after too many failed attempts. Inspect `details.lockedUntil` for when the customer may retry, and `details.failedAttempts` for the current count. |

            '
          enum:
          - ACCOUNT_LOCKED
        message:
          type: string
          description: Error message
        details:
          type: object
          description: Lockout detail. `lockedUntil` is the UTC timestamp the customer may retry after (absent when suspended indefinitely); `failedAttempts` is the current cumulative failed-login count; `suspended` is true when the account is locked with no automatic expiry.
          properties:
            suspended:
              type: boolean
            lockedUntil:
              type:
              - string
              - 'null'
              format: date-time
            failedAttempts:
              type: integer
          additionalProperties: true
    BwpAccountInfoBase:
      type: object
      required:
      - accountType
      - phoneNumber
      - provider
      properties:
        accountType:
          type: string
          enum:
          - BWP_ACCOUNT
        phoneNumber:
          type: string
          description: The phone number in international format
          example: '+1234567890'
          minLength: 7
          maxLength: 15
          pattern: ^\+[0-9]{6,14}$
        provider:
          type: string
          description: The mobile money provider name
          minLength: 1
          maxLength: 255
      example:
        accountType: BWP_ACCOUNT
        phoneNumber: '+1234567890'
        provider: Example Provider
    PasskeyFactorEnrollRequest:
      type: object
      title: Passkey Factor Enroll Request
      description: Start enrolling a WebAuthn passkey factor.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - PASSKEY
          description: Discriminator selecting the passkey factor. Passkey enrollment needs no other input at start.
    ScaFactorConfirmRequestOneOf:

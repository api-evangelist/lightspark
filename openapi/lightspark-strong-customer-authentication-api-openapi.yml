          example: '2025-10-03T12:05:00Z'
        passkeyOptions:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Opaque WebAuthn assertion request options. Present only for `PASSKEY`; pass to the device's WebAuthn API to produce the assertion submitted on the complete call.
        allowedOrigins:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The origins the WebAuthn ceremony may run against. Present only for `PASSKEY`.
          example:
          - https://app.example.com
        relyingPartyId:
          type:
          - string
          - 'null'
          description: The WebAuthn relying-party id. Present only for `PASSKEY`.
          example: app.example.com

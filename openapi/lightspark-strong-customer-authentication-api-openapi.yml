openapi: 3.2.0
info:
  title: Grid Strong Customer Authentication API
  description: API for managing global payments on the open Money Grid. Built by Lightspark. See the full documentation at https://docs.lightspark.com/.
  version: '2025-10-13'
  contact:
    name: Lightspark Support
    email: support@lightspark.com
  license:
    name: Proprietary
    url: https://lightspark.com/terms
servers:
- url: https://api.lightspark.com/grid/2025-10-13
  description: Production server
security:
- BasicAuth: []
- AgentAuth: []
tags:
- name: Strong Customer Authentication
  description: Endpoints for authorizing money-movement operations that require Strong Customer Authentication. Relevant only for customers in a region where SCA is required (e.g. EU); customers outside SCA-regulated regions never see an SCA challenge and these endpoints return 409.
paths:
  /sca/factors:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer whose factors are listed or enrolled.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    get:
      summary: List enrolled SCA factors
      description: 'List the Strong Customer Authentication factors the customer has enrolled.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: listScaFactors
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      responses:
        '200':
          description: The customer's enrolled SCA factors.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaFactorList'
        '400':
          description: The authentication provider rejected the request as caller input, for example a malformed factor or reset reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    post:
      summary: Start SCA factor enrollment
      description: 'Begin enrolling an SCA factor for the customer. Enrollment covers the

        explicit, opt-in factors a customer chooses to add — the request body''s

        `type` selects `TOTP` or `PASSKEY`. Returns the factor-specific material

        needed to finish via `POST /sca/factors/confirm`.


        `SMS_OTP` is implicit and is not enrolled through this endpoint. Every

        customer in an SCA-regulated region has a verified phone number from

        customer creation (via the Contact Verification flows —

        `POST /customers/{customerId}/verify-phone` and `.../verify-phone/confirm`),

        so SMS is always available as a factor with no extra setup and appears

        among the customer''s enrolled factors in `GET /sca/factors`.


        A customer may have **only one passkey**. Starting a passkey enrollment when

        one is already enrolled returns `409` (`PASSKEY_ALREADY_ENROLLED`) — delete it

        via `DELETE /sca/factors/{credentialId}` first.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: startScaFactorEnrollment
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaFactorEnrollRequestOneOf'
      responses:
        '200':
          description: Enrollment started; the factor-specific completion material is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaFactorEnrollStartOneOf'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer (`CONFLICT`), or a passkey enrollment was requested while one is already enrolled (`PASSKEY_ALREADY_ENROLLED`) — only one passkey per customer is supported.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/factors/confirm:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer confirming a factor enrollment.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    post:
      summary: Confirm SCA factor enrollment
      description: 'Finalize the factor enrollment started by `POST /sca/factors`. The request

        body is discriminated by `type`: for `TOTP`, submit the shared `secret` from

        the start call plus the first `code`; for `PASSKEY`, submit the WebAuthn

        `credential` the device produced plus the `origin` it was produced against.

        The threaded secret/credential binds the confirmation to its enrollment, so

        no separate id is needed.


        A TOTP confirmation returns one-time recovery codes (shown once); a passkey

        confirmation returns the enrolled factor.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.


        In sandbox, the TOTP code is always `123456`.'
      operationId: confirmScaFactorEnrollment
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaFactorConfirmRequestOneOf'
      responses:
        '200':
          description: Factor enrolled; the factor-specific result is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaFactorConfirmResponseOneOf'
        '400':
          description: Invalid or incorrect confirmation proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/factors/{credentialId}:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer whose factor is being deleted.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    - name: credentialId
      in: path
      description: The credential id of the enrolled factor to delete (from the factor's `credentialId`).
      required: true
      schema:
        type: string
    delete:
      summary: Delete an enrolled SCA factor
      description: 'Delete an enrolled SCA factor by its credential id. Today only `PASSKEY`

        factors carry a `credentialId` and are deletable this way.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: deleteScaFactor
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      responses:
        '204':
          description: Factor deleted; no content is returned.
        '400':
          description: The authentication provider rejected the request as caller input, for example a malformed factor or reset reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer or factor not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/login/start:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer starting an SCA login.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    post:
      summary: Start an SCA login
      description: 'Begin an SCA login for the customer with the chosen factor, opening the

        end-user SCA session (an exemption gating read / account access beyond the

        per-transaction window). Returns factor-specific material: `SMS_OTP`

        dispatches a code and returns a `challengeId` + `expiresAt`; `TOTP` returns

        only the factor (the customer reads the code from their app); `PASSKEY`

        returns WebAuthn `passkeyOptions`. Complete with

        `POST /sca/login/complete`.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: startScaLogin
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaLoginStartRequest'
      responses:
        '200':
          description: SCA login started; factor-specific material is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaLoginStart'
        '400':
          description: Invalid or unknown factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/login/complete:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer completing an SCA login.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    post:
      summary: Complete an SCA login
      description: 'Finalize an SCA login by submitting the proof for the started factor

        (`code` for `SMS_OTP` / `TOTP`, or `passkeyAssertion` + `origin` for

        `PASSKEY`), echoing the `challengeId` for `SMS_OTP`. Returns the

        reported session status.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.


        In sandbox, the SMS/TOTP code is always `123456`.'
      operationId: completeScaLogin
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaLoginCompleteRequest'
      responses:
        '200':
          description: SCA login completed; the session status is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScaLoginComplete'
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '423':
          description: The customer's login is locked (or suspended) after too many failed attempts. `details.lockedUntil` says when they may retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error423'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/record-event:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer the security event is recorded for.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    post:
      summary: Record a security event
      description: 'Record a client-side security-relevant event for the customer with Grid''s risk engine (e.g. a sign-in, a sensitive view), to

        feed adaptive-authentication signals.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: recordSecurityEvent
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSecurityEventRequest'
      responses:
        '200':
          description: Event recorded; the customer's resulting login-security state is returned (including any lockout).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordSecurityEventResponse'
        '400':
          description: Invalid event type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '423':
          description: The customer's login is locked (or suspended) after too many failed attempts. `details.lockedUntil` says when they may retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error423'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/factors/reset:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer resetting a factor.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    post:
      summary: Start a 2FA reset
      description: 'Begin recovering a lost enrolled factor via a liveness-gated, poll-based

        flow. Opens the liveness check and returns a `resetId` plus the

        opaque liveness handles (`livenessAccessToken` / `verificationLink`) the end

        user completes it with. Poll

        `GET /sca/factors/reset/{resetId}` until liveness

        passes, then call the complete endpoint.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: startTwoFactorReset
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorResetStartRequest'
      responses:
        '201':
          description: Reset initiated; the reset handle and liveness material are returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorResetStart'
        '400':
          description: Invalid or unknown factor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '429':
          description: Too many reset attempts. Reset initiation is rate-limited to 5 per 24 hours per customer; retry after the window indicated by `Retry-After`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/factors/reset/{resetId}:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer whose reset status is polled.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    - name: resetId
      in: path
      description: The reset handle returned by the start call.
      required: true
      schema:
        type: string
    get:
      summary: Get 2FA reset status
      description: 'Poll the status of an in-progress 2FA reset until it reaches the liveness-passed value, after which the reset can be completed.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: getTwoFactorResetStatus
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      responses:
        '200':
          description: The current reset status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorResetStatus'
        '400':
          description: The authentication provider rejected the request as caller input, for example a malformed factor or reset reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer or reset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /sca/factors/reset/{resetId}/complete:
    parameters:
    - name: customerId
      in: query
      description: The unique identifier of the customer completing the reset.
      required: true
      schema:
        type: string
      example: Customer:019542f5-b3e7-1d02-0000-000000000001
    - name: resetId
      in: path
      description: The reset handle returned by the start call.
      required: true
      schema:
        type: string
    post:
      summary: Complete a 2FA reset
      description: 'Complete a 2FA reset once liveness has passed, clearing the lost factor so

        the customer can re-enroll.


        The body is required and must carry the end user''s `endUserIpAddress`. For an

        `SMS_OTP` reset, also supply the new `mobile` number — completing the reset

        enrolls it as the customer''s number; other factors need no `mobile`.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: completeTwoFactorReset
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorResetCompleteRequest'
      responses:
        '204':
          description: Reset completed; no content is returned.
        '400':
          description: Reset not ready (liveness not yet passed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer or reset not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/external-accounts/{externalAccountId}/trust:
    parameters:
    - name: externalAccountId
      in: path
      description: The unique identifier of the external account (beneficiary) being trusted.
      required: true
      schema:
        type: string
    post:
      summary: Start trusting a beneficiary
      description: 'Begin trusting (whitelisting) an external account so future sends to it can

        skip the per-transaction SCA ceremony. Returns the `scaChallenge` to satisfy

        (when one is issued). Complete with

        `POST /customers/external-accounts/{externalAccountId}/trust/confirm`.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: startBeneficiaryTrust
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Beneficiary trust started; the SCA challenge (if any) is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryTrustStart'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer or external account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/external-accounts/{externalAccountId}/trust/confirm:
    parameters:
    - name: externalAccountId
      in: path
      description: The unique identifier of the external account (beneficiary) being trusted.
      required: true
      schema:
        type: string
    post:
      summary: Confirm trusting a beneficiary
      description: 'Finalize trusting a beneficiary (identified by the `externalAccountId` in the

        path) by submitting the SCA proof (`code` for `SMS_OTP` / `TOTP`, or

        `passkeyAssertion` + `origin` for `PASSKEY`), echoing the `challengeId` when

        one was issued. Returns `trusted: true`.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.


        In sandbox, the SMS/TOTP code is always `123456`.'
      operationId: confirmBeneficiaryTrust
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryTrustConfirmRequest'
      responses:
        '200':
          description: Beneficiary trusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryTrustConfirm'
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer or external account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/external-accounts/{externalAccountId}/untrust:
    parameters:
    - name: externalAccountId
      in: path
      description: The unique identifier of the external account (beneficiary) being untrusted.
      required: true
      schema:
        type: string
    post:
      summary: Start untrusting a beneficiary
      description: 'Begin untrusting (removing the trusted mark from) an external account, so

        future sends to it are dynamically linked and require the per-transaction SCA

        ceremony again. Returns the `scaChallenge` to satisfy (when one is issued).

        Complete with

        `POST /customers/external-accounts/{externalAccountId}/untrust/confirm`.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.'
      operationId: startBeneficiaryUntrust
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Beneficiary untrust started; the SCA challenge (if any) is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryTrustStart'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer or external account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/external-accounts/{externalAccountId}/untrust/confirm:
    parameters:
    - name: externalAccountId
      in: path
      description: The unique identifier of the external account (beneficiary) being untrusted.
      required: true
      schema:
        type: string
    post:
      summary: Confirm untrusting a beneficiary
      description: 'Finalize untrusting a beneficiary (identified by the `externalAccountId` in

        the path) by submitting the SCA proof (`code` for `SMS_OTP` / `TOTP`, or

        `passkeyAssertion` + `origin` for `PASSKEY`), echoing the `challengeId` when

        one was issued. Returns `trusted: false`.


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.


        In sandbox, the SMS/TOTP code is always `123456`.'
      operationId: confirmBeneficiaryUntrust
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeneficiaryTrustConfirmRequest'
      responses:
        '200':
          description: Beneficiary untrusted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BeneficiaryTrustConfirm'
        '400':
          description: Invalid or expired proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer or external account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /quotes/{quoteId}/authorize:
    parameters:
    - name: quoteId
      in: path
      description: The unique identifier of the quote whose SCA challenge is being authorized.
      required: true
      schema:
        type: string
      example: Quote:019542f5-b3e7-1d02-0000-000000000006
    post:
      summary: Authorize a quote's SCA challenge
      description: 'Satisfy the Strong Customer Authentication challenge carried by a quote in

        `PENDING_AUTHORIZATION` status by submitting an `ScaAuthorization` proof.


        This is used for realtime-funding quotes: the quote is returned with an

        `scaChallenge` and **without** `paymentInstructions`; once authorized, the

        quote advances and its `paymentInstructions` are populated so the customer

        can fund the transfer.


        As with all SCA, a quote may require more than one authorization: after

        authorizing, if the quote is still `PENDING_AUTHORIZATION` it carries the

        next `scaChallenge` — authorize that too, repeating until it advances (see

        `ScaChallenge`).


        This endpoint is only meaningful for customers in a region where SCA is required (e.g. EU). For customers outside SCA-regulated regions, this returns `409`.


        In sandbox, the SMS code is always `123456`.'
      operationId: authorizeQuote
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScaAuthorization'
      responses:
        '200':
          description: Challenge authorized; the updated quote is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Invalid or expired authorization proof
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer, or the quote has no pending challenge to authorize. Also returned with `SCA_SESSION_REQUIRED` when the customer's SCA login session is missing or expired — re-authenticate the customer, then authorize again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '423':
          description: Returned with `ACCOUNT_LOCKED` when the customer's login is temporarily locked after too many failed authorization attempts. The customer must wait for the lock to expire before authorizing again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error423'
        '429':
          description: Too many requests. Returned with `RATE_LIMITED` when authorization attempts for this challenge happen too frequently (for example, repeated bad codes brute-forcing the OTP). The challenge may be invalidated after too many failed attempts. Clients should back off and retry after the interval indicated by the `Retry-After` response header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /quotes/{quoteId}/authorize/resend:
    parameters:
    - name: quoteId
      in: path
      description: The unique identifier of the quote whose SCA challenge code should be re-sent.
      required: true
      schema:
        type: string
      example: Quote:019542f5-b3e7-1d02-0000-000000000006
    post:
      summary: Resend a quote's SCA challenge code
      description: 'Re-send the one-time code for a realtime-funding quote in

        `PENDING_AUTHORIZATION` status whose `scaChallenge.factor` is `SMS_OTP`. The

        existing challenge is reused — no new challenge is issued, and its

        `scaChallenge.expiresAt` is **not** extended; once the challenge is past

        `expiresAt` it can no longer be authorized.


        Only meaningful for customers in a region where SCA is required (e.g. EU);

        a 409 is returned otherwise. `PASSKEY` challenges cannot be re-sent and return 409.


        In sandbox, the code is always `123456`.'
      operationId: resendQuoteScaCode
      tags:
      - Strong Customer Authentication
      security:
      - BasicAuth: []
      responses:
        '204':
          description: Code re-sent.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: SCA is not required for this customer, the quote has no pending SMS challenge, or the challenge uses a factor whose code cannot be re-sent (e.g. passkey).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '429':
          description: Too many requests. Returned with `RATE_LIMITED` when codes are re-sent too frequently, to avoid spamming the customer's phone. Clients should back off and retry after the interval indicated by the `Retry-After` response header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  schemas:
    PaymentSwiftAccountInfo:
      title: SWIFT Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/SwiftAccountInfo'
      - type: object
        required:
        - accountHolderName
        properties:
          accountHolderName:
            type: string
            description: The name of the account holder as it must appear on the wire. Remitting banks match this against the beneficiary name field, so payers should copy it exactly.
            example: Acme Exports Pte Ltd
            minLength: 1
            maxLength: 255
          bankAddress:
            type: string
            description: The address of the bank holding the account, when known.
            example: 12 Marina Boulevard, Singapore 018982
            minLength: 1
            maxLength: 1024
          reference:
            type: string
            description: Reference code to include with the payment when present. SWIFT payments are attributed by the destination account number/IBAN, so this account type typically requires no reference.
            example: UMA-Q12345-REF
    SwiftAccountInfoBase:
      type: object
      description: 'At least one of accountNumber or iban is always present: IBAN-only corridors (e.g. BR, GB) use iban, other corridors use accountNumber, and both appear when the bank exposes both identifiers for the same account.'
      required:
      - accountType
      - swiftCode
      - bankName
      - country
      properties:
        accountType:
          type: string
          enum:
          - SWIFT_ACCOUNT
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the bank account
          example: NG
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank
          example: DEUTDEFF
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
        bankName:
          type: string
          description: The name of the bank
          example: Deutsche Bank
          minLength: 1
          maxLength: 255
        accountNumber:
          type: string
          description: The bank account number. Required for most corridors. Use iban instead for IBAN-only corridors (e.g. BR, GB).
          example: '1234567890'
          minLength: 1
          maxLength: 34
        iban:
          type: string
          description: The IBAN of the bank account. Required for IBAN-only corridors (e.g. BR, GB). Use accountNumber for all other corridors.
          example: GB29NWBK60161331926819
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Za-z0-9]{11,30}$
      example:
        accountType: SWIFT_ACCOUNT
        country: NG
        swiftCode: DEUTDEFF
        bankName: Deutsche Bank
        accountNumber: '1234567890'
    PurposeOfPayment:
      type: string
      description: 'The purpose of the payment. This may be required when sending to certain geographies (e.g. India).


        Some destinations accept only certain purposes. A business payout to China must use one of the purposes listed in [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents), and each needs its own supporting documents.'
      enum:
      - GIFT
      - SELF
      - GOODS_OR_SERVICES
      - EDUCATION
      - HEALTH_OR_MEDICAL
      - REAL_ESTATE_PURCHASE
      - TAX_PAYMENT
      - LOAN_PAYMENT
      - UTILITY_BILL
      - DONATION
      - TRAVEL
      - FAMILY_SUPPORT
      - SALARY_PAYMENT
      - EXPORTED_GOODS_PREPAYMENT
      - EXPORTED_GOODS_POSTPAYMENT
      - SERVICE_CHARGES
      - OFFICE_EXPENSES
      - DELIVERY_FEES
      - HOTEL_ACCOMMODATION
      - COMMISSION_ON_GOODS
      - COMMISSION_ON_SERVICES
      - ACCOUNTING_SERVICES
      - EXHIBITION_SERVICES
      - OTHER
    BaseDestination:
      type: object
      required:
      - destinationType
      properties:
        destinationType:
          $ref: '#/components/schemas/DestinationType'
    ScaLoginCompleteRequest:
      type: object
      description: Completes an SCA login by submitting the proof for the started factor. Carries the same proof fields as an `ScaAuthorization` (`code` for `SMS_OTP` / `TOTP`, or `passkeyAssertion` + `origin` for `PASSKEY`), plus the `factor` being completed, the `endUserIpAddress` the login is being performed from, and, for `SMS_OTP`, the `challengeId` returned by the login start. Provide exactly one of `code` or `passkeyAssertion`, with `origin` alongside a `passkeyAssertion`.
      required:
      - factor
      - endUserIpAddress
      properties:
        factor:
          $ref: '#/components/schemas/ScaFactor'
          description: The factor being completed; must match the started login.
        endUserIpAddress:
          type: string
          description: The IP address of the end user's device completing this login, recorded against the login event by the SCA provider. Supply the customer's address, not your server's — it feeds the provider's risk assessment and any transaction-risk exemption.
          example: 203.0.113.42
        challengeId:
          type:
          - string
          - 'null'
          description: The challenge handle returned by the login start, required for `SMS_OTP` and omitted for other factors.
        code:
          type:
          - string
          - 'null'
          description: The one-time code the customer received by SMS, or read from their authenticator app. Provide for `SMS_OTP` / `TOTP`. In sandbox, the code is always `123456`.
          example: '123456'
        passkeyAssertion:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Opaque WebAuthn assertion produced by the device from the login start's `passkeyOptions`. Required when completing a `PASSKEY` login.
        origin:
          type:
          - string
          - 'null'
          description: The WebAuthn origin the `passkeyAssertion` was produced against (one of the login start's `allowedOrigins`). Required alongside `passkeyAssertion`; omit it for the `code` path.
          example: https://app.example.com
    AccountQuoteSource:
      title: Account
      allOf:
      - $ref: '#/components/schemas/BaseQuoteSource'
      - type: object
        required:
        - accountId
        - sourceType
        properties:
          sourceType:
            type: string
            enum:
            - ACCOUNT
          accountId:
            type: string
            description: Source account identifier
            example: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
          customerId:
            type: string
            description: The customer on whose behalf the transaction is being initiated. Required when funding from a `BULK_SETTLEMENT` account. The customer is never the account owner, because the platform owns the account. When funding from an FBO account, this field is optional. If you omit it, the transaction is initiated on behalf of the platform. For any other account, it defaults to the account owner's customerId.
            example: Customer:019542f5-b3e7-1d02-0000-000000000001
        description: Source account details
    Error429:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | RATE_LIMITED | Too many requests in a short window; retry after the interval indicated by the `Retry-After` response header |

            | DAILY_VOLUME_LIMIT_EXCEEDED | The requested amount would exceed the configured daily volume limit for this trade corridor or withdrawal currency |

            '
          enum:
          - RATE_LIMITED
          - DAILY_VOLUME_LIMIT_EXCEEDED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    StablecoinAssetType:
      type: string
      description: Type of asset
      enum:
      - USDC
      - USDT
    TotpFactorEnrollRequest:
      type: object
      title: TOTP Factor Enroll Request
      description: Start enrolling a time-based one-time-password (TOTP) authenticator factor.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - TOTP
          description: Discriminator selecting the TOTP factor. TOTP enrollment needs no other input at start.
    PasskeyEnrollmentStart:
      type: object
      description: Opaque WebAuthn registration options relayed to the end user's device to enroll a passkey factor. Grid performs no crypto; pass `options` to the device's WebAuthn API to produce a credential, then submit that credential to the confirm endpoint unmodified.
      required:
      - type
      - options
      - allowedOrigins
      - relyingPartyId
      properties:
        type:
          type: string
          enum:
          - PASSKEY
          description: Discriminator identifying this as the passkey enrollment-start payload.
        options:
          type: object
          additionalProperties: true
          description: Opaque WebAuthn `PublicKeyCredentialCreationOptions`. Pass to the device's WebAuthn registration API unmodified.
        allowedOrigins:
          type: array
          description: The origins the WebAuthn registration ceremony may run against. The origin the credential is produced against must be one of these and must be echoed back on the confirm call.
          items:
            type: string
          example:
          - https://app.example.com
        relyingPartyId:
          type: string
          description: The WebAuthn relying-party id the credential is bound to.
          example: app.example.com
    PaymentBrlAccountInfo:
      title: BRL Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - qrCode
        properties:
          accountType:
            type: string
            enum:
            - BRL_ACCOUNT
          qrCode:
            type: string
            description: A PIX QR code payload that can be used to fund the transaction. This can be rendered as a QR code image or pasted into a PIX-compatible banking app.
            minLength: 1
    ScaFactorConfirmResponseOneOf:
      oneOf:
      - $ref: '#/components/schemas/TotpEnrollmentConfirmResponse'
      - $ref: '#/components/schemas/PasskeyEnrollmentConfirmResponse'
      discriminator:
        propertyName: type
        mapping:
          TOTP: '#/components/schemas/TotpEnrollmentConfirmResponse'
          PASSKEY: '#/components/schemas/PasskeyEnrollmentConfirmResponse'
      description: The enrollment result, keyed by `type`.
    BeneficiaryTrustConfirmRequest:
      type: object
      description: Confirms trusting or untrusting a beneficiary by submitting the SCA proof. Carries the same proof fields as an `ScaAuthorization` (`code` for `SMS_OTP` / `TOTP`, or `passkeyAssertion` + `origin` for `PASSKEY`) and, when the start issued one, the `challengeId`. The beneficiary is identified by the `externalAccountId` in the path — no separate handle is needed. Provide exactly one of `code` or `passkeyAssertion`, with `origin` alongside a `passkeyAssertion`.
      properties:
        challengeId:
          type:
          - string
          - 'null'
          description: The challenge handle from the trust start's `scaChallenge`, when one was issued. Omit when the start returned no challenge.
        code:
          type:
          - string
          - 'null'
          description: The one-time code the customer received by SMS, or read from their authenticator app. Provide for `SMS_OTP` / `TOTP`. In sandbox, the code is always `123456`.
          example: '123456'
        passkeyAssertion:
          type:
          - object
          - 'null'
          additionalProperties: true
          description: Opaque WebAuthn assertion produced by the device from the challenge's assertion options. Required when satisfying a `PASSKEY` challenge.
        origin:
          type:
          - string
          - 'null'
          description: The WebAuthn origin the `passkeyAssertion` was produced against. Required alongside `passkeyAssertion`; omit it for the `code` path.
          example: https://app.example.com
    MxnAccountInfoBase:
      type: object
      required:
      - accountType
      - clabeNumber
      properties:
        accountType:
          type: string
          enum:
          - MXN_ACCOUNT
        clabeNumber:
          type: string
          description: The CLABE number of the bank
          example: '123456789012345678'
          minLength: 18
          maxLength: 18
          pattern: ^[0-9]{18}$
      example:
        accountType: MXN_ACCOUNT
        clabeNumber: '123456789012345678'
    Error401:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | UNAUTHORIZED | Issue with API credentials |

            | INVALID_SIGNATURE | Signature header is invalid |

            | WALLET_SIGNATURE_MISSING | The `Grid-Wallet-Signature` header is required for this Embedded Wallet action but was not supplied |

            | WALLET_SIGNATURE_MALFORMED | The `Grid-Wallet-Signature` header could not be parsed (bad encoding, structure, or fields) |

            | WALLET_SIGNATURE_BODY_MISMATCH | The `Grid-Wallet-Signature` was computed over a different request body than the one received |

            | WALLET_SIGNATURE_INVALID | The `Grid-Wallet-Signature` failed cryptographic verification against the registered credential |

            | REQUEST_ID_MISSING | The `Request-Id` header is required on the signed retry but was not supplied (paired with `Grid-Wallet-Signature`) |

            '
          enum:
          - UNAUTHORIZED
          - INVALID_SIGNATURE
          - WALLET_SIGNATURE_MISSING
          - WALLET_SIGNATURE_MALFORMED
          - WALLET_SIGNATURE_BODY_MISMATCH
          - WALLET_SIGNATURE_INVALID
          - REQUEST_ID_MISSING
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    TotpEnrollmentConfirmResponse:
      type: object
      description: The one-time recovery codes issued once a TOTP factor is enrolled. These are shown to the customer only once; store them somewhere safe to recover access if the authenticator device is lost.
      required:
      - type
      - recoveryCodes
      properties:
        type:
          type: string
          enum:
          - TOTP
          description: Discriminator identifying this as the TOTP enrollment result.
        recoveryCodes:
          type: array
          description: The one-time recovery codes for this TOTP factor.
          items:
            type: string
          example:
          - ABCD-EFGH-IJKL
          - MNOP-QRST-UVWX
    PaymentMxnAccountInfo:
      title: MXN Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/MxnAccountInfo'
      - type: object
        required:
        - reference
        properties:
          reference:
            type: string
            description: Unique reference code that must be included with the payment to properly credit it
            example: UMA-Q12345-REF
    UmaAddressDestination:
      title: UMA Address
      allOf:
      - $ref: '#/components/schemas/BaseDestination'
      - type: object
        required:
        - umaAddress
        - destinationType
        - currency
        properties:
          destinationType:
            type: string
            enum:
            - UMA_ADDRESS
          umaAddress:
            type: string
            maxLength: 200
            description: UMA address of the recipient
            example: $receiver@uma.domain.com
          currency:
            type: string
            description: Currency code for the destination. See [Supported Currencies](https://docs.lightspark.com/platform-overview/core-concepts/currencies-and-rails) for the full list of supported fiat and crypto currencies.
            example: EUR
        description: UMA address destination details
    TotpEnrollmentConfirmRequest:
      type: object
      description: The shared secret returned by the TOTP enrollment start, plus the first code the customer's authenticator app produces, submitted to confirm and finalize the TOTP factor.
      required:
      - type
      - secret
      - code
      properties:
        type:
          type: string
          enum:
          - TOTP
          description: Discriminator selecting the TOTP confirm variant.
        secret:
          type: string
          description: The shared secret returned as `secret` by the TOTP enrollment start, threaded back to bind the confirmation to that enrollment.
        code:
          type: string
          description: The current time-based one-time code from the customer's authenticator app. In sandbox, the code is always `123456`.
          example: '123456'
    PaymentArsAccountInfo:
      title: ARS Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - accountNumber
        properties:
          accountType:
            type: string
            enum:
            - ARS_ACCOUNT
          accountNumber:
            type: string
            description: The static CVU (Clave Virtual Uniforme) bank account number to pay to.
            minLength: 22
            maxLength: 22
            pattern: ^\d{22}$
            example: '0000003100074052501434'
    UsdAccountInfoBase:
      type: object
      required:
      - accountType
      - accountNumber
      - routingNumber
      properties:
        accountType:
          type: string
          enum:
          - USD_ACCOUNT
        accountNumber:
          type: string
          description: The account number of the bank
          minLength: 1
          maxLength: 34
        routingNumber:
          type: string
          description: The ABA routing number
          example: '021000021'
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{9}$
        bankName:
          type: string
          description: The name of the financial institution holding the account. Optional on every rail, and recommended for wires, where it identifies the beneficiary's institution on the payment message. Not checked against `GET /discoveries`.
          minLength: 1
          maxLength: 140
          example: Chase Bank
        intermediaryBankName:
          type: string
          description: The name of the intermediary financial institution, for accounts reachable only through a correspondent bank. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: JPMorgan Chase Bank
          minLength: 1
          maxLength: 140
        intermediaryRoutingNumber:
          type: string
          description: The ABA routing number of the intermediary financial institution. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: '021000021'
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{9}$
        fiToFiInformation:
          type: string
          description: Bank-to-bank instructions carried alongside the payment. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: /BNF/Invoice 4471
          maxLength: 210
      example:
        accountType: USD_ACCOUNT
        accountNumber: '1234567890'
        routingNumber: '021000021'
        bankName: Chase Bank
        intermediaryBankName: JPMorgan Chase Bank
        intermediaryRoutingNumber: '021000021'

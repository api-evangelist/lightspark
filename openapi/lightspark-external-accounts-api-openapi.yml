openapi: 3.2.0
info:
  title: Grid External Accounts API
  description: API for managing global payments on the open Money Grid. Built by Lightspark. See the full documentation at https://docs.lightspark.com/.
  version: '2025-10-13'
  contact:
    name: Lightspark Support
    email: support@lightspark.com
  license:
    name: Proprietary
    url: https://lightspark.com/terms
servers:
- url: https://api.lightspark.com/grid/2025-10-13
  description: Production server
security:
- BasicAuth: []
- AgentAuth: []
tags:
- name: External Accounts
  description: External account management endpoints for creating and managing external bank accounts
paths:
  /customers/external-accounts:
    get:
      summary: List Customer external accounts
      description: 'Retrieve a list of external accounts with optional filtering parameters. Returns all

        external accounts that match the specified filters. If no filters are provided, returns all external accounts

        (paginated).


        External accounts are bank accounts, cryptocurrency wallets, or other payment destinations that customers can use to receive funds from the platform.'
      operationId: listCustomerExternalAccounts
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      parameters:
      - name: currency
        in: query
        description: Filter by currency code
        required: false
        schema:
          type: string
      - name: customerId
        in: query
        description: Filter by external accounts associated with a specific customer
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination (returned from previous request)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountListResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    post:
      summary: Add a new external account
      description: Register a new external bank account for a customer.
      operationId: createCustomerExternalAccount
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerExternalAccountCreateRequest'
            examples:
              usBankAccount:
                summary: Create external US bank account
                value:
                  customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
                  currency: USD
                  accountInfo:
                    accountType: USD_ACCOUNT
                    accountNumber: '12345678901'
                    routingNumber: '021000021'
                    bankAccountType: CHECKING
                    bankName: Chase Bank
                    platformAccountId: ext_acc_123456
                    beneficiary:
                      beneficiaryType: INDIVIDUAL
                      fullName: John Doe
                      birthDate: '1990-01-15'
                      nationality: US
                      address:
                        line1: 123 Main Street
                        city: San Francisco
                        state: CA
                        postalCode: '94105'
                        country: US
              sparkWallet:
                summary: Create external Spark wallet
                value:
                  customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
                  currency: BTC
                  accountInfo:
                    accountType: SPARK_WALLET
                    address: spark1pgssyuuuhnrrdjswal5c3s3rafw9w3y5dd4cjy3duxlf7hjzkp0rqx6dj6mrhu
      responses:
        '201':
          description: External account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccount'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '409':
          description: Conflict - External account already exists. When the conflicting account belongs to the customer in `customerId` (a duplicate wallet) or to any account on your platform (a duplicate `platformAccountId`), `details` carries its `externalAccountId` and `platformAccountId` so a retried request can recover it. `details` is omitted when the conflicting account cannot be identified, for example when the `platformAccountId` is already used on another platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
              examples:
                duplicateExternalAccount:
                  summary: Duplicate external account
                  value:
                    code: DUPLICATE_EXTERNAL_ACCOUNT
                    reason: An external account with this platform_account_id already exists
                    details:
                      externalAccountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                      platformAccountId: acme-acct-42
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/external-accounts/{externalAccountId}:
    parameters:
    - name: externalAccountId
      in: path
      description: System-generated unique external account identifier
      required: true
      schema:
        type: string
    get:
      summary: Get customer external account by ID
      description: Retrieve a customer external account by its system-generated ID
      operationId: getCustomerExternalAccountById
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccount'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    delete:
      summary: Delete customer external account by ID
      description: 'Delete a customer external account by its system-generated ID.

        An account that is currently a trusted beneficiary for SCA cannot be deleted — untrust it first via `POST /customers/external-accounts/{externalAccountId}/untrust` (and its `/confirm`), then delete.'
      operationId: deleteCustomerExternalAccountById
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      responses:
        '204':
          description: External account deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Returned with `BENEFICIARY_TRUSTED` when the external account is currently a trusted beneficiary. Untrust it first, then delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/external-accounts/{externalAccountId}/challenge:
    post:
      summary: Start an ownership verification challenge
      description: 'Start (or restart) ownership verification for a `FIRST_PARTY` self-custody

        crypto wallet external account in `PENDING_OWNERSHIP_VERIFICATION` or

        `UNVERIFIED` status. The response carries the method-specific challenge

        material:


        - `WALLET_SIGNATURE` — a `messageToSign`; have the wallet sign it exactly

        and submit the result to the verify endpoint to complete verification

        synchronously.

        - `LIVENESS` — a hosted `verificationLink` (and possibly an embed

        `token`); the user completes a biometric flow and verification completes

        asynchronously. The outcome is delivered via

        `EXTERNAL_ACCOUNT.STATUS_UPDATED` webhooks or by polling the account.


        Calling this endpoint again abandons any in-flight challenge and issues a

        new one with the requested method — use it to retry after a failed

        attempt, to replace an expired challenge, or to switch methods. An

        `UNVERIFIED` account returns to `PENDING_OWNERSHIP_VERIFICATION` when a

        new challenge is issued.


        Completing ownership verification moves the account to `ACTIVE`.'
      operationId: createExternalAccountOwnershipChallenge
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      parameters:
      - name: externalAccountId
        in: path
        description: External account ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipChallengeRequest'
      responses:
        '201':
          description: Challenge created; the method-specific material is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipChallenge'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Ownership verification is not applicable to this external account (not a self-custody crypto wallet, not `FIRST_PARTY`, or already verified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /customers/external-accounts/{externalAccountId}/verify:
    post:
      summary: Verify ownership with a wallet signature
      description: 'Complete a `WALLET_SIGNATURE` challenge by submitting the signature the

        wallet produced for the challenge''s `messageToSign`. The message must be

        signed exactly as returned, and the signature must be submitted before

        the challenge''s `expiresAt` — after expiry, start a new challenge.


        On success the account moves to `ACTIVE`; on an invalid signature it

        moves to `UNVERIFIED` (start a new challenge to retry). `LIVENESS`

        challenges complete asynchronously and never use this endpoint — their

        outcome is delivered via `EXTERNAL_ACCOUNT.STATUS_UPDATED` webhooks or by

        polling the account.'
      operationId: verifyExternalAccountOwnership
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      parameters:
      - name: externalAccountId
        in: path
        description: External account ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipVerifyRequest'
      responses:
        '200':
          description: 'Signature valid; the updated external account is returned with `status: ACTIVE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccount'
        '400':
          description: Invalid or expired signature. The account moves to `UNVERIFIED`; start a new challenge to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: No `WALLET_SIGNATURE` challenge is outstanding for this external account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /platform/external-accounts:
    get:
      summary: List platform external accounts
      description: 'Retrieve a list of all external accounts that belong to the platform, as opposed to an individual customer.


        These accounts are used for platform-wide operations such as receiving funds from external sources or managing platform-level payment destinations.'
      operationId: listPlatformExternalAccounts
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      parameters:
      - name: currency
        in: query
        description: Filter by currency code
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination (returned from previous request)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccountListResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    post:
      summary: Add a new platform external account
      description: Register a new external bank account for the platform.
      operationId: createPlatformExternalAccount
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlatformExternalAccountCreateRequest'
            examples:
              usBankAccount:
                summary: Create external US bank account
                value:
                  currency: USD
                  accountInfo:
                    accountType: USD_ACCOUNT
                    accountNumber: '12345678901'
                    routingNumber: '021000021'
                    bankAccountType: CHECKING
                    bankName: Chase Bank
                    platformAccountId: ext_acc_123456
                    beneficiary:
                      beneficiaryType: INDIVIDUAL
                      fullName: John Doe
                      birthDate: '1990-01-15'
                      nationality: US
                      address:
                        line1: 123 Main Street
                        city: San Francisco
                        state: CA
                        postalCode: '94105'
                        country: US
              sparkWallet:
                summary: Create external Spark wallet
                value:
                  currency: BTC
                  accountInfo:
                    accountType: SPARK_WALLET
                    address: spark1pgssyuuuhnrrdjswal5c3s3rafw9w3y5dd4cjy3duxlf7hjzkp0rqx6dj6mrhu
      responses:
        '201':
          description: External account created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccount'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '409':
          description: Conflict - External account already exists. When the conflicting account belongs to your platform, `details` carries its `externalAccountId` and `platformAccountId` so a retried request can recover it. `details` is omitted when the conflicting account cannot be identified, for example when the `platformAccountId` is already used on another platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
              examples:
                duplicateExternalAccount:
                  summary: Duplicate external account
                  value:
                    code: DUPLICATE_EXTERNAL_ACCOUNT
                    reason: An external account with this platform_account_id already exists
                    details:
                      externalAccountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                      platformAccountId: acme-settlement-usdc
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /platform/external-accounts/{externalAccountId}:
    parameters:
    - name: externalAccountId
      in: path
      description: System-generated unique external account identifier
      required: true
      schema:
        type: string
    get:
      summary: Get platform external account by ID
      description: Retrieve a platform external account by its system-generated ID
      operationId: getPlatformExternalAccountById
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccount'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    delete:
      summary: Delete platform external account by ID
      description: Delete a platform external account by its system-generated ID
      operationId: deletePlatformExternalAccountById
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      responses:
        '204':
          description: External account deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /platform/external-accounts/{externalAccountId}/challenge:
    post:
      summary: Start an ownership verification challenge
      description: 'Start (or restart) ownership verification for a `FIRST_PARTY` self-custody

        crypto wallet external account in `PENDING_OWNERSHIP_VERIFICATION` or

        `UNVERIFIED` status. The response carries the method-specific challenge

        material:


        - `WALLET_SIGNATURE` — a `messageToSign`; have the wallet sign it exactly

        and submit the result to the verify endpoint to complete verification

        synchronously.

        - `LIVENESS` — a hosted `verificationLink` (and possibly an embed

        `token`); the user completes a biometric flow and verification completes

        asynchronously. The outcome is delivered via

        `EXTERNAL_ACCOUNT.STATUS_UPDATED` webhooks or by polling the account.


        Calling this endpoint again abandons any in-flight challenge and issues a

        new one with the requested method — use it to retry after a failed

        attempt, to replace an expired challenge, or to switch methods. An

        `UNVERIFIED` account returns to `PENDING_OWNERSHIP_VERIFICATION` when a

        new challenge is issued.


        Completing ownership verification moves the account to `ACTIVE`.'
      operationId: createPlatformExternalAccountOwnershipChallenge
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      parameters:
      - name: externalAccountId
        in: path
        description: External account ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipChallengeRequest'
      responses:
        '201':
          description: Challenge created; the method-specific material is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OwnershipChallenge'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Ownership verification is not applicable to this external account (not a self-custody crypto wallet, not `FIRST_PARTY`, or already verified).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /platform/external-accounts/{externalAccountId}/verify:
    post:
      summary: Verify ownership with a wallet signature
      description: 'Complete a `WALLET_SIGNATURE` challenge by submitting the signature the

        wallet produced for the challenge''s `messageToSign`. The message must be

        signed exactly as returned, and the signature must be submitted before

        the challenge''s `expiresAt` — after expiry, start a new challenge.


        On success the account moves to `ACTIVE`; on an invalid signature it

        moves to `UNVERIFIED` (start a new challenge to retry). `LIVENESS`

        challenges complete asynchronously and never use this endpoint — their

        outcome is delivered via `EXTERNAL_ACCOUNT.STATUS_UPDATED` webhooks or by

        polling the account.'
      operationId: verifyPlatformExternalAccountOwnership
      tags:
      - External Accounts
      security:
      - BasicAuth: []
      parameters:
      - name: externalAccountId
        in: path
        description: External account ID
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnershipVerifyRequest'
      responses:
        '200':
          description: 'Signature valid; the updated external account is returned with `status: ACTIVE`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalAccount'
        '400':
          description: Invalid or expired signature. The account moves to `UNVERIFIED`; start a new challenge to retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: No `WALLET_SIGNATURE` challenge is outstanding for this external account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  schemas:
    GtqAccountInfoBase:
      type: object
      required:
      - accountType
      - accountNumber
      - bankAccountType
      - bankName
      properties:
        accountType:
          type: string
          enum:
          - GTQ_ACCOUNT
        accountNumber:
          type: string
          description: The account number of the bank
          minLength: 1
          maxLength: 34
        bankAccountType:
          type: string
          description: The bank account type
          enum:
          - CHECKING
          - SAVINGS
        bankName:
          type: string
          description: The name of the beneficiary's bank. Must be one of the `bankName` values `GET /discoveries` returns for this country and currency. Send it exactly as returned; any other name is rejected.
          minLength: 1
          maxLength: 255
          example: Banco Industrial
      example:
        accountType: GTQ_ACCOUNT
        accountNumber: '1234567890'
        bankAccountType: CHECKING
        bankName: Banco Industrial
    IlsExternalAccountInfo:
      title: ILS Account
      allOf:
      - $ref: '#/components/schemas/BaseExternalAccountInfo'
      - $ref: '#/components/schemas/IlsAccountInfo'
      - type: object
        required:
        - beneficiary
        properties:
          beneficiary:
            oneOf:
            - title: Individual Beneficiary
              $ref: '#/components/schemas/IlsBeneficiary'
            - title: Business Beneficiary
              $ref: '#/components/schemas/IlsBusinessBeneficiary'
            discriminator:
              propertyName: beneficiaryType
              mapping:
                INDIVIDUAL: '#/components/schemas/IlsBeneficiary'
                BUSINESS: '#/components/schemas/IlsBusinessBeneficiary'
    BrlBusinessBeneficiary:
      title: Business Beneficiary
      type: object
      required:
      - beneficiaryType
      - legalName
      properties:
        beneficiaryType:
          type: string
          enum:
          - BUSINESS
        legalName:
          type: string
          maxLength: 250
          description: The legal name of the business
        email:
          type: string
          maxLength: 320
          description: The email of the beneficiary
        phoneNumber:
          type: string
          maxLength: 50
          description: The phone number of the beneficiary
        registrationNumber:
          type: string
          maxLength: 100
          description: The company registration number of the business
        taxId:
          type: string
          maxLength: 100
          description: The tax identification number of the business
        countryOfResidence:
          type: string
          description: The country of residence of the beneficiary
        address:
          $ref: '#/components/schemas/Address'
    SwiftAccountInfoBase:
      type: object
      description: 'At least one of accountNumber or iban is always present: IBAN-only corridors (e.g. BR, GB) use iban, other corridors use accountNumber, and both appear when the bank exposes both identifiers for the same account.'
      required:
      - accountType
      - swiftCode
      - bankName
      - country
      properties:
        accountType:
          type: string
          enum:
          - SWIFT_ACCOUNT
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the bank account
          example: NG
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank
          example: DEUTDEFF
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
        bankName:
          type: string
          description: The name of the bank
          example: Deutsche Bank
          minLength: 1
          maxLength: 255
        accountNumber:
          type: string

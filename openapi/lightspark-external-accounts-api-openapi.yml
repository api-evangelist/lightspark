      title: Liveness Challenge
      type: object
      description: A challenge to prove ownership through a hosted biometric verification flow. Completes asynchronously — the outcome is delivered via `EXTERNAL_ACCOUNT.STATUS_UPDATED` webhooks or by polling the external account.
      required:
      - method
      - verificationLink
      - expiresAt
      properties:
        method:
          type: string
          enum:
          - LIVENESS
          description: The verification method. Always `LIVENESS` for this shape.
          example: LIVENESS
        verificationLink:
          type: string
          format: uri
          description: Hosted verification URL to present to the user.
          example: https://verify.example.com/session/019542f5-b3e7-1d02
        token:
          type: string
          description: Provider-specific token that can be used in place of `verificationLink` — for example, to embed the provider's SDK directly in your application. Only returned for providers that support direct SDK integration. Whether to use the hosted URL or the embedded SDK is up to you; both flows result in the same verification outcome.
          example: eyJhbGciOiJIUzI1NiJ9.example
        expiresAt:
          type: string
          format: date-time
          description: When this challenge expires. Prompt the user promptly; after expiry, start a new challenge.
          example: '2025-08-15T15:32:00Z'

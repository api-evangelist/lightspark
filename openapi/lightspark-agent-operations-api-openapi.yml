    AgentCardUpdateRequest:
      type: object
      description: 'Update request for `PATCH /agents/me/cards/{cardId}`. At least one field must be supplied. An agent may only tighten a card: a limit may be set or lowered but not raised or removed, `blockedMccs` must contain every code in the card''s `effectiveBlockedMccs`, and `allowedMccs` may only lose codes once set. The only status an agent may set is `FROZEN`; unfreezing and loosening happen on the platform through `PATCH /cards/{id}`.'
      properties:
        status:
          type: string
          enum:
          - FROZEN
          description: Freeze the card. New authorizations are declined.
          example: FROZEN
        maxSpendPerTransaction:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: A per-transaction limit at or below the current one, in the smallest unit of the card's currency. You can only send this when the card's `cardCapabilities.supportsSpendLimits` is true.
          example: 5000
        maxSpendPerDay:
          type: integer
          format: int64
          minimum: 1
          maximum: 9007199254740991
          description: A UTC-calendar-day spend cap at or below the current one. You can only send this when the card's `cardCapabilities.supportsSpendLimits` is true.
          example: 20000
        maxTransactionsPerDay:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: A UTC-calendar-day transaction cap at or below the current one. You can only send this when the card's `cardCapabilities.supportsTransactionCountLimit` is true.
          example: 10
        allowedMccs:
          type: array
          minItems: 1
          description: Merchant category codes the card may spend at. Once set, a replacement must be a subset of the current list.
          items:
            type: string
            pattern: ^[0-9]{4}$
          example:
          - '5411'
        blockedMccs:
          type: array
          description: Merchant category codes the card declines. A replacement must contain every code in the card's `effectiveBlockedMccs`, so an agent can never lift a block, Grid's default agent blocks included.
          items:
            type: string
            pattern: ^[0-9]{4}$
          example:
          - '5813'
    CardStatus:
      type: string
      enum:
      - PENDING_KYC
      - PROCESSING
      - PENDING_AUTH
      - ACTIVE
      - FROZEN
      - CLOSED
      description: 'Lifecycle status of a card.


        | Status | Description |

        |-------|-------------|

        | `PENDING_KYC` | The cardholder has not yet completed KYC. Cards in this status cannot transact. |

        | `PROCESSING` | The card has been requested and is being provisioned with the issuer. |

        | `PENDING_AUTH` | The issuer has provisioned the card, but its USDB Embedded Wallet funding source lacks an active delegated signing key. Complete `POST /auth/delegated-keys` before using the card. |

        | `ACTIVE` | The card is live and can authorize transactions. |

        | `FROZEN` | The card is temporarily disabled by the platform or by Grid. New authorizations are declined with `cardDeclinedReason: CARD_NOT_ACTIVE`. Existing settlements and refunds continue to reconcile. A card Grid froze for review, or one frozen as `COMPROMISED`, cannot be unfrozen by the platform. |

        | `CLOSED` | The card is permanently closed. Terminal, irreversible status. |

        '

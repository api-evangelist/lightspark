    AgentQuoteRequest:
      type: object
      description: 'A transfer quote requested by an agent. The source is an `EMBEDDED_WALLET` internal account of the agent''s customer. The destination is either an `ACCOUNT`: another `EMBEDDED_WALLET` on the platform, or one of the customer''s active `SPARK_WALLET` external accounts in the source''s currency; or an address on another chain (`CHAIN_ADDRESS`).


        A `CHAIN_ADDRESS` quote sends `USDB` and requires `lockedCurrencySide` `SENDING`: it commits to the `USDB` amount, the destination, and a `minimumReceivingAmount`. Grid prices the conversion again when the quote executes, after any approval, and sends only if the destination still receives at least that minimum. Otherwise the action fails with `PRICE_MOVED` and no funds move.'
      required:
      - source
      - destination
      - lockedCurrencySide
      - lockedCurrencyAmount
      properties:
        source:
          $ref: '#/components/schemas/QuoteSourceOneOf'
        destination:
          $ref: '#/components/schemas/AgentQuoteDestinationOneOf'
        lockedCurrencySide:
          $ref: '#/components/schemas/QuoteLockSide'
        lockedCurrencyAmount:
          type: integer
          format: int64
          description: The amount to send/receive in the smallest unit of the locked currency (eg. cents). See `lockedCurrencySide` for more information.
          exclusiveMinimum: 0
          maximum: 9000000000000000
          example: 1000
    UsdAccountInfoBase:
      type: object

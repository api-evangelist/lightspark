          type: string
          description: Internal account that will receive the converted deposit. It must belong to the agent's associated customer and be allowed by the agent policy.
          example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
        amount:
          type: integer
          format: int64
          exclusiveMinimum: 0
          maximum: 9000000000000000
          description: 'Exact USD amount the user pays for a `LIGHTNING` deposit, in cents. Required for `LIGHTNING`; no amount is required for chain networks. This is an exact-in amount: deposit fees are deducted before the destination asset is credited.'

          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    patch:
      summary: Tighten or freeze an agent card
      description: Tighten a card's limits or merchant categories, or freeze it. An agent can never loosen a card or unfreeze it; the platform does that with `PATCH /cards/{id}`. Requires the MANAGE_CARDS permission.
      operationId: agentUpdateCard
      tags:
      - Agent Operations
      security:
      - AgentAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCardUpdateRequest'
      responses:
        '200':
          description: Card updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCard'
        '400':
          description: Bad request - A change would loosen the card, or the card is closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API or agent cards are not enabled for the platform, the agent does not have the MANAGE_CARDS permission, or the customer is not verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Card not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  schemas:
    SwiftAccountInfoBase:
      type: object
      description: 'At least one of accountNumber or iban is always present: IBAN-only corridors (e.g. BR, GB) use iban, other corridors use accountNumber, and both appear when the bank exposes both identifiers for the same account.'
      required:
      - accountType
      - swiftCode
      - bankName
      - country
      properties:
        accountType:
          type: string
          enum:
          - SWIFT_ACCOUNT
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the bank account
          example: NG
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank
          example: DEUTDEFF
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
        bankName:
          type: string
          description: The name of the bank
          example: Deutsche Bank
          minLength: 1
          maxLength: 255
        accountNumber:
          type: string
          description: The bank account number. Required for most corridors. Use iban instead for IBAN-only corridors (e.g. BR, GB).
          example: '1234567890'
          minLength: 1
          maxLength: 34
        iban:
          type: string
          description: The IBAN of the bank account. Required for IBAN-only corridors (e.g. BR, GB). Use accountNumber for all other corridors.
          example: GB29NWBK60161331926819
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Za-z0-9]{11,30}$
      example:
        accountType: SWIFT_ACCOUNT
        country: NG
        swiftCode: DEUTDEFF
        bankName: Deutsche Bank
        accountNumber: '1234567890'
    PurposeOfPayment:
      type: string
      description: 'The purpose of the payment. This may be required when sending to certain geographies (e.g. India).


        Some destinations accept only certain purposes. A business payout to China must use one of the purposes listed in [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents), and each needs its own supporting documents.'
      enum:
      - GIFT
      - SELF
      - GOODS_OR_SERVICES
      - EDUCATION
      - HEALTH_OR_MEDICAL
      - REAL_ESTATE_PURCHASE
      - TAX_PAYMENT
      - LOAN_PAYMENT
      - UTILITY_BILL
      - DONATION
      - TRAVEL
      - FAMILY_SUPPORT
      - SALARY_PAYMENT
      - EXPORTED_GOODS_PREPAYMENT
      - EXPORTED_GOODS_POSTPAYMENT
      - SERVICE_CHARGES
      - OFFICE_EXPENSES
      - DELIVERY_FEES
      - HOTEL_ACCOMMODATION
      - COMMISSION_ON_GOODS
      - COMMISSION_ON_SERVICES
      - ACCOUNTING_SERVICES
      - EXHIBITION_SERVICES
      - OTHER
    BdtExternalAccountInfo:
      title: BDT Account
      allOf:
      - $ref: '#/components/schemas/BaseExternalAccountInfo'
      - $ref: '#/components/schemas/BdtAccountInfo'
      - type: object
        required:
        - beneficiary
        properties:
          beneficiary:
            oneOf:
            - title: Individual Beneficiary
              $ref: '#/components/schemas/BdtBeneficiary'
            - title: Business Beneficiary

  /agents/me/cards:
    get:
      summary: List agent cards
      description: List the cards the customer issued for the authenticated agent. Other cards of the customer are not listed. Requires the MANAGE_CARDS permission.
      operationId: agentListCards
      tags:
      - Agent Operations
      security:
      - AgentAuth: []
      parameters:
      - name: kind
        in: query
        description: Filter by card kind
        required: false
        schema:
          $ref: '#/components/schemas/AgentCardKind'
      - name: status
        in: query
        description: Filter by card status
        required: false
        schema:
          $ref: '#/components/schemas/CardStatus'
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination (returned from previous request)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:

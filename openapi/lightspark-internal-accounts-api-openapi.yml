      enum:
      - USDC
      - USDT
    InternalAccountExportResponse:
      title: Internal Account Export Response
      type: object
      required:
      - id
      - encryptedWalletCredentials
      properties:
        id:
          type: string
          description: The id of the internal account that was exported.
          example: InternalAccount:019542f5-b3e7-1d02-0000-000000000002
        encryptedWalletCredentials:
          type: string
          description: 'Encrypted wallet mnemonic, sealed to the `clientPublicKey` from the request body using HPKE: DHKEM(P-256, HKDF-SHA256) + HKDF-SHA256 + AES-256-GCM. Decrypt with the matching private key, then manage the mnemonic securely because it is the master key of the self-custodial Embedded Wallet.

            The value is a JSON string of the form `{"version": "v1.0.0", "data": "<hex>", "dataSignature": "<hex>", "enclaveQuorumPublic": "<hex>"}`. `data` hex-decodes to JSON `{"encappedPublic": "<hex>", "ciphertext": "<hex>", "organizationId": "<id>"}`, where `encappedPublic` is the uncompressed SEC1 ephemeral public key. `dataSignature` is an ECDSA-P256-SHA256 signature over the `data` bytes produced by the issuer key in `enclaveQuorumPublic`; verify before decrypting.

            In sandbox, `dataSignature` and `enclaveQuorumPublic` are empty strings. Clients should bypass attestation verification when calling against sandbox.'
          example: '{"version":"v1.0.0","data":"7b22656e6361707065645075626c6963223a22303433...","dataSignature":"3045022100c9...","enclaveQuorumPublic":"04a1b2c3..."}'
    SweepRuleDestinationRequest:
      title: Sweep Rule Destination Request
      type: object
      description: The account a rule-based account sweeps its incoming payments to.
      required:
      - accountId
      properties:
        accountId:
          type: string
          description: Reference to the account that receives the swept funds. May be an external account or another internal account, but never a `RULE_BASED` internal account — that account's own rule would sweep the funds on again. The destination may be denominated in a different currency, in which case the sweep is converted at the prevailing rate.
          example: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
        paymentRail:
          description: The payment rail to use when sweeping to an external account. Must be one of the rails supported by the destination account. If omitted, a rail is selected automatically for each sweep. Not accepted when the destination is an internal account, which settles without a payment rail.
          allOf:
          - $ref: '#/components/schemas/PaymentRail'
    CurrencyAmount:
      type: object
      required:
      - amount
      - currency
      properties:
        amount:
          type: integer
          format: int64
          description: Amount in the smallest unit of the currency (e.g., cents for USD/EUR, satoshis for BTC)
          example: 12550
        currency:
          $ref: '#/components/schemas/Currency'
    WalletOperationProcessing:
      title: Wallet Operation Processing
      description: '`200` response returned by an Embedded Wallet operation that the wallet provider has accepted but not yet settled — a consensus- or approval-gated activity that is still in flight. It is not an error and needs no client action beyond patience: the backend reconciles the operation to its terminal state on its own. The client MAY re-send the byte-identical request to converge sooner; the request is idempotent and returns the settled success response once the operation completes.'
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - PROCESSING
          description: Always `PROCESSING`. Marks a still-in-flight operation whose terminal result is not yet available.
          example: PROCESSING
        message:
          type: string
          description: Human-readable explanation that the operation is still being processed and the same request may be retried.
          example: This login is still being processed. Retry the same request in a moment.
      example:
        status: PROCESSING
        message: This login is still being processed. Retry the same request in a moment.

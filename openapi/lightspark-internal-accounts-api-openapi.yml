          description: Whether wallet privacy should be enabled for the Embedded Wallet.
          example: true
    SweepRule:
      title: Sweep Rule
      type: object
      description: The routing rule attached to a rule-based account. Returned on the account rather than as a resource of its own, because the rule has no lifecycle apart from the account.
      required:
      - destination
      properties:
        destination:
          allOf:
          - $ref: '#/components/schemas/SweepRuleDestination'
          description: Where funds that settle into this account are swept.
        minimumAmount:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: '**In this rule-based account''s currency, not the destination''s.** The smallest balance the corridor to the destination can carry; a settled balance below it is not swept. Zero means no floor, which is the case for a same-currency internal destination — a book transfer with no rail, fee or conversion to justify one. Configuration rather than a moving estimate, so there is nothing to re-poll.'
        maximumAmount:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: '**In this rule-based account''s currency, not the destination''s.** The largest balance the corridor to the destination can carry; a settled balance above it is not swept. Null means no ceiling.'
        purposeOfPayment:
          allOf:
          - $ref: '#/components/schemas/PurposeOfPayment'
          description: The purpose of payment applied to each sweep.
          example: SELF
        description:
          type: string
          description: Free-form description recorded on each sweep. Not delivered to the recipient.
          example: Rent sweep
        remittanceInformation:
          type: string
          description: Free-form information that travels with each sweep to the recipient.
          example: Unit 4B March
        platformFeeOverride:
          allOf:
          - $ref: '#/components/schemas/PlatformFeeOverride'
          description: Fee terms applied to every sweep this rule drives. Null when the platform's configured fees apply.
    PlatformFeeOverride:
      type: object
      description: Overrides the platform-collected fee for this transaction. When present, it replaces any configured platform-collected fees that would otherwise apply to the transaction. Currently only supported when the quote's source currency is USD; the fixed fee must be denominated in the source currency.
      required:
      - platformFixedFee
      - platformVariableFeeBps
      properties:
        platformFixedFee:
          $ref: '#/components/schemas/FixedFee'
          description: Fixed fee charged for this transaction. Must be denominated in the quote's source currency (USD today).
        platformVariableFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Variable fee in basis points (1 bps = 0.01%) to apply to the transaction's source-currency amount.
          example: 30
      example:
        platformFixedFee:
          amount: 50
          currency: USD
        platformVariableFeeBps: 30

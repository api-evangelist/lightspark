          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        type:
          allOf:
          - $ref: '#/components/schemas/InternalAccountType'
          description: Must be `RULE_BASED`. `INTERNAL_FIAT`, `INTERNAL_CRYPTO`, `BULK_SETTLEMENT`, and `EMBEDDED_WALLET` accounts are provisioned when a customer is created or approved.
          example: RULE_BASED
        currency:
          type: string
          description: Currency code the account is denominated in (ISO 4217). Rule-based accounts are currently available in `USD` only.
          example: USD
        onBehalfOfCustomerId:
          type: string
          description: For regulated financial institutions only. The customer whose payments this platform-owned account receives. Only accepted when `customerId` is omitted, so the account stays yours; it records who incoming payments are for. The customer must belong to your platform. Several of your accounts can name the same customer.
          example: Customer:019542f5-b3e7-1d02-0000-000000000002
        label:

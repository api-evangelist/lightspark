          example: https://www.lightspark.com/legal/grid/enduserterms
    PepStatus:
      type: string
      enum:
      - NONE
      - DOMESTIC
      - FOREIGN
      - HIO
      - FAMILY_OR_ASSOCIATE
      description: Political exposure declaration (Politically Exposed Person status). `HIO` = head of an international organization. `FAMILY_OR_ASSOCIATE` covers close family members and known close associates of a PEP.
      example: NONE
    AgreementConsentRequest:
      type: object
      required:
      - type
      - acceptedAt
      - ipAddress
      - termsVersion
      - acceptanceMethod
      properties:
        type:
          $ref: '#/components/schemas/AgreementType'
        acceptedAt:
          type: string
          format: date-time
          description: Date and time when the customer accepted this agreement. Must include a timezone offset and must not be in the future.
        ipAddress:
          type: string
          maxLength: 45
          description: IP address of the device the customer used when accepting this agreement.
          example: 198.51.100.24
        termsVersion:
          type: string
          maxLength: 64
          description: Version identifier of the accepted agreement, as returned for this type by the agreement documents endpoint. A version is scoped to its type; a version valid for one agreement is not valid for another.
          example: '2025-10-13'
        acceptanceMethod:
          $ref: '#/components/schemas/AgreementAcceptanceMethod'
    KybStatus:
      type: string
      enum:
      - UNVERIFIED
      - PENDING
      - APPROVED
      - REJECTED
      - HOLD
      description: The current KYB status of a business customer. `HOLD` means the customer is placed on hold and may be required to update or provide more information.
      example: APPROVED
    ContactVerification:
      type: object
      description: 'Email and/or phone verification state for the customer. This object is **only present when the customer''s regulatory jurisdiction requires contact verification** (e.g. EU customers). For customers who have no such requirement, this object is omitted entirely — no action is needed.


        Each channel is reported independently: only the channels the customer''s provider actually requires are present. A provider may require both email and phone, just one of them, or — when the object is absent — neither. Every channel that **is** present must reach `VERIFIED` before the customer can begin KYC. Drive each present channel with `POST /customers/{customerId}/verify-email` and/or `POST /customers/{customerId}/verify-phone` (and their `/confirm` sub-routes).'
      properties:
        email:
          $ref: '#/components/schemas/ContactVerificationStatus'
          description: Verification status of the customer's email address. Present only when the provider requires email verification.
        phone:
          $ref: '#/components/schemas/ContactVerificationStatus'
          description: Verification status of the customer's phone number. Present only when the provider requires phone verification.
    BeneficialOwner:
      type: object
      required:
      - id
      - customerId
      - roles
      - ownershipPercentage
      - personalInfo
      - kycStatus
      - createdAt
      properties:
        id:
          type: string
          description: Unique identifier for this beneficial owner
          example: BeneficialOwner:019542f5-b3e7-1d02-0000-000000000001
        customerId:
          type: string
          description: The ID of the business customer this beneficial owner is associated with
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        roles:
          type: array
          items:
            $ref: '#/components/schemas/BeneficialOwnerRole'
          description: Roles of this person within the business
          example:
          - UBO
          - DIRECTOR
        ownershipPercentage:
          type: integer
          description: Percentage of ownership in the business (0-100)
          minimum: 0
          maximum: 100
          example: 51
        personalInfo:
          $ref: '#/components/schemas/BeneficialOwnerPersonalInfo'
        kycStatus:
          $ref: '#/components/schemas/KycStatus'
        createdAt:
          type: string
          format: date-time
          description: When this beneficial owner was created
          example: '2025-10-03T12:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: When this beneficial owner was last updated
          example: '2025-10-03T12:00:00Z'
    Error424:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | PAYREQ_REQUEST_FAILED | Payment request failed |

            | COUNTERPARTY_PUBKEY_FETCH_ERROR | Error fetching counterparty public key |

            | NO_COMPATIBLE_UMA_VERSION | No compatible UMA version |

            | LNURLP_REQUEST_FAILED | LNURLP request failed |

            | EMAIL_OTP_CREDENTIAL_SYNC_FAILED | Failed to update one or more tied EMAIL_OTP credentials |

            | SMS_OTP_CREDENTIAL_SYNC_FAILED | One or more tied SMS_OTP credentials could not be updated |

            | PAYMENT_DOCUMENT_ATTACHMENT_FAILED | Grid could not attach a supporting document to the payment, so it created no quote. Retry the same request with the same `Idempotency-Key` |

            '
          enum:
          - PAYREQ_REQUEST_FAILED
          - COUNTERPARTY_PUBKEY_FETCH_ERROR
          - NO_COMPATIBLE_UMA_VERSION
          - LNURLP_REQUEST_FAILED
          - EMAIL_OTP_CREDENTIAL_SYNC_FAILED
          - SMS_OTP_CREDENTIAL_SYNC_FAILED
          - PAYMENT_DOCUMENT_ATTACHMENT_FAILED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    WalletOperationProcessing:
      title: Wallet Operation Processing
      description: '`200` response returned by an Embedded Wallet operation that the wallet provider has accepted but not yet settled — a consensus- or approval-gated activity that is still in flight. It is not an error and needs no client action beyond patience: the backend reconciles the operation to its terminal state on its own. The client MAY re-send the byte-identical request to converge sooner; the request is idempotent and returns the settled success response once the operation completes.'
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - PROCESSING
          description: Always `PROCESSING`. Marks a still-in-flight operation whose terminal result is not yet available.
          example: PROCESSING
        message:
          type: string
          description: Human-readable explanation that the operation is still being processed and the same request may be retried.
          example: This login is still being processed. Retry the same request in a moment.
      example:
        status: PROCESSING
        message: This login is still being processed. Retry the same request in a moment.
    AnnualIncomeRange:
      type: string
      enum:
      - UNDER_50K
      - RANGE_50K_100K
      - RANGE_100K_250K
      - RANGE_250K_1M
      - OVER_1M
      description: Bucketed annual income (USD equivalent). Used for enhanced due diligence on higher-risk profiles.
      example: RANGE_100K_250K
    SignedRequestChallenge:
      title: Signed Request Challenge
      type: object
      required:
      - payloadToSign
      - requestId
      - expiresAt
      description: Common base for two-step signed-retry challenge responses on Embedded Wallet endpoints (credential registration or revocation, session refresh or revocation, wallet export, customer email updates, and similar). Holds the signing fields shared across every challenge shape; each variant composes this base via `allOf` and adds its own resource `id` (and `type`, when applicable) with variant-specific description and example.
      properties:
        payloadToSign:
          type: string
          description: 'Payload for the retry authorization stamp. Build an API-key stamp over the exact UTF-8 bytes of this string, without parsing, re-serializing, or trimming it. Use the keypair required by the endpoint: the client''s TEK keypair for OTP verification, or an active session API keypair for other signed wallet actions. Send the full base64url-encoded stamp in `Grid-Wallet-Signature` on the retry that completes the original request.'
          example: '{"organizationId":"org_2m9F...","parameters":{"userId":"user_2m9F..."},"timestampMs":"1775681700000","type":"ACTIVITY_TYPE_EXAMPLE"}'
        requestId:
          type: string
          description: Grid-issued `Request:<uuid>` identifier for this pending request. Echo this value exactly in the `Request-Id` header on the signed retry so the server can correlate the retry with the issued challenge.
          example: Request:7c4a8d09-ca37-4e3e-9e0d-8c2b3e9a1f21
        expiresAt:
          type: string
          format: date-time
          description: Timestamp after which this challenge is no longer valid. The signed retry must be submitted before this time.
          example: '2026-04-08T15:35:00Z'
    BusinessInfoResponse:
      type: object
      description: 'Business information returned on a customer. `taxId` and `incorporatedOn` are

        required on creation only when the customer''s currency uses direct

        customer-owned accounts, so both are optional in responses.

        '
      required:
      - legalName
      properties:
        legalName:
          type: string
          description: Legal name of the business
          example: Acme Corporation, Inc.
        doingBusinessAs:
          type: string
          description: Trade name or DBA name of the business, if different from the legal name
          example: Acme
        country:
          type: string
          description: Country of incorporation or registration (ISO 3166-1 alpha-2)
          example: US
        registrationNumber:
          type: string
          description: Business registration number
          example: '5523041'
        incorporatedOn:
          type: string
          format: date
          description: Date of incorporation in ISO 8601 format (YYYY-MM-DD)
          example: '2018-03-14'
        entityType:
          $ref: '#/components/schemas/EntityType'
        taxId:
          type: string
          description: Tax identification number
          example: 47-1234567
        countriesOfOperation:
          type: array
          items:
            type: string
          description: List of countries where the business operates (ISO 3166-1 alpha-2)
          example:
          - US
        businessType:
          $ref: '#/components/schemas/BusinessType'
        purposeOfAccount:
          $ref: '#/components/schemas/PurposeOfAccount'
        sourceOfFunds:
          type: string
          description: The primary source of funds for the business
          example: Funds derived from customer payments for software services
        expectedMonthlyTransactionCount:
          $ref: '#/components/schemas/ExpectedMonthlyTransactionCount'
        expectedMonthlyTransactionVolume:
          $ref: '#/components/schemas/ExpectedMonthlyTransactionVolume'
        expectedRecipientJurisdictions:
          type: array
          items:
            type: string
          description: List of countries where the business expects to send payments (ISO 3166-1 alpha-2)
          example:
          - US
        naicsCode:
          type: string
          pattern: ^\d{2,6}$
          description: NAICS code describing the nature of the business (2-6 digits)
          example: '541511'
        sourceOfFundsCategories:
          type: array
          items:
            $ref: '#/components/schemas/SourceOfFundsCategory'
          description: Structured source-of-funds categories for the business
          example:
          - OPERATING_REVENUE
        sourceOfFundsOtherDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Description of the source of funds when OTHER is selected
          example: Proceeds from a legal settlement
        purposeOfAccountOtherDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Description of the account purpose when OTHER is selected
          example: Escrow for equipment leases
        expectedCounterpartyCountries:
          type: array
          items:
            type: string
          description: List of countries of the business's expected transaction counterparties (ISO 3166-1 alpha-2)
          example:
          - US
        primaryContactFirstName:
          type: string
          maxLength: 250
          description: First name of the business's primary contact — a registered director or authorised representative of the business. Required in regions where a named individual is verified against the business during onboarding (e.g. the EU). The customer's `email` and `phoneNumber` are this person's contact details.
          example: Jane
        primaryContactLastName:
          type: string
          maxLength: 250
          description: Last name of the business's primary contact.
          example: Smith

          description: Description of the source of funds when OTHER is selected
          example: Proceeds from a legal settlement
        purposeOfAccountOtherDescription:
          type: string
          minLength: 1
          maxLength: 500
          description: Description of the account purpose when OTHER is selected
          example: Escrow for equipment leases
        expectedCounterpartyCountries:
          type: array
          items:
            type: string
          description: List of countries of the business's expected transaction counterparties (ISO 3166-1 alpha-2)
          example:
          - US
        primaryContactFirstName:
          type: string
          maxLength: 250
          description: First name of the business's primary contact — a registered director or authorised representative of the business. Required in regions where a named individual is verified against the business during onboarding (e.g. the EU). The customer's `email` and `phoneNumber` are this person's contact details.
          example: Jane
        primaryContactLastName:
          type: string
          maxLength: 250
          description: Last name of the business's primary contact.
          example: Smith
    IndividualCustomerCreateRequest:
      title: Individual Customer Create Request
      allOf:
      - $ref: '#/components/schemas/CustomerCreateRequest'
      - $ref: '#/components/schemas/IndividualCustomerFields'

          - ACCOUNT_NOT_FOUND
          - AUTH_METHOD_NOT_FOUND
          - CUSTOMER_NOT_FOUND
          - DOCUMENT_HOLDER_NOT_FOUND
          - NOT_FOUND
          - PAYMENT_URL_NOT_FOUND
          - PLATFORM_NOT_FOUND
          - REQUEST_NOT_FOUND
          - SESSION_NOT_FOUND
          - STABLECOIN_EXTERNAL_ACCOUNT_NOT_FOUND
          - STABLECOIN_NOT_FOUND
          - STABLECOIN_OPERATION_NOT_FOUND
          - VERIFICATION_NOT_FOUND
          - PAYMENT_DOCUMENT_NOT_FOUND
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    IncomingTransactionFailureReason:
      type: string
      enum:
      - LNURLP_FAILED
      - PAY_REQUEST_FAILED
      - PAYMENT_APPROVAL_WEBHOOK_ERROR
      - PAYMENT_APPROVAL_TIMED_OUT
      - OFFRAMP_FAILED
      - MISSING_MANDATORY_PAYEE_DATA
      - QUOTE_EXPIRED
      - QUOTE_EXECUTION_FAILED
      - COMPLIANCE_REJECTED
      - COLLECTION_FAILED
      - SWEEP_AMOUNT_OUT_OF_RANGE
      - SWEEP_QUOTE_FAILED
      description: 'Reason for failure of an incoming transaction. This is used to provide more context on why a transaction failed. If the transaction is not in a failed state, this field is omitted. COMPLIANCE_REJECTED means compliance blocked the incoming funds. COLLECTION_FAILED means an inbound bank-rail collection deposit (e.g. a SWIFT wire) failed after arrival and did not credit — most commonly a compliance-screening rejection or an unresolved request for information, on either the collection provider''s side or Grid''s. Failed collections are returned to the sender per the collection provider''s process.

        A payment that settled into a rule-based account but could not be swept to the destination of the account''s rule fails with one of the `SWEEP_*` reasons. A rule-based account never holds a balance, so the funds are moved to the account holder''s own account in the same currency. SWEEP_AMOUNT_OUT_OF_RANGE means the amount was outside the band the corridor to the destination can carry — the rule''s minimumAmount and maximumAmount give the current band — and SWEEP_QUOTE_FAILED that Grid could not price it. A sweep that was priced and then failed on the way to settlement reports QUOTE_EXECUTION_FAILED, the same as any other payment.'
    RtpRailStatus:
      type: string
      enum:
      - PENDING
      - SETTLED
      - FAILED
      description: 'Status of the payment on the RTP network.


        | Status | Description |

        |--------|-------------|

        | `PENDING` | Submitted and awaiting the receiving bank''s response. |

        | `SETTLED` | The receiving bank accepted the payment and the funds settled. |

        | `FAILED` | The receiving bank or the network rejected the payment and no funds moved. |'
      example: SETTLED
    Transaction:
      type: object
      required:
      - id
      - status
      - type
      - direction
      - destination
      - customerId
      - platformCustomerId
      properties:
        id:
          type: string
          description: Unique identifier for the transaction
          example: Transaction:019542f5-b3e7-1d02-0000-000000000004
        status:
          $ref: '#/components/schemas/TransactionStatus'
        pendingReason:
          $ref: '#/components/schemas/TransactionPendingReason'
          description: Present when compliance review or required customer action is delaying settlement.
        type:
          $ref: '#/components/schemas/TransactionType'
        direction:
          $ref: '#/components/schemas/TransactionDirection'
          description: Whether this transaction credits or debits the customer's account.
        destination:
          $ref: '#/components/schemas/TransactionDestinationOneOf'
        ruleBasedAccountId:
          type: string
          description: The `RULE_BASED` internal account whose deposit this transaction sweeps. Present only on sweep transactions. For these, `source` describes the party that made the deposit when it is known, and is this account otherwise.
          example: InternalAccount:019542f5-b3e7-1d02-0000-000000000011
        customerId:
          type: string
          description: System ID of the customer this transaction belongs to
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        platformCustomerId:
          type: string
          description: Platform-specific ID of the customer this transaction belongs to
          example: 18d3e5f7b4a9c2
        settledAt:
          type: string
          format: date-time
          description: When the payment was or will be settled
          example: '2025-08-15T14:30:00Z'
        createdAt:
          type: string
          format: date-time
          description: When the transaction was created
          example: '2025-08-15T14:25:18Z'
        updatedAt:
          type: string
          format: date-time
          description: When the transaction was last updated
          example: '2025-08-15T14:30:00Z'
        receiptDeliveryConfirmedAt:
          type: string
          format: date-time
          description: The time at which the platform confirmed delivery of the receipt to their customer.
          example: '2025-08-15T14:31:00Z'
        agentId:
          type: string
          description: If this transaction was initiated by an agent, the system-generated ID of that agent. Absent for platform-initiated transactions.
          example: Agent:019542f5-b3e7-1d02-0000-000000000042
        description:
          type: string
          description: Optional memo or description for the payment
          example: 'Payment for invoice #1234'
        sentAmount:
          $ref: '#/components/schemas/CurrencyAmount'
          description: Amount sent in the sender's currency
        exchangeRate:
          type: number
          description: 'Number of sending currency units per receiving currency unit. The rate is fee-exclusive: Grid deducts fees from the sending amount before converting at this rate.'
          exclusiveMinimum: 0
          example: 1.08
        quoteId:
          type: string
          description: The ID of the quote that was used to trigger this payment
          example: Quote:019542f5-b3e7-1d02-0000-000000000006
        refund:
          $ref: '#/components/schemas/Refund'
          description: The refund if transaction was refunded.
        counterpartyInformation:
          $ref: '#/components/schemas/CounterpartyInformation'
    PaymentDocumentRequirementId:
      type: string
      description: 'A stable identifier for one required document within a purpose''s requirements. The same ID means the same requirement across quotes. It is separate from `PaymentDocumentType`. The requirement ID names the document to supply, and the document type names what a file is. The two differ where a requirement accepts alternatives. For example, a file declared as either `PURCHASE_ORDER` or `DELIVERY_SLIP` fills the `SUPPORTING_PROOF` requirement.


        [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents) lists the IDs each purpose requires.


        Treat the ID as an opaque value, not a member of a fixed list. Grid may add new IDs as requirements change.'
      example: SUPPORTING_PROOF
    PaymentArbitrumWalletInfo:
      title: Arbitrum Wallet
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/ArbitrumWalletInfo'
      - type: object

            example: Chase Bank
          bankIdentifier:
            type: string
            deprecated: true
            description: Deprecated. Use `railDetails.bankAccount.routingNumber`. The identifier of the originating bank, such as a routing number, BIC, or SWIFT code. Still populated on rails without a `railDetails` variant, such as SWIFT.
            example: '021000021'
          paymentRail:
            deprecated: true
            description: Deprecated. Use `railDetails.paymentRail`. The payment rail the funds arrived on. Still populated on rails without a `railDetails` variant, such as SWIFT.
            allOf:
            - $ref: '#/components/schemas/PaymentRail'
          remittanceInformation:
            type: string
            deprecated: true
            description: Deprecated. Use `railDetails.addenda` for ACH, `railDetails.originatorToBeneficiaryInformation` for wires and `railDetails.remittanceInformation` for RTP and FedNow. Free-form information about the payment provided by the originator. Still populated on rails without a `railDetails` variant, such as SWIFT.
            example: '12345'
          endToEndId:
            type: string
            deprecated: true
            description: Deprecated. Use `railDetails.endToEndId`. The originator's own end-to-end reference for the payment. Still populated on rails without a `railDetails` variant, such as SWIFT.
            example: E2E-9f2c6b6f
          traceNumber:
            type: string
            deprecated: true
            description: Deprecated. Use `railDetails.traceNumber` for ACH and `railDetails.imad` for wires. Rail-level tracking identifier for the payment. Still populated on rails without a `railDetails` variant, such as SWIFT.
            example: '021000020123456'
          railDetails:
            $ref: '#/components/schemas/RailDetailsOneOf'
          onChainTransaction:
            $ref: '#/components/schemas/OnChainTransaction'
            deprecated: true
            description: Deprecated. Use `railDetails`, which carries the same hash and network when `paymentRail` is `ONCHAIN`.
        description: Transaction was funded using an external funding source. `railDetails` describes the transfer that delivered the funds; its fields are populated on a best-effort basis depending on what the funding source provides. Rails without a `railDetails` variant, such as SWIFT, carry the originator's details in the deprecated flat fields only.

        destination:
          $ref: '#/components/schemas/ExternalAccountDestinationReference'
          description: Destination external account details
        amount:
          type: integer
          format: int64
          description: Amount in the smallest unit of the currency (e.g., cents for USD/EUR, satoshis for BTC)
          example: 12550
        remittanceInformation:
          type: string
          maxLength: 80
          description: 'Free-form information about the payment that travels with it to the recipient. The field this populates depends on the payment rail: for ACH it populates the Addenda record, for FedNow and RTP it populates the remittanceInformation field, and for wires it populates the OBI (Originator to Beneficiary Information) / beneficiary information.'
          example: '12345'
        purposeOfPayment:
          $ref: '#/components/schemas/PurposeOfPayment'
    FieldError:
      type: object
      required:
      - field
      description: One field-level validation failure. Field-validation errors on submit endpoints (e.g. `POST /customers`, `PATCH /customers/{id}`) emit an array of these under `details.errors` so platforms can render form-field-level UX for every failure in a single round-trip.
      properties:
        field:
          type: string
          description: Dot-notation path to the offending field.
          example: identifier
        constraint:
          $ref: '#/components/schemas/FieldConstraint'
        message:
          type: string
          description: Human-readable explanation of what's wrong with this field.
          example: Value is not one of the allowed enum members.
    TransactionPendingReason:
      type: string
      enum:
      - COUNTERPARTY_DECLARATION_REQUIRED
      - WALLET_VERIFICATION_REQUIRED
      - COUNTERPARTY_INFORMATION_REQUIRED
      - COMPLIANCE_REVIEW
      description: 'Why a transaction is pending.


        | Reason | Description |

        |--------|-------------|

        | `COUNTERPARTY_DECLARATION_REQUIRED` | The customer must declare who controls the sending wallet. |

        | `WALLET_VERIFICATION_REQUIRED` | The customer must verify ownership of the sending wallet. |

        | `COUNTERPARTY_INFORMATION_REQUIRED` | Information about the sender is required. |

        | `COMPLIANCE_REVIEW` | The customer''s action is complete and the deposit remains under compliance review. |

        '
    SolanaWalletInfo:

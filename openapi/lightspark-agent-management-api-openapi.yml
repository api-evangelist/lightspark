    AgentUsage:
      type: object
      description: Real-time counters tracking the agent's spending and transaction activity against its policy limits.
      required:
      - dailyTransactionCount
      - dailySpend
      - monthlySpend
      properties:
        dailyTransactionCount:
          type: integer
          description: Number of transactions initiated by the agent today.
          example: 3
        dailySpend:
          type: integer
          description: Total amount spent by the agent today, in the smallest unit of the policy's `spendingLimits.currency`.
          example: 150000
        dailyResetDate:
          type: string
          format: date
          description: The date when daily usage counters will reset.
          example: '2025-07-22'
        monthlySpend:
          type: integer
          description: Total amount spent by the agent this month, in the smallest unit of the policy's `spendingLimits.currency`.
          example: 750000
        monthlyResetMonth:
          type: string
          description: The year-month (YYYY-MM) when monthly usage counters will reset.
          example: 2025-08
    IncomingRateDetails:
      description: 'Details about the rate and fees for an incoming transaction. Note: `gridApiFixedFee` is denominated in the receiving currency, so its equivalent value in the sending currency fluctuates with the FX rate. As a result, the total fee on a subsequent quote for the same transfer may differ even if the underlying fee structure is unchanged.'
      type: object
      required:
      - gridApiMultiplier
      - gridApiFixedFee
      - gridApiVariableFeeRate
      - gridApiVariableFeeAmount
      properties:
        gridApiMultiplier:
          type: number
          format: double
          description: The underlying multiplier from the mSATS to the receiving currency, including variable fees.
          exclusiveMinimum: 0
          example: 0.925
        gridApiFixedFee:
          type: integer
          format: int64
          description: The fixed fee charged by the Grid product to execute the quote in the smallest unit of the receiving currency (eg. cents).
          minimum: 0
          example: 10
        gridApiVariableFeeRate:
          type: number
          format: double
          description: The variable fee rate charged by the Grid product to execute the quote as a percentage of the receiving currency amount.
          minimum: 0
          example: 0.003
        gridApiVariableFeeAmount:
          type: number
          format: int64
          description: The variable fee amount charged by the Grid product to execute the quote in the smallest unit of the receiving currency (eg. cents). This is the receiving amount times gridApiVariableFeeRate.
          minimum: 0
          example: 30

          format: date-time
          description: When the refund was settled
          example: '2025-08-15T14:35:00Z'
        status:
          type: string
          enum:
          - PENDING
          - COMPLETED
          - FAILED
          description: Current status of the refund
          example: COMPLETED
        reason:
          type: string
          enum:
          - TRANSACTION_FAILED
          - USER_CANCELLATION
          - TIMEOUT
          description: Reason for the refund
          example: TRANSACTION_FAILED
    SgdAccountInfo:
      allOf:
      - $ref: '#/components/schemas/SgdAccountInfoBase'
      - type: object
        required:
        - paymentRails
        properties:
          paymentRails:
            type: array
            items:
              type: string
              enum:
              - PAYNOW
              - FAST
              - BANK_TRANSFER
    AgentDeviceCode:
      type: object
      required:
      - code
      - agentId
      - expiresAt
      - redeemed
      properties:
        code:
          type: string
          description: Human-readable device code used to install and connect the agent software.
          example: GRID-AGENT-X7K9-M2P4
        agentId:
          type: string
          description: The agent this device code belongs to.
          example: Agent:019542f5-b3e7-1d02-0000-000000000001
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when this device code expires.
          example: '2025-07-22T17:32:28Z'
        redeemed:
          type: boolean
          description: Whether this device code has already been redeemed by the agent.
          example: false
    AgentDeviceCodeStatusResponse:
      type: object
      required:
      - code
      - redeemed
      properties:
        code:
          type: string
          description: The device code.
          example: GRID-AGENT-X7K9-M2P4
        redeemed:
          type: boolean
          description: Whether this device code has been redeemed.
          example: false
    ZarAccountInfoBase:
      type: object
      required:
      - accountType
      - accountNumber
      - bankName
      properties:
        accountType:
          type: string
          enum:
          - ZAR_ACCOUNT
        accountNumber:
          type: string
          description: South African bank account number
          minLength: 9
          maxLength: 13
          example: '1234567890'
          pattern: ^[0-9]{9,13}$
        bankName:
          type: string
          description: The name of the bank
          minLength: 1
          maxLength: 255
      example:
        accountType: ZAR_ACCOUNT
        accountNumber: '1234567890'
        bankName: Example Bank
    AgentListResponse:
      type: object
      required:
      - data
      - hasMore
      properties:
        data:
          type: array
          description: List of agents matching the filter criteria.
          items:
            $ref: '#/components/schemas/Agent'
        hasMore:
          type: boolean
          description: Indicates if more results are available beyond this page.
        nextCursor:
          type: string
          description: Cursor to retrieve the next page of results (only present if hasMore is true).
        totalCount:
          type: integer
          description: Total number of agents matching the criteria (excluding pagination).
    PaymentArsAccountInfo:
      title: ARS Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - accountNumber
        properties:
          accountType:
            type: string
            enum:
            - ARS_ACCOUNT
          accountNumber:
            type: string
            description: The static CVU (Clave Virtual Uniforme) bank account number to pay to.
            minLength: 22
            maxLength: 22
            pattern: ^\d{22}$
            example: '0000003100074052501434'
    SgdAccountInfoBase:
      type: object
      required:
      - accountType
      - accountNumber
      - swiftCode
      properties:
        accountType:
          type: string
          enum:
          - SGD_ACCOUNT
        bankName:
          type: string
          description: Name of the beneficiary's bank. When omitted, resolved from swiftCode via the payout partner bank directory at account creation.
          minLength: 1
          maxLength: 255
          example: DBS Bank Ltd
        accountNumber:
          type: string
          description: Bank account number
          minLength: 1
          maxLength: 34
          example: 0123456789
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank
          example: DBSSSGSG
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
      example:
        accountType: SGD_ACCOUNT
        bankName: DBS Bank Ltd
        accountNumber: 0123456789
        swiftCode: DBSSSGSG
    CadAccountInfo:
      allOf:
      - $ref: '#/components/schemas/CadAccountInfoBase'
      - type: object
        required:
        - paymentRails
        properties:
          paymentRails:
            type: array
            items:
              type: string
              enum:
              - BANK_TRANSFER
    CardMerchant:
      type: object
      required:
      - descriptor
      properties:
        descriptor:
          type: string
          description: Merchant descriptor string captured from the card network at authorization time.
          example: BLUE BOTTLE COFFEE SF
        mcc:
          type: string
          description: Merchant Category Code (ISO 18245) — four-digit numeric string.
          example: '5814'
        country:
          type: string
          description: Two-letter ISO 3166-1 alpha-2 country code of the merchant.
          example: US
    UsdAccountInfo:
      allOf:
      - $ref: '#/components/schemas/UsdAccountInfoBase'
      - type: object
        required:
        - paymentRails
        properties:
          paymentRails:
            type: array
            items:
              type: string
              enum:
              - ACH
              - WIRE
              - RTP
              - FEDNOW
    XofAccountInfo:
      allOf:
      - $ref: '#/components/schemas/XofAccountInfoBase'
      - type: object
        required:
        - paymentRails
        properties:
          paymentRails:
            type: array
            items:
              type: string
              enum:
              - MOBILE_MONEY
    GtqAccountInfo:
      allOf:
      - $ref: '#/components/schemas/GtqAccountInfoBase'
      - type: object
        required:
        - paymentRails
        properties:
          paymentRails:
            type: array
            items:
              type: string
              enum:
              - BANK_TRANSFER
    PaymentTronWalletInfo:
      title: Tron Wallet
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/TronWalletInfo'
      - type: object
        properties:
          assetType:
            type: string
            description: Type of asset
            enum:
            - USDT
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: API token authentication using format `<api token id>:<api client secret>`
    AgentAuth:
      type: http
      scheme: bearer
      description: 'Bearer token authentication for agent-scoped endpoints. The token is the `accessToken` returned when redeeming a device code via `POST /agents/device-codes/{code}/redeem`. Agent credentials are user-scoped: all requests are automatically bound to the agent''s associated customer and subject to the agent''s policy.'
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Grid-Signature
      description: 'Secp256r1 (P-256) asymmetric signature of the webhook payload, which can be used to verify that the webhook was sent by Grid.

        To verify the signature:

        1. Get the Grid public key provided to you during integration

        2. Decode the base64 signature from the header

        3. Create a SHA-256 hash of the request body

        4. Verify the signature using the public key and the hash


        If the signature verification succeeds, the webhook is authentic. If not, it should be rejected.

        '

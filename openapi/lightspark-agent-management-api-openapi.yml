openapi: 3.2.0
info:
  title: Grid Agent Management API
  description: API for managing global payments on the open Money Grid. Built by Lightspark. See the full documentation at https://docs.lightspark.com/.
  version: '2025-10-13'
  contact:
    name: Lightspark Support
    email: support@lightspark.com
  license:
    name: Proprietary
    url: https://lightspark.com/terms
servers:
- url: https://api.lightspark.com/grid/2025-10-13
  description: Production server
security:
- BasicAuth: []
- AgentAuth: []
tags:
- name: Agent Management
  description: 'Endpoints for creating and managing agents (experimental), called by the partner''s backend using platform credentials. Covers the full agent lifecycle: creation, policy configuration, pausing, deletion, the device code installation flow, and approving or rejecting transactions initiated by agents.'
paths:
  /agents:
    post:
      summary: Create an agent
      description: Create a new agent with a specified policy. Returns the created agent and a device code that must be redeemed by the agent software to complete installation.
      operationId: createAgent
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentCreateRequest'
      responses:
        '201':
          description: Agent created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentCreateResponse'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Customer not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    get:
      summary: List agents
      description: Retrieve a paginated list of agents for the authenticated platform.
      operationId: listAgents
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      parameters:
      - name: customerId
        in: query
        description: Filter by customer ID
        required: false
        schema:
          type: string
      - name: isPaused
        in: query
        description: Filter by paused status
        required: false
        schema:
          type: boolean
      - name: isConnected
        in: query
        description: Filter by connection status (whether the device code has been redeemed)
        required: false
        schema:
          type: boolean
      - name: createdAfter
        in: query
        description: Filter agents created after this timestamp (inclusive)
        required: false
        schema:
          type: string
          format: date-time
      - name: createdBefore
        in: query
        description: Filter agents created before this timestamp (inclusive)
        required: false
        schema:
          type: string
          format: date-time
      - name: updatedAfter
        in: query
        description: Filter agents updated after this timestamp (inclusive)
        required: false
        schema:
          type: string
          format: date-time
      - name: updatedBefore
        in: query
        description: Filter agents updated before this timestamp (inclusive)
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination (returned from previous request)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Customer not found when filtering by customerId
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/approvals:
    get:
      summary: List agent transaction approval requests
      description: Retrieve a paginated list of agent actions that require platform approval. Filter by `agentId` or `customerId` to scope results to a specific agent or customer. Approve or reject individual actions via `POST /agents/{agentId}/actions/{actionId}/approve` or `POST /agents/{agentId}/actions/{actionId}/reject`.
      operationId: listAgentApprovals
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      parameters:
      - name: agentId
        in: query
        description: Filter by agent ID
        required: false
        schema:
          type: string
      - name: customerId
        in: query
        description: Filter by customer ID
        required: false
        schema:
          type: string
      - name: startDate
        in: query
        description: Filter by start date (inclusive) in ISO 8601 format
        required: false
        schema:
          type: string
          format: date-time
      - name: endDate
        in: query
        description: Filter by end date (inclusive) in ISO 8601 format
        required: false
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination (returned from previous request)
        required: false
        schema:
          type: string
      - name: sortOrder
        in: query
        description: Order to sort results in
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentActionListResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/{agentId}:
    parameters:
    - name: agentId
      in: path
      description: System-generated unique agent identifier
      required: true
      schema:
        type: string
    get:
      summary: Get agent by ID
      description: Retrieve an agent by its system-generated ID.
      operationId: getAgentById
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    patch:
      summary: Update agent
      description: Update an agent's name or paused state.
      operationId: updateAgent
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentUpdateRequest'
      responses:
        '200':
          description: Agent updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    delete:
      summary: Delete agent
      description: Permanently delete an agent. Connected agent software will lose access immediately.
      operationId: deleteAgent
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      responses:
        '204':
          description: Agent deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/{agentId}/policy:
    parameters:
    - name: agentId
      in: path
      description: System-generated unique agent identifier
      required: true
      schema:
        type: string
    patch:
      summary: Update agent policy
      description: Partially update an agent's policy. Only provided fields will be updated; omitted fields retain their current values. Policy changes take effect immediately. The spending limits currency is immutable; attempting to change it returns a 400 response.
      operationId: updateAgentPolicy
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentPolicyUpdateRequest'
      responses:
        '200':
          description: Agent policy updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Agent'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/{agentId}/device-codes:
    parameters:
    - name: agentId
      in: path
      description: System-generated unique agent identifier
      required: true
      schema:
        type: string
    post:
      summary: Regenerate a device code
      description: Generate a new device code for an existing agent. Use this when the original device code has expired before being redeemed, or when the agent software needs to be reinstalled. An agent has at most one unredeemed device code, so regenerating invalidates the one issued before it.
      operationId: regenerateAgentDeviceCode
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      responses:
        '201':
          description: New device code generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeviceCode'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Agent not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict - Agent already has an active connection and cannot regenerate a device code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/{agentId}/actions/{actionId}/approve:
    parameters:
    - name: agentId
      in: path
      description: System-generated unique agent identifier
      required: true
      schema:
        type: string
    - name: actionId
      in: path
      description: Unique identifier of the agent action to approve
      required: true
      schema:
        type: string
    post:
      summary: Approve an agent action
      description: 'Approve a pending agent action, allowing Grid to proceed with execution. The action must have status `PENDING_APPROVAL`. Once approved, Grid executes the underlying operation (quote execution or transfer) and the action transitions to `APPROVED`.

        For `EXECUTE_QUOTE` actions, note that the underlying quote may have expired between submission and approval — in that case the action will transition to `FAILED` instead.

        This endpoint is called by the platform''s backend using platform credentials, not by the agent itself.'
      operationId: approveAgentAction
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Action approved successfully. Returns the updated AgentAction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAction'
        '400':
          description: Bad request - Action cannot be approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Agent or action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict - Action is not pending approval or has already been processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/{agentId}/actions/{actionId}/reject:
    parameters:
    - name: agentId
      in: path
      description: System-generated unique agent identifier
      required: true
      schema:
        type: string
    - name: actionId
      in: path
      description: Unique identifier of the agent action to reject
      required: true
      schema:
        type: string
    post:
      summary: Reject an agent action
      description: 'Reject a pending agent action, preventing execution. The action must have status `PENDING_APPROVAL`. Once rejected, the action transitions to `REJECTED` and the underlying operation is not executed.

        This endpoint is called by the platform''s backend using platform credentials, not by the agent itself.'
      operationId: rejectAgentAction
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentActionRejectRequest'
      responses:
        '200':
          description: Action rejected successfully. Returns the updated AgentAction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentAction'
        '400':
          description: Bad request - Action cannot be rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Agent or action not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict - Action is not pending approval or has already been processed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/device-codes/status:
    post:
      summary: Get device code status
      description: Check the status of a device code. Use this to poll for agent installation completion after creating an agent.
      operationId: getAgentDeviceCodeStatus
      tags:
      - Agent Management
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeviceCodeRequest'
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeviceCodeStatusResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Device code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /agents/device-codes/redeem:
    post:
      summary: Redeem device code
      description: 'Redeem a device code to obtain agent credentials. This endpoint is called by the agent software during installation. On success, returns a Bearer access token that the agent uses for all subsequent API calls. The token is returned only once and must be stored securely.

        This endpoint does not require platform authentication — the device code itself serves as proof of authorization. A code can be redeemed only once and only before its `expiresAt`.

        Redemption is rate limited in fixed 60-second windows. Calls without platform credentials are limited to 10 per client IP address and 1,000 across all such callers; calls made with platform credentials are limited to 600 per platform instead. A caller over a limit receives `429` with `RATE_LIMITED` and should back off until the window resets before retrying. If the limit cannot be checked, the call is also rejected with `429`.'
      operationId: redeemAgentDeviceCode
      tags:
      - Agent Management
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentDeviceCodeRequest'
      responses:
        '200':
          description: Device code redeemed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDeviceCodeRedeemResponse'
        '400':
          description: Bad request (e.g., code already redeemed or expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '403':
          description: Forbidden - Agents API is not enabled for the platform
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Device code not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '429':
          description: Too many requests. Returned with `RATE_LIMITED`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  schemas:
    WireRailStatus:
      type: string
      enum:
      - PENDING
      - SETTLED
      - FAILED
      description: 'Status of the wire on Fedwire.


        | Status | Description |

        |--------|-------------|

        | `PENDING` | Submitted to Fedwire and not yet delivered. |

        | `SETTLED` | Fedwire delivered the wire. |

        | `FAILED` | Fedwire or the receiving bank rejected the wire and no funds moved. |'
      example: SETTLED
    PaymentSwiftAccountInfo:
      title: SWIFT Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/SwiftAccountInfo'
      - type: object
        required:
        - accountHolderName
        properties:
          accountHolderName:
            type: string
            description: The name of the account holder as it must appear on the wire. Remitting banks match this against the beneficiary name field, so payers should copy it exactly.
            example: Acme Exports Pte Ltd
            minLength: 1
            maxLength: 255
          bankAddress:
            type: string
            description: The address of the bank holding the account, when known.
            example: 12 Marina Boulevard, Singapore 018982
            minLength: 1
            maxLength: 1024
          reference:
            type: string
            description: Reference code to include with the payment when present. SWIFT payments are attributed by the destination account number/IBAN, so this account type typically requires no reference.
            example: UMA-Q12345-REF
    SwiftAccountInfoBase:
      type: object
      description: 'At least one of accountNumber or iban is always present: IBAN-only corridors (e.g. BR, GB) use iban, other corridors use accountNumber, and both appear when the bank exposes both identifiers for the same account.'
      required:
      - accountType
      - swiftCode
      - bankName
      - country
      properties:
        accountType:
          type: string
          enum:
          - SWIFT_ACCOUNT
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the bank account
          example: NG
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank
          example: DEUTDEFF
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
        bankName:
          type: string
          description: The name of the bank
          example: Deutsche Bank
          minLength: 1
          maxLength: 255
        accountNumber:
          type: string
          description: The bank account number. Required for most corridors. Use iban instead for IBAN-only corridors (e.g. BR, GB).
          example: '1234567890'
          minLength: 1
          maxLength: 34
        iban:
          type: string
          description: The IBAN of the bank account. Required for IBAN-only corridors (e.g. BR, GB). Use accountNumber for all other corridors.
          example: GB29NWBK60161331926819
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Za-z0-9]{11,30}$
      example:
        accountType: SWIFT_ACCOUNT
        country: NG
        swiftCode: DEUTDEFF
        bankName: Deutsche Bank
        accountNumber: '1234567890'
    PurposeOfPayment:
      type: string
      description: 'The purpose of the payment. This may be required when sending to certain geographies (e.g. India).


        Some destinations accept only certain purposes. A business payout to China must use one of the purposes listed in [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents), and each needs its own supporting documents.'
      enum:
      - GIFT
      - SELF
      - GOODS_OR_SERVICES
      - EDUCATION
      - HEALTH_OR_MEDICAL
      - REAL_ESTATE_PURCHASE
      - TAX_PAYMENT
      - LOAN_PAYMENT
      - UTILITY_BILL
      - DONATION
      - TRAVEL
      - FAMILY_SUPPORT
      - SALARY_PAYMENT
      - EXPORTED_GOODS_PREPAYMENT
      - EXPORTED_GOODS_POSTPAYMENT
      - SERVICE_CHARGES
      - OFFICE_EXPENSES
      - DELIVERY_FEES
      - HOTEL_ACCOMMODATION
      - COMMISSION_ON_GOODS
      - COMMISSION_ON_SERVICES
      - ACCOUNTING_SERVICES
      - EXHIBITION_SERVICES
      - OTHER
    AgentActionFailureReason:
      type: string
      enum:
      - QUOTE_EXPIRED
      - POLICY_DENIED
      - AGENT_INACTIVE
      - EXECUTION_FAILED
      - PRICE_MOVED
      - ADDRESS_REFUSED
      description: 'Why an agent action has status `FAILED`.


        | Reason | Description |

        |--------|-------------|

        | `QUOTE_EXPIRED` | The action''s quote expired before execution |

        | `POLICY_DENIED` | The agent policy no longer allowed the action |

        | `AGENT_INACTIVE` | The agent was paused or deleted before execution |

        | `EXECUTION_FAILED` | Grid could not execute the approved action |

        | `PRICE_MOVED` | A quote to a `CHAIN_ADDRESS` would no longer deliver its `minimumReceivingAmount` when it executed, so Grid did not send |

        | `ADDRESS_REFUSED` | Grid refused the send''s destination before it signed the send: the destination is no longer one the agent may send to (for example, a Spark address removed from the customer''s saved addresses), or one of the customer''s records of the address was refused or is held for review. A `CHAIN_ADDRESS` that screening refuses fails with `EXECUTION_FAILED` |

        '
    BaseDestination:
      type: object
      required:
      - destinationType
      properties:
        destinationType:
          $ref: '#/components/schemas/DestinationType'
    AgentSendCurrency:
      type: string
      enum:
      - USDC
      - USDT
      description: Asset an agent can send to an address on another chain. `TRON` supports `USDT` only, and `BASE` supports `USDC` only.
    UsdBankAccountDetails:
      title: US Bank Account Details
      type: object
      description: 'The account on the other end of the transfer: the sender''s account on a source, the recipient''s account on a destination.'
      properties:
        accountHolderName:
          type: string
          description: Name of the account holder.
          example: John Sender
        routingNumber:
          type: string
          description: 9-digit ABA routing number of the account's bank.
          example: '021000021'
        accountNumber:
          type: string
          description: Account number, masked to its last four digits.
          example: '****6789'
    AccountQuoteSource:
      title: Account
      allOf:
      - $ref: '#/components/schemas/BaseQuoteSource'
      - type: object
        required:
        - accountId
        - sourceType
        properties:
          sourceType:
            type: string
            enum:
            - ACCOUNT
          accountId:
            type: string
            description: Source account identifier
            example: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
          customerId:
            type: string
            description: The customer on whose behalf the transaction is being initiated. Required when funding from a `BULK_SETTLEMENT` account. The customer is never the account owner, because the platform owns the account. When funding from an FBO account, this field is optional. If you omit it, the transaction is initiated on behalf of the platform. For any other account, it defaults to the account owner's customerId.
            example: Customer:019542f5-b3e7-1d02-0000-000000000001
        description: Source account details
    Error429:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | RATE_LIMITED | Too many requests in a short window; retry after the interval indicated by the `Retry-After` response header |

            | DAILY_VOLUME_LIMIT_EXCEEDED | The requested amount would exceed the configured daily volume limit for this trade corridor or withdrawal currency |

            '
          enum:
          - RATE_LIMITED
          - DAILY_VOLUME_LIMIT_EXCEEDED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    AgentDeviceCodeRequest:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          description: The device code.
          example: jqzJR3AgI9OAwb_enypARw
    StablecoinAssetType:
      type: string
      description: Type of asset
      enum:
      - USDC
      - USDT
    AgentApprovalThresholds:
      type: object
      description: Thresholds that force approval for high-value transactions, overriding the default execution mode. The threshold currency must equal the policy's spending limits currency. When a transaction is denominated in a different currency, Grid converts it to the policy currency at evaluation time.
      properties:
        currency:
          type: string
          description: ISO 4217 currency code that the amount threshold is denominated in. Required when amount is set and must equal `spendingLimits.currency`.
          example: USD
        amount:
          type:
          - integer
          - 'null'
          description: If set, any transaction above this amount (in the smallest unit of the specified currency) will require explicit approval even when the agent's defaultExecutionMode is AUTO. Null means no threshold override.
          example: 100000
    AgentListResponse:
      type: object
      required:
      - data
      - hasMore
      properties:
        data:
          type: array
          description: List of agents matching the filter criteria.
          items:
            $ref: '#/components/schemas/Agent'
        hasMore:
          type: boolean
          description: Indicates if more results are available beyond this page.
        nextCursor:
          type: string
          description: Cursor to retrieve the next page of results (only present if hasMore is true).
        totalCount:
          type: integer
          description: Total number of agents matching the criteria (excluding pagination).
    AgentAction:
      type: object
      description: An action submitted by an agent that may require platform approval before execution. All agent-initiated operations (quote execution, transfers) are represented as AgentActions, giving the platform a consistent object to approve, reject, and audit regardless of the underlying operation type.
      required:
      - id
      - agentId
      - customerId
      - platformCustomerId
      - status
      - type
      - expiresAt
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          description: System-generated unique identifier for this action.
          example: AgentAction:019542f5-b3e7-1d02-0000-000000000099
        agentId:
          type: string
          description: The agent that submitted this action.
          example: Agent:019542f5-b3e7-1d02-0000-000000000042
        customerId:
          type: string
          description: The customer on whose behalf the action was submitted.
          example: Customer:019542f5-b3e7-1d02-0000-000000000010
        platformCustomerId:
          type: string
          description: Platform-specific ID of the customer.
          example: user-a1b2c3
        status:
          $ref: '#/components/schemas/AgentActionStatus'
        type:
          $ref: '#/components/schemas/AgentActionType'
        quote:
          allOf:
          - $ref: '#/components/schemas/AgentQuote'
          description: The quote being executed. Contains the full amount, currency, destination, and rate details needed to present an approval decision to the user. Present for `EXECUTE_QUOTE`.
        transaction:
          allOf:
          - $ref: '#/components/schemas/TransactionOneOf'
          description: The resulting transaction, populated once the action has been approved and execution has begun. Absent while the action is `PENDING_APPROVAL` or `REJECTED`.
        rejectionReason:
          type: string
          description: Human-readable reason provided by the platform when rejecting the action. Only present when status is `REJECTED`.
          example: Transaction amount exceeds customer's current risk limit.
        failureReason:
          $ref: '#/components/schemas/AgentActionFailureReason'
          description: Machine-readable reason the action failed. Only present when status is `FAILED`; `rejectionReason` is used only for `REJECTED` actions.
        expiresAt:
          type: string
          format: date-time
          description: When the action expires. For `EXECUTE_QUOTE`, this is the quote's own expiry. A `PENDING_APPROVAL` action that reaches this time transitions to `FAILED` with `failureReason` `QUOTE_EXPIRED`; approval never creates a replacement quote.
          example: '2025-10-03T15:05:00Z'
        createdAt:
          type: string
          format: date-time
          description: When the action was submitted by the agent.
          example: '2025-10-03T15:00:00Z'
        updatedAt:
          type: string
          format: date-time
          description: When the action was last updated.
          example: '2025-10-03T15:02:00Z'
    AgentActionType:
      type: string
      enum:
      - EXECUTE_QUOTE
      description: 'The type of action the agent is requesting.


        | Type | Description |

        |------|-------------|

        | `EXECUTE_QUOTE` | Execute a quote |

        '
    PaymentBrlAccountInfo:
      title: BRL Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - qrCode
        properties:
          accountType:
            type: string
            enum:
            - BRL_ACCOUNT
          qrCode:
            type: string
            description: A PIX QR code payload that can be used to fund the transaction. This can be rendered as a QR code image or pasted into a PIX-compatible banking app.
            minLength: 1
    OutgoingTransactionFailureReason:
      type: string
      enum:
      - QUOTE_EXPIRED
      - QUOTE_RATE_UNAVAILABLE
      - QUOTE_EXECUTION_FAILED
      - FUNDING_AMOUNT_MISMATCH
      - SCA_NOT_COMPLETED
      - PAYOUT_RETURNED
      - LIMIT_EXCEEDED
      - ACCOUNT_CANNOT_RECEIVE
      - ACCOUNT_INVALID
      - COMPLIANCE_REJECTED
      - LIGHTNING_PAYMENT_FAILED
      - COUNTERPARTY_POST_TX_FAILED
      - SWEEP_AMOUNT_OUT_OF_RANGE
      - SWEEP_QUOTE_FAILED
      description: 'Reason for failure of an outgoing transaction. This is used to provide more

        context on why a transaction failed. If the transaction is not in a failed

        state, this field is omitted.


        When a payout partner rejects or fails a payment, one of the granular payout

        reasons (`PAYOUT_RETURNED`, `LIMIT_EXCEEDED`, `ACCOUNT_CANNOT_RECEIVE`,

        `ACCOUNT_INVALID`, `COMPLIANCE_REJECTED`) is returned when available.

        `COUNTERPARTY_POST_TX_FAILED` is a coarse fallback used only when no granular

        reason is available.


        `SCA_NOT_COMPLETED` means the customer did not satisfy the Strong Customer

        Authentication challenge before it expired, so the transaction was never

        authorized and no funds were moved. Only occurs for customers in a region

        where SCA is required (e.g. the EU). Create a new quote to try again, and have

        the customer authorize it while the challenge is live.


        | Reason | Description |

        |--------|-------------|

        | `QUOTE_EXPIRED` | The quote was not executed before its expiry window |

        | `QUOTE_RATE_UNAVAILABLE` | The quoted exchange rate was no longer available when the quote was executed, so nothing was exchanged. Create a new quote to get a current rate |

        | `QUOTE_EXECUTION_FAILED` | The quote could not be executed. Covers any internal failure on the way to settlement, whether or not funds were debited — a debited amount is refunded automatically |

        | `FUNDING_AMOUNT_MISMATCH` | The funds received did not match the expected amount |

        | `SCA_NOT_COMPLETED` | The customer did not complete the Strong Customer Authentication challenge before it expired |

        | `PAYOUT_RETURNED` | The receiving bank accepted the payout and then returned or reversed it |

        | `LIMIT_EXCEEDED` | The payout exceeds a recipient-, account-, or corridor-level limit at the partner |

        | `ACCOUNT_CANNOT_RECEIVE` | The account exists but can''t accept this payment — dormant, frozen, restricted, or the currency or payment rail isn''t supported for that account. A sweep whose rule names a rail the destination cannot accept reports this |

        | `ACCOUNT_INVALID` | The recipient account couldn''t be found or the details are wrong — bad IBAN/account number, beneficiary not found, or account closed |

        | `COMPLIANCE_REJECTED` | The payout partner rejected the recipient on compliance grounds — sanctions, watchlist, or KYC/AML screening |

        | `LIGHTNING_PAYMENT_FAILED` | Deprecated — superseded by `QUOTE_EXECUTION_FAILED`. The Lightning settlement leg failed |

        | `COUNTERPARTY_POST_TX_FAILED` | Deprecated — coarse fallback retained for historical transactions when no granular payout reason is available |

        | `SWEEP_AMOUNT_OUT_OF_RANGE` | The amount was outside the range the corridor to the rule''s destination can carry — below its minimum or above its maximum. The rule''s `minimumAmount` and `maximumAmount` give the current band |

        | `SWEEP_QUOTE_FAILED` | Grid could not price the sweep to the rule''s destination. A sweep that was priced and then failed on the way to settlement reports `QUOTE_EXECUTION_FAILED`, the same as any other payout |


        The `SWEEP_*` reasons apply to a payment that settled into a rule-based

        account and could not be swept onward. A rule-based account never holds a

        balance, so the funds are moved to the account holder''s own account in the

        same currency.

        '
    TransactionDestinationOneOf:
      oneOf:
      - $ref: '#/components/schemas/AccountTransactionDestination'
      - $ref: '#/components/schemas/UmaAddressTransactionDestination'
      discriminator:
        propertyName: destinationType
        mapping:
          ACCOUNT: '#/components/schemas/AccountTransactionDestination'
          UMA_ADDRESS: '#/components/schemas/UmaAddressTransactionDestination'
    Agent:
      type: object
      description: A programmatic agent with scoped permissions and a spending policy, used to automate payment workflows.
      required:
      - id
      - name
      - customerId
      - isPaused
      - isConnected
      - policy
      - usage
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          description: System-generated unique identifier for the agent.
          example: Agent:019542f5-b3e7-1d02-0000-000000000001
        name:
          type: string
          description: Human-readable name for the agent.
          example: Payroll Automation Agent
        customerId:
          type: string
          description: The ID of the customer this agent operates on behalf of.
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        isPaused:
          type: boolean
          description: Whether the agent is currently paused. Paused agents cannot initiate any actions.
          example: false
        isConnected:
          type: boolean
          description: Whether the agent has been installed and connected (i.e., its device code has been redeemed).
          example: true
        policy:
          $ref: '#/components/schemas/AgentPolicy'
        usage:
          $ref: '#/components/schemas/AgentUsage'
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: '2025-07-21T17:32:28Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
          example: '2025-07-21T17:32:28Z'
    AgentExecutionMode:
      type: string
      enum:
      - AUTO
      - APPROVAL_REQUIRED
      description: 'Execution mode controlling whether agent actions require human approval. AUTO: The agent can execute actions autonomously without explicit approval. APPROVAL_REQUIRED: All agent actions require explicit human approval before execution.'
    AchPaymentRail:
      type: string
      enum:
      - ACH
      - ACH_SAME_DAY
    TransactionDirection:
      type: string
      enum:
      - CREDIT
      - DEBIT
      description: 'Whether the transaction credits (funds in) or debits (funds out) the customer''s account. Independent of `type`: an incoming transaction is normally a `CREDIT`, but an inbound ACH pull, for example, is an `INCOMING` transaction with a `DEBIT` direction.'
    TransactionSourceOneOf:
      oneOf:
      - $ref: '#/components/schemas/AccountTransactionSource'
      - $ref: '#/components/schemas/UmaAddressTransactionSource'
      - $ref: '#/components/schemas/RealtimeFundingTransactionSource'
      discriminator:
        propertyName: sourceType
        mapping:
          ACCOUNT: '#/components/schemas/AccountTransactionSource'
          UMA_ADDRESS: '#/components/schemas/UmaAddressTransactionSource'
          REALTIME_FUNDING: '#/components/schemas/RealtimeFundingTransactionSource'
    MxnAccountInfoBase:
      type: object
      required:
      - accountType
      - clabeNumber
      properties:
        accountType:
          type: string
          enum:
          - MXN_ACCOUNT
        clabeNumber:
          type: string
          description: The CLABE number of the bank
          example: '123456789012345678'
          minLength: 18
          maxLength: 18
          pattern: ^[0-9]{18}$
      example:
        accountType: MXN_ACCOUNT
        clabeNumber: '123456789012345678'
    Error401:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | UNAUTHORIZED | Issue with API credentials |

            | INVALID_SIGNATURE | Signature header is invalid |

            | WALLET_SIGNATURE_MISSING | The `Grid-Wallet-Signature` header is required for this Embedded Wallet action but was not supplied |

            | WALLET_SIGNATURE_MALFORMED | The `Grid-Wallet-Signature` header could not be parsed (bad encoding, structure, or fields) |

            | WALLET_SIGNATURE_BODY_MISMATCH | The `Grid-Wallet-Signature` was computed over a different request body than the one received |

            | WALLET_SIGNATURE_INVALID | The `Grid-Wallet-Signature` failed cryptographic verification against the registered credential |

            | REQUEST_ID_MISSING | The `Request-Id` header is required on the signed retry but was not supplied (paired with `Grid-Wallet-Signature`) |

            '
          enum:
          - UNAUTHORIZED
          - INVALID_SIGNATURE
          - WALLET_SIGNATURE_MISSING
          - WALLET_SIGNATURE_MALFORMED
          - WALLET_SIGNATURE_BODY_MISMATCH
          - WALLET_SIGNATURE_INVALID
          - REQUEST_ID_MISSING
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    RefundReason:
      type: string
      enum:
      - TRANSACTION_FAILED
      - USER_CANCELLATION
      - TIMEOUT
      description: Reason for the refund
      example: TRANSACTION_FAILED
    Error403:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | FORBIDDEN | Insufficient permissions |

            | USER_NOT_READY | Customer exists but is not ready for operation |

            | COUNTERPARTY_NOT_ALLOWED | Counterparty has not been enabled for your account |

            | VELOCITY_LIMIT_EXCEEDED | Counterparty has exceeded velocity limits |

            | END_USER_TERMS_NOT_ACCEPTED | Customer has not accepted the End User Terms |

            | CUSTOMER_NOT_VERIFIED | The customer is not verified and cannot perform this action |

            | SANCTION_BLOCKED | Blocked by sanction screening |

            | DESTINATION_NOT_ALLOWED | The agent may not pay this destination |

            '
          enum:
          - FORBIDDEN
          - USER_NOT_READY
          - COUNTERPARTY_NOT_ALLOWED
          - VELOCITY_LIMIT_EXCEEDED
          - END_USER_TERMS_NOT_ACCEPTED
          - CUSTOMER_NOT_VERIFIED
          - SANCTION_BLOCKED
          - DESTINATION_NOT_ALLOWED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    AccountTransactionDestination:
      title: Account Destination
      allOf:
      - $ref: '#/components/schemas/BaseTransactionDestination'
      - type: object
        required:
        - accountId
        - destinationType
        properties:
          destinationType:
            type: string
            enum:
            - ACCOUNT
          accountId:
            type: string
            description: Destination account identifier
            example: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
          railDetails:
            $ref: '#/components/schemas/RailDetailsOneOf'
          onChainTransaction:
            $ref: '#/components/schemas/OnChainTransaction'
            deprecated: true
            description: Deprecated. Use `railDetails`, which carries the same hash and network when `paymentRail` is `ONCHAIN`.
        description: Destination account details
    AgentPermission:
      type: string
      enum:
      - VIEW_TRANSACTIONS
      - CREATE_QUOTES
      - EXECUTE_QUOTES
      - MANAGE_EXTERNAL_ACCOUNTS
      - RECEIVE_FUNDS
      - MANAGE_IDENTITY
      - MANAGE_CARDS
      description: 'Permission granted to an agent that determines what actions it can perform. VIEW_TRANSACTIONS: Can list and retrieve transactions and account balances. CREATE_QUOTES: Can create quotes. EXECUTE_QUOTES: Can execute quotes. MANAGE_EXTERNAL_ACCOUNTS: Can create and manage external accounts. RECEIVE_FUNDS: Can create deposit targets for receiving funds. MANAGE_IDENTITY: Can read and update customer identity information and start verification. MANAGE_CARDS: Can read, tighten, and freeze its cards.'
    PaymentMxnAccountInfo:
      title: MXN Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/MxnAccountInfo'
      - type: object
        required:
        - reference
        properties:
          reference:
            type: string
            description: Unique reference code that must be included with the payment to properly credit it
            example: UMA-Q12345-REF
    UmaAddressDestination:
      title: UMA Address
      allOf:
      - $ref: '#/components/schemas/BaseDestination'
      - type: object
        required:
        - umaAddress
        - destinationType
        - currency
        properties:
          destinationType:
            type: string
            enum:
            - UMA_ADDRESS
          umaAddress:
            type: string
            maxLength: 200
            description: UMA address of the recipient
            example: $receiver@uma.domain.com
          currency:
            type: string
            description: Currency code for the destination. See [Supported Currencies](https://docs.lightspark.com/platform-overview/core-concepts/currencies-and-rails) for the full list of supported fiat and crypto currencies.
            example: EUR
        description: UMA address destination details
    PaymentArsAccountInfo:
      title: ARS Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - accountNumber
        properties:
          accountType:
            type: string
            enum:
            - ARS_ACCOUNT
          accountNumber:
            type: string
            description: The static CVU (Clave Virtual Uniforme) bank account number to pay to.
            minLength: 22
            maxLength: 22
            pattern: ^\d{22}$
            example: '0000003100074052501434'
    UsdAccountInfoBase:
      type: object
      required:
      - accountType
      - accountNumber
      - routingNumber
      properties:
        accountType:
          type: string
          enum:
          - USD_ACCOUNT
        accountNumber:
          type: string
          description: The account number of the bank
          minLength: 1
          maxLength: 34
        routingNumber:
          type: string
          description: The ABA routing number
          example: '021000021'
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{9}$
        bankName:
          type: string
          description: The name of the financial institution holding the account. Optional on every rail, and recommended for wires, where it identifies the beneficiary's institution on the payment message. Not checked against `GET /discoveries`.
          minLength: 1
          maxLength: 140
          example: Chase Bank
        intermediaryBankName:
          type: string
          description: The name of the intermediary financial institution, for accounts reachable only through a correspondent bank. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: JPMorgan Chase Bank
          minLength: 1
          maxLength: 140
        intermediaryRoutingNumber:
          type: string
          description: The ABA routing number of the intermediary financial institution. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: '021000021'
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{9}$
        fiToFiInformation:
          type: string
          description: Bank-to-bank instructions carried alongside the payment. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: /BNF/Invoice 4471
          maxLength: 210
      example:
        accountType: USD_ACCOUNT
        accountNumber: '1234567890'
        routingNumber: '021000021'
        bankName: Chase Bank
        intermediaryBankName: JPMorgan Chase Bank
        intermediaryRoutingNumber: '021000021'
        fiToFiInformation: /BNF/Invoice 4471
        bankAccountType: CHECKING
    UsdAccountInfo:
      allOf:
      - $ref: '#/components/schemas/UsdAccountInfoBase'
      - type: object
        required:
        - paymentRails
        properties:
          paymentRails:
            type: array
            items:
              type: string
              enum:
              - ACH
              - ACH_SAME_DAY
              - WIRE
              - RTP
              - FEDNOW
          bankAccountType:
            type: string
            description: Whether the account is a checking or a savings account. Grid uses this to set the ACH transaction code, so a value that does not match the account causes the receiving bank to return a notification of change.
            enum:
            - CHECKING
            - SAVINGS
            example: CHECKING
    QuoteDestinationOneOf:
      oneOf:
      - $ref: '#/components/schemas/AccountDestination'
      - $ref: '#/components/schemas/UmaAddressDestination'
      discriminator:
        propertyName: destinationType
        mapping:
          ACCOUNT: '#/components/schemas/AccountDestination'
          UMA_ADDRESS: '#/components/schemas/UmaAddressDestination'
    UmaAddressTransactionDestination:
      title: UMA Address Destination
      allOf:
      - $ref: '#/components/schemas/BaseTransactionDestination'
      - type: object
        required:
        - umaAddress
        - destinationType
        properties:
          destinationType:
            type: string
            enum:
            - UMA_ADDRESS
          umaAddress:
            type: string
            description: UMA address of the recipient
            example: $receiver@uma.domain.com
        description: UMA address destination details
    BaseWalletInfo:
      type: object
      required:
      - address
      - accountType
      properties:
        accountType:
          type: string
          enum:
          - BASE_WALLET
        address:
          type: string
          description: Base eth wallet address
          example: '0xAbCDEF1234567890aBCdEf1234567890ABcDef12'
    SparkWalletInfo:
      type: object
      required:
      - address
      - accountType
      properties:
        accountType:
          type: string
          enum:
          - SPARK_WALLET
        address:
          type: string
          description: Spark wallet address
          example: spark1pgssyuuuhnrrdjswal5c3s3rafw9w3y5dd4cjy3duxlf7hjzkp0rqx6dj6mrhu
    PaymentEthereumWalletInfo:
      title: Ethereum Wallet
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/EthereumWalletInfo'
      - type: object
        properties:
          assetType:
            $ref: '#/components/schemas/StablecoinAssetType'
    PlasmaWalletInfo:
      type: object
      required:
      - address
      - accountType
      properties:
        accountType:
          type: string
          enum:
          - PLASMA_WALLET
        address:
          type: string
          description: Plasma wallet address
          example: '0xAbCDEF1234567890aBCdEf1234567890ABcDef12'
    AgentDeviceCodeStatus:
      type: string
      description: 'The current status of the device code.

        - `PENDING`: The code is active and has not been redeemed.

        - `REDEEMED`: The code was successfully redeemed.

        - `EXPIRED`: The code expired before it was redeemed.

        - `INVALIDATED`: The code was superseded or otherwise invalidated before it was redeemed.

        '
      enum:
      - PENDING
      - REDEEMED
      - EXPIRED
      - INVALIDATED
      example: PENDING
    CardTransactionStatus:
      type: string
      enum:
      - AUTHORIZED
      - PARTIALLY_SETTLED
      - SETTLED
      - DECLINED
      - VOIDED
      - EXCEPTION
      description: 'Lifecycle status of a card transaction. The status tracks the authorization

        outcome and settlement — a return against a purchase is its own dated

        `CREDIT` row linked to the purchase via `originalTransactionId`, not a

        status of its own.


        | Status | Description |

        |--------|-------------|

        | `AUTHORIZED` | The auth has been approved and a hold placed on the funding source; no clearing has arrived yet. |

        | `PARTIALLY_SETTLED` | At least one clearing has arrived and posted, but more clearings are still expected (split shipments, tips, multi-leg trips). |

        | `SETTLED` | All clearings for the auth have posted and the transaction is closed against the funding source. A `RETURN` received afterwards keeps the purchase `SETTLED`; the return appears as its own `CREDIT` transaction. |

        | `DECLINED` | The authorization was declined before any money moved. Declines carry no settlement and must be excluded from cardholder statements. |

        | `VOIDED` | The authorization was fully reversed or expired before any clearing posted, so the hold closed without moving money. `authorizedAmount` reports what is still held, normally 0, and `settledAmount` is absent. |

        | `EXCEPTION` | The transaction settled to the card network but the corresponding pull from the funding source failed (e.g. balance no longer covers the post-hoc clearing). Surfaces high-urgency alerts and is the dashboard query for stuck reconciliations. |

        '
    EurAccountInfoBase:
      type: object
      required:
      - accountType
      - iban
      properties:
        accountType:
          type: string
          enum:
          - EUR_ACCOUNT
        iban:
          type: string
          description: The IBAN of the bank account
          example: DE89370400440532013000
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Za-z0-9]{11,30}$
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank. When omitted, Grid derives it from the IBAN when possible. Provide it when automatic derivation is unavailable.
          example: DEUTDEFF
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
      example:
        accountType: EUR_ACCOUNT
        iban: DE89370400440532013000
        swiftCode: DEUTDEFF
    RealtimeFundingQuoteSource:
      title: Real-time Funding
      allOf:
      - $ref: '#/components/schemas/BaseQuoteSource'
      - type: object
        required:
        - currency
        - sourceType
        properties:
          sourceType:
            type: string
            enum:
            - REALTIME_FUNDING
          customerId:
            type: string
            description: Source customer ID. If this transaction is being initiated on behalf of a customer, this is required. If customerId is not provided, the quote will be created on behalf of the platform itself.
            example: Customer:019542f5-b3e7-1d02-0000-000000000009
          currency:
            type: string
            description: Currency code for the funding source. See [Supported Currencies](https://docs.lightspark.com/platform-overview/core-concepts/currencies-and-rails) for the full list of supported fiat and crypto currencies.
            example: USD
          cryptoNetwork:
            type: string
            description: 'The crypto network to use for the funding source. Required when `currency` is a stablecoin (e.g. USDC, USDT). Specifies which network the customer will deposit on, so the correct deposit address can be generated. Example values: `SOLANA`, `ETHEREUM`, `BASE`, `POLYGON`, `TRON`, `PLASMA`, `ARBITRUM`, `SPARK`, `LIGHTNING`, `BITCOIN`.'
            example: SOLANA
        description: Fund the quote using a real-time funding source (RTP, SEPA Instant, Spark, Stables, etc.). This will require manual just-in-time funding using `paymentInstructions` in the response. Because quotes expire quickly, this option is only valid for instant payment methods. Do not try to fund a quote with a non-instant payment method (ACH, etc.).
    Currency:
      type: object
      properties:
        code:
          type: string
          description: Three-letter currency code (ISO 4217) for fiat currencies. Some cryptocurrencies may use their own ticker symbols (e.g. "BTC" for Bitcoin, "USDC" for USDC, etc.)
          example: USD
        name:

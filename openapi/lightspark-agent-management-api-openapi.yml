          reconciliationInstructions:
            $ref: '#/components/schemas/ReconciliationInstructions'
            description: Reconciliation details for this transaction. For the on-chain hash of a crypto payout to an external wallet, see the destination's `railDetails` instead.
          paymentInstructions:

          type: string
          description: The `RULE_BASED` internal account whose deposit this transaction sweeps. Present only on sweep transactions. For these, `source` describes the party that made the deposit when it is known, and is this account otherwise.
          example: InternalAccount:019542f5-b3e7-1d02-0000-000000000011
        customerId:
          type: string
          description: System ID of the customer this transaction belongs to
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        platformCustomerId:
          type: string
          description: Platform-specific ID of the customer this transaction belongs to
          example: 18d3e5f7b4a9c2
        settledAt:
          type: string
          format: date-time
          description: When the payment was or will be settled
          example: '2025-08-15T14:30:00Z'
        createdAt:
          type: string
          format: date-time
          description: When the transaction was created
          example: '2025-08-15T14:25:18Z'
        updatedAt:
          type: string
          format: date-time
          description: When the transaction was last updated
          example: '2025-08-15T14:30:00Z'
        receiptDeliveryConfirmedAt:
          type: string
          format: date-time
          description: The time at which the platform confirmed delivery of the receipt to their customer.
          example: '2025-08-15T14:31:00Z'
        agentId:
          type: string
          description: If this transaction was initiated by an agent, the system-generated ID of that agent. Absent for platform-initiated transactions.
          example: Agent:019542f5-b3e7-1d02-0000-000000000042
        description:
          type: string
          description: Optional memo or description for the payment
          example: 'Payment for invoice #1234'
        sentAmount:
          $ref: '#/components/schemas/CurrencyAmount'
          description: Amount sent in the sender's currency
        exchangeRate:
          type: number
          description: 'Number of sending currency units per receiving currency unit. The rate is fee-exclusive: Grid deducts fees from the sending amount before converting at this rate.'
          exclusiveMinimum: 0
          example: 1.08
        quoteId:
          type: string
          description: The ID of the quote that was used to trigger this payment
          example: Quote:019542f5-b3e7-1d02-0000-000000000006
        refund:
          $ref: '#/components/schemas/Refund'
          description: The refund if transaction was refunded.
        counterpartyInformation:
          $ref: '#/components/schemas/CounterpartyInformation'
    PaymentDocumentRequirementId:
      type: string
      description: 'A stable identifier for one required document within a purpose''s requirements. The same ID means the same requirement across quotes. It is separate from `PaymentDocumentType`. The requirement ID names the document to supply, and the document type names what a file is. The two differ where a requirement accepts alternatives. For example, a file declared as either `PURCHASE_ORDER` or `DELIVERY_SLIP` fills the `SUPPORTING_PROOF` requirement.


        [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents) lists the IDs each purpose requires.


        Treat the ID as an opaque value, not a member of a fixed list. Grid may add new IDs as requirements change.'
      example: SUPPORTING_PROOF

        code:
          type: string
          description: 'Device code used to install and connect the agent software: an opaque 22-character URL-safe base64 string encoding 128 random bits. It is returned only when it is issued, because Grid stores only a hash of it; if it is lost before it is redeemed, regenerate it. It can be redeemed once.'
          example: jqzJR3AgI9OAwb_enypARw
        agentId:
          type: string
          description: The agent this device code belongs to.
          example: Agent:019542f5-b3e7-1d02-0000-000000000001
        expiresAt:
          type: string
          format: date-time
          description: Timestamp when this device code expires. Codes expire 15 minutes after they are issued by default; Grid can configure a platform's lifetime between 1 and 60 minutes.
          example: '2025-07-22T17:32:28Z'
        redeemed:
          type: boolean
          description: Whether this device code has already been redeemed by the agent.
          example: false
    TransactionOneOf:

openapi: 3.2.0
info:
  title: Grid Documents API
  description: API for managing global payments on the open Money Grid. Built by Lightspark. See the full documentation at https://docs.lightspark.com/.
  version: '2025-10-13'
  contact:
    name: Lightspark Support
    email: support@lightspark.com
  license:
    name: Proprietary
    url: https://lightspark.com/terms
servers:
- url: https://api.lightspark.com/grid/2025-10-13
  description: Production server
security:
- BasicAuth: []
- AgentAuth: []
tags:
- name: Documents
  description: Endpoints for uploading and managing verification documents for customers and beneficial owners. Supports KYC and KYB document requirements.
paths:
  /documents:
    post:
      summary: Upload a document
      description: 'Upload a verification document for a customer or beneficial owner.

        The request must use multipart/form-data with the file in the `file` field

        and metadata in the remaining fields.


        Every upload requires `file`, `documentType`, `country`, and

        `documentHolder`. Identity documents require more fields:


        | `documentType` | Also required | `side` |

        | -------------- | ------------- | ------ |

        | `PASSPORT` | `documentNumber`, `issuingAuthority` | Not allowed |

        | `DRIVERS_LICENSE` | `documentNumber`, `issuingAuthority` | Required |

        | `NATIONAL_ID` | `documentNumber`, `issuingAuthority` | Required |

        | Any other type | None | Optional |


        Where `side` is required, upload the `FRONT` and `BACK` as two separate

        documents. A driver''s license issued in Brazil (`country` is `BR`) is

        the exception: upload it as one image and omit `side`.


        A missing required field, or a `side` that isn''t allowed, returns

        `400 INVALID_INPUT`.


        Supported file types: `application/pdf`, `image/jpeg`, and `image/png`.

        Grid matches on the `Content-Type` of the multipart part, not the file

        extension. Any other type, and any file over 10 MB, returns

        `400 INVALID_INPUT`.


        Grid forwards the file to its verification provider, which screens it as

        the request is handled and can reject it with `422 DOCUMENT_REJECTED`.

        To pass that screen, a photo or scan of a document must:


        - show the whole document, with all four corners inside the frame and

        nothing overlapping an edge

        - be in focus and free of glare, so every field and the machine-readable

        zone can be read

        - be in color, not a black-and-white copy

        - be a photo or scan of the physical document, not a screen capture, and

        not retouched in an image editor

        - be unexpired'
      operationId: uploadDocument
      tags:
      - Documents
      security:
      - BasicAuth: []
      requestBody:
        $ref: '#/components/requestBodies/DocumentUploadRequestBody'
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad request - Invalid file type, size, or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Document holder not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '422':
          description: The verification provider rejected the file. `precheckErrors` names each problem it found. No document is created, so re-upload a corrected file with `POST /documents`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    get:
      summary: List documents
      description: Retrieve a list of documents with optional filtering by document holder.
      operationId: listDocuments
      tags:
      - Documents
      security:
      - BasicAuth: []
      parameters:
      - name: documentHolder
        in: query
        description: Filter by document holder ID (Customer or BeneficialOwner)
        required: false
        schema:
          type: string
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination (returned from previous request)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocumentListResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /documents/{documentId}:
    get:
      summary: Get a document by ID
      description: Retrieve details and metadata of a specific document by ID.
      operationId: getDocument
      tags:
      - Documents
      security:
      - BasicAuth: []
      parameters:
      - name: documentId
        in: path
        description: Document ID
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    put:
      summary: Replace a document
      description: 'Replace an existing document with a new file and/or updated metadata.

        The request must use multipart/form-data.


        Use this when a stored document was rejected during review, which arrives

        as an entry in the verification''s `errors` array rather than as an error

        on upload. Replacing marks the previously submitted file inactive, which

        a second `POST /documents` would not do: that leaves the rejected file

        active alongside the new one, and the rejection can carry. Call

        `POST /verifications` afterwards to start a new review, since existing

        errors persist until a new review produces a new verdict.


        A file rejected on upload with `422 DOCUMENT_REJECTED` never creates a

        document, so there is nothing to replace. Retry those with

        `POST /documents`.


        The request follows the same per-type field rules as

        `POST /documents`, except that `documentHolder` isn''t sent. Grid

        overwrites every metadata field with the values in this request, so

        resend `documentNumber`, `issuingAuthority`, and `side` even if they

        haven''t changed.


        Supported file types: `application/pdf`, `image/jpeg`, and `image/png`.

        Grid matches on the `Content-Type` of the multipart part, not the file

        extension. Any other type, and any file over 10 MB, returns

        `400 INVALID_INPUT`.


        Grid forwards the file to its verification provider, which screens it as

        the request is handled and can reject it with `422 DOCUMENT_REJECTED`.

        To pass that screen, a photo or scan of a document must:


        - show the whole document, with all four corners inside the frame and

        nothing overlapping an edge

        - be in focus and free of glare, so every field and the machine-readable

        zone can be read

        - be in color, not a black-and-white copy

        - be a photo or scan of the physical document, not a screen capture, and

        not retouched in an image editor

        - be unexpired'
      operationId: replaceDocument
      tags:
      - Documents
      security:
      - BasicAuth: []
      parameters:
      - name: documentId
        in: path
        description: Document ID
        required: true
        schema:
          type: string
      requestBody:
        $ref: '#/components/requestBodies/DocumentReplaceRequestBody'
      responses:
        '200':
          description: Document replaced successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'
        '400':
          description: Bad request - Invalid file type, size, or parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '422':
          description: The verification provider rejected the file. `precheckErrors` names each problem it found. The stored document keeps its previous file and metadata, so retry with a corrected file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error422'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    delete:
      summary: Delete a document
      description: Delete an uploaded document. This cannot be undone. Documents that have already been submitted for verification may not be deletable.
      operationId: deleteDocument
      tags:
      - Documents
      security:
      - BasicAuth: []
      parameters:
      - name: documentId
        in: path
        description: Document ID
        required: true
        schema:
          type: string
      responses:
        '204':
          description: Document deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict - Document cannot be deleted (already submitted for verification)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  requestBodies:
    DocumentReplaceRequestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/DocumentReplaceRequest'
    DocumentUploadRequestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            $ref: '#/components/schemas/DocumentUploadRequest'
  schemas:
    PaymentDocumentRequirementId:
      type: string
      description: 'A stable identifier for one required document within a purpose''s requirements. The same ID means the same requirement across quotes. It is separate from `PaymentDocumentType`. The requirement ID names the document to supply, and the document type names what a file is. The two differ where a requirement accepts alternatives. For example, a file declared as either `PURCHASE_ORDER` or `DELIVERY_SLIP` fills the `SUPPORTING_PROOF` requirement.


        [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents) lists the IDs each purpose requires.


        Treat the ID as an opaque value, not a member of a fixed list. Grid may add new IDs as requirements change.'
      example: SUPPORTING_PROOF
    FieldError:
      type: object
      required:
      - field
      description: One field-level validation failure. Field-validation errors on submit endpoints (e.g. `POST /customers`, `PATCH /customers/{id}`) emit an array of these under `details.errors` so platforms can render form-field-level UX for every failure in a single round-trip.
      properties:
        field:
          type: string
          description: Dot-notation path to the offending field.
          example: identifier
        constraint:
          $ref: '#/components/schemas/FieldConstraint'
        message:
          type: string
          description: Human-readable explanation of what's wrong with this field.
          example: Value is not one of the allowed enum members.
    DocumentSide:
      type: string
      enum:
      - FRONT
      - BACK
      description: Which side of a two-sided document, such as a driver's license or national ID, an image shows.
      example: FRONT
    DocumentType:
      type: string
      enum:
      - PASSPORT
      - DRIVERS_LICENSE
      - NATIONAL_ID
      - PROOF_OF_ADDRESS
      - BANK_STATEMENT
      - TAX_RETURN
      - CERTIFICATE_OF_INCORPORATION
      - ARTICLES_OF_INCORPORATION
      - ARTICLES_OF_ASSOCIATION
      - STATE_REGISTRY_EXCERPT
      - GOOD_STANDING_CERTIFICATE
      - INFORMATION_STATEMENT
      - INCUMBENCY_CERTIFICATE
      - BUSINESS_LICENSE
      - SHAREHOLDER_REGISTER
      - POWER_OF_ATTORNEY
      - UTILITY_BILL
      - ELECTRICITY_BILL
      - RENT_OR_LEASE_AGREEMENT
      - DIRECTOR_REGISTRY
      - TRUST_AGREEMENT
      - STATE_COMPANY_REGISTRY
      - PARTNERSHIP_CONTROL_AGREEMENT
      - PARTNERSHIP_AGREEMENT
      - SELFIE
      - OTHER
      description: 'Type of identity or business verification document. Document types are grouped by verification category:

        **Identity** — PASSPORT, DRIVERS_LICENSE, NATIONAL_ID

        **Business — Legal presence** — CERTIFICATE_OF_INCORPORATION, ARTICLES_OF_INCORPORATION, ARTICLES_OF_ASSOCIATION, STATE_REGISTRY_EXCERPT

        **Business — Control structure** — DIRECTOR_REGISTRY, TRUST_AGREEMENT, STATE_COMPANY_REGISTRY, PARTNERSHIP_CONTROL_AGREEMENT

        **Business — Ownership structure** — SHAREHOLDER_REGISTER, TRUST_AGREEMENT, PARTNERSHIP_AGREEMENT

        **Proof of address** — UTILITY_BILL, RENT_OR_LEASE_AGREEMENT, ELECTRICITY_BILL, BANK_STATEMENT, TAX_RETURN'
      example: PASSPORT
    BaseDocumentRequest:
      type: object
      required:
      - file
      - documentType
      - country
      properties:
        file:
          type: string
          format: binary
          description: 'The document file. Grid accepts three formats, matched on the

            `Content-Type` of the multipart part rather than the file extension:

            `application/pdf`, `image/jpeg`, and `image/png`. Any other type,

            including `image/heic`, `image/webp`, and `image/tiff`, returns

            `400 INVALID_INPUT`. The file must be 10 MB or smaller.

            '
        documentType:
          $ref: '#/components/schemas/DocumentType'
        side:
          $ref: '#/components/schemas/DocumentSide'
          description: 'Which side of the document this image shows. Required when

            `documentType` is `DRIVERS_LICENSE` or `NATIONAL_ID`: upload the

            `FRONT` and `BACK` as two separate documents. A `PASSPORT`, or a

            `DRIVERS_LICENSE` issued in Brazil (`country` is `BR`), is a single

            image: sending `side` for either returns `400 INVALID_INPUT`. Optional

            for all other document types.

            '
        country:
          type: string
          description: Country that issued the document (ISO 3166-1 alpha-2)
          example: US
        documentNumber:
          type: string
          maxLength: 100
          description: 'Identification number printed on the document, such as a passport

            number. Required when `documentType` is `PASSPORT`,

            `DRIVERS_LICENSE`, or `NATIONAL_ID`.

            '
          example: A12345678
        issuingAuthority:
          type: string
          maxLength: 255
          description: 'Name of the government agency or organization that issued the

            document. Required when `documentType` is `PASSPORT`,

            `DRIVERS_LICENSE`, or `NATIONAL_ID`.

            '
          example: U.S. Department of State
    Error500:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | GRID_SWITCH_ERROR | Grid switch error |

            | INTERNAL_ERROR | Internal server or UMA error |

            '
          enum:
          - GRID_SWITCH_ERROR
          - INTERNAL_ERROR
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    DocumentReplaceRequest:
      title: Document Replace Request
      allOf:
      - $ref: '#/components/schemas/BaseDocumentRequest'
    Error409:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | TRANSACTION_NOT_PENDING_PLATFORM_APPROVAL | Transaction is not pending platform approval |

            | TRANSACTION_NOT_CANCELLABLE | Transaction has already settled or is otherwise past the point where it can be cancelled |

            | UMA_ADDRESS_EXISTS | UMA address already exists |

            | EMAIL_OTP_EMAIL_ALREADY_EXISTS | Email address is already associated with an EMAIL_OTP credential |

            | EMAIL_OTP_CREDENTIAL_SET_CHANGED | Tied EMAIL_OTP credential set changed after the signed-retry challenge was issued |

            | PASSKEY_ALREADY_ENROLLED | The customer already has an enrolled passkey factor; only one passkey per customer is supported. Delete the existing one before enrolling another |

            | SCA_SESSION_REQUIRED | The customer''s Strong Customer Authentication login session is missing or expired. Re-authenticate the customer, then retry the request. Distinct from a `401`, which means the platform''s own API credentials were rejected |

            | BENEFICIARY_TRUSTED | The external account is currently a trusted beneficiary, so it cannot be deleted. Untrust it first via `POST /customers/external-accounts/{externalAccountId}/untrust` (and its `/confirm`), then delete |

            | BANK_ACCOUNT_VALIDATION_PENDING | The US bank account on this request is still being validated. Grid verifies a newly added ACH account by sending a micro-entry and waiting out the return window, which takes a few banking days. The account is not rejected; retry once validation completes. A permanently failed account returns `400 INVALID_BANK_ACCOUNT` instead |

            | INVALID_STATE_TRANSITION | The requested card `status` transition is not one of `ACTIVE ⇄ FROZEN` or `ACTIVE \| FROZEN → CLOSED`, or the card cannot be unfrozen by the platform because Grid froze it for review, it was frozen as `COMPROMISED`, or its customer is not `ACTIVE` |

            | CARD_ALREADY_CLOSED | `status: CLOSED` was requested for a card that is already `CLOSED` |

            | CARD_NOT_MUTABLE | The card is `CLOSED`, so it can no longer be mutated |

            | PIN_CHANGE_REQUIRED | The card''s PIN unblock allowance is consumed for seven days. Change the PIN to recover sooner. `details.pinUnblockAvailableAt` gives the next allowed unblock time |

            | CARD_LIMIT_REACHED | The platform has reached the maximum number of live cards it may hold, or the cardholder already holds a card and the platform is limited to one per cardholder. Closing a card frees its slot; contact Lightspark to raise the limit |

            | STABLECOIN_GRID_ENABLEMENT_NOT_REQUESTABLE | Grid enablement can only be requested while the stablecoin is `NOT_ENABLED` (a repeat request while already `PENDING_APPROVAL` succeeds). `ENABLING`, `ENABLED` and `DISABLED` are driven by Lightspark and cannot be requested |

            | NOT_YET_AVAILABLE | The request is valid, but its result is not available yet because the data it depends on could still change. Retry later. `reason` says what is outstanding. For balance changes, card settlement for a window boundary has not closed |

            | CONFLICT | Generic resource-state conflict. Returned, for example, when `platformCustomerId` on a customer create call collides with an existing active customer on the same platform |

            | DOCUMENT_ALREADY_EXISTS | A document of this type already exists for the holder; replace it with PUT |

            | DUPLICATE_EXTERNAL_ACCOUNT | An equivalent external account already exists. When the conflicting account belongs to your platform, `details.externalAccountId` and `details.platformAccountId` identify it; otherwise `details` is omitted |

            | DUPLICATE_PAY_REQUEST | A pay request with this idempotency key already exists |

            | OPERATION_IN_PROGRESS | A conflicting Embedded Wallet operation is still in progress |

            | SMS_OTP_CREDENTIAL_SET_CHANGED | The SMS_OTP credential set changed while the request was in flight |

            | SMS_OTP_PHONE_NUMBER_ALREADY_EXISTS | The phone number is already associated with an SMS_OTP credential |

            | STABLECOIN_SYMBOL_ALREADY_EXISTS | A stablecoin with this symbol is already registered |

            | STABLECOIN_TOKEN_IDENTIFIER_ALREADY_EXISTS | A stablecoin with this token identifier is already registered |

            | WALLET_NOT_PROVISIONED | The embedded wallet has not been provisioned |

            | PAYMENT_DOCUMENT_ALREADY_USED | The payment document is already attached to a quote. A document can be used on one quote only, so upload the file again to use it on another quote |

            '
          enum:
          - TRANSACTION_NOT_PENDING_PLATFORM_APPROVAL
          - TRANSACTION_NOT_CANCELLABLE
          - UMA_ADDRESS_EXISTS
          - EMAIL_OTP_EMAIL_ALREADY_EXISTS
          - EMAIL_OTP_CREDENTIAL_SET_CHANGED
          - PASSKEY_ALREADY_ENROLLED
          - SCA_SESSION_REQUIRED
          - BENEFICIARY_TRUSTED
          - BANK_ACCOUNT_VALIDATION_PENDING
          - INVALID_STATE_TRANSITION
          - CARD_ALREADY_CLOSED
          - CARD_NOT_MUTABLE
          - PIN_CHANGE_REQUIRED
          - CARD_LIMIT_REACHED
          - STABLECOIN_GRID_ENABLEMENT_NOT_REQUESTABLE
          - NOT_YET_AVAILABLE
          - CONFLICT
          - DOCUMENT_ALREADY_EXISTS
          - DUPLICATE_EXTERNAL_ACCOUNT
          - DUPLICATE_PAY_REQUEST
          - OPERATION_IN_PROGRESS
          - SMS_OTP_CREDENTIAL_SET_CHANGED
          - SMS_OTP_PHONE_NUMBER_ALREADY_EXISTS
          - STABLECOIN_SYMBOL_ALREADY_EXISTS
          - STABLECOIN_TOKEN_IDENTIFIER_ALREADY_EXISTS
          - WALLET_NOT_PROVISIONED
          - PAYMENT_DOCUMENT_ALREADY_USED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    Error422:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | DOCUMENT_REJECTED | The verification provider screened the uploaded file and marked it unusable. `precheckErrors` names each problem it found |

            '
          enum:
          - DOCUMENT_REJECTED
        reason:
          type: string
          description: Error message
        precheckErrors:
          type: array
          description: One entry per problem the verification provider found in the uploaded file, passed through verbatim. Common values are `dataNotReadable` (the data on the document cannot be read), `screenshot` (the file is a screen capture rather than a photo or scan), `grayscale` (a black-and-white copy of a color document), and `documentExpired`.
          items:
            type: string
          example:
          - dataNotReadable
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    Error404:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | TRANSACTION_NOT_FOUND | Transaction not found |

            | INVITATION_NOT_FOUND | Invitation not found |

            | USER_NOT_FOUND | Customer not found |

            | QUOTE_NOT_FOUND | Quote not found |

            | LOOKUP_REQUEST_NOT_FOUND | Lookup request not found |

            | TOKEN_NOT_FOUND | Token not found |

            | BULK_UPLOAD_JOB_NOT_FOUND | Bulk upload job not found |

            | REFERENCE_NOT_FOUND | Reference not found |

            | UMA_NOT_FOUND | The UMA address is well-formed but no receiver exists at the counterparty VASP |

            | STABLECOIN_PROVIDER_ACCOUNT_NOT_FOUND | Stablecoin provider account link not found |

            | ACCOUNT_NOT_FOUND | Account not found |

            | AUTH_METHOD_NOT_FOUND | Authentication credential not found |

            | CUSTOMER_NOT_FOUND | Customer not found |

            | DOCUMENT_HOLDER_NOT_FOUND | Document holder not found |

            | NOT_FOUND | The requested resource was not found |

            | PAYMENT_URL_NOT_FOUND | Payment URL not found |

            | PLATFORM_NOT_FOUND | Platform not found |

            | REQUEST_NOT_FOUND | Pending request not found |

            | SESSION_NOT_FOUND | Session not found |

            | STABLECOIN_EXTERNAL_ACCOUNT_NOT_FOUND | Stablecoin external account not found |

            | STABLECOIN_NOT_FOUND | Stablecoin not found |

            | STABLECOIN_OPERATION_NOT_FOUND | Stablecoin operation not found |

            | VERIFICATION_NOT_FOUND | Verification not found |

            | PAYMENT_DOCUMENT_NOT_FOUND | Payment document not found |

            '
          enum:
          - TRANSACTION_NOT_FOUND
          - INVITATION_NOT_FOUND
          - USER_NOT_FOUND
          - QUOTE_NOT_FOUND
          - LOOKUP_REQUEST_NOT_FOUND
          - TOKEN_NOT_FOUND
          - BULK_UPLOAD_JOB_NOT_FOUND
          - REFERENCE_NOT_FOUND
          - UMA_NOT_FOUND
          - STABLECOIN_PROVIDER_ACCOUNT_NOT_FOUND
          - ACCOUNT_NOT_FOUND
          - AUTH_METHOD_NOT_FOUND
          - CUSTOMER_NOT_FOUND
          - DOCUMENT_HOLDER_NOT_FOUND
          - NOT_FOUND
          - PAYMENT_URL_NOT_FOUND
          - PLATFORM_NOT_FOUND
          - REQUEST_NOT_FOUND
          - SESSION_NOT_FOUND
          - STABLECOIN_EXTERNAL_ACCOUNT_NOT_FOUND
          - STABLECOIN_NOT_FOUND
          - STABLECOIN_OPERATION_NOT_FOUND
          - VERIFICATION_NOT_FOUND
          - PAYMENT_DOCUMENT_NOT_FOUND
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    Document:
      type: object
      required:
      - id
      - documentHolder
      - documentType
      - country
      - fileName
      - createdAt
      properties:
        id:
          type: string
          description: Unique identifier for this document
          example: Document:019542f5-b3e7-1d02-0000-000000000001
        documentHolder:
          type: string
          description: ID of the entity that owns this document. Can be a Customer ID or a BeneficialOwner ID.
          example: BeneficialOwner:019542f5-b3e7-1d02-0000-000000000001
        documentType:
          $ref: '#/components/schemas/DocumentType'
        side:
          $ref: '#/components/schemas/DocumentSide'
          description: Which side of the document this upload represents. Relevant for two-sided documents like driver's licenses or national IDs.
        country:
          type: string
          description: Country that issued the document (ISO 3166-1 alpha-2)
          example: US
        documentNumber:

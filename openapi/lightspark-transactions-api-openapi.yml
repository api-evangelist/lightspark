      - network
      properties:
        transactionHash:
          type: string
          description: On-chain transaction hash of the crypto transfer for this leg of the transaction.
          example: h82pJGF9p7kpzb6eU326EFZf2cDnimbTFVeJtx1qtBmUNJAEqN76R7PwPfHt3oWb8R6cKvhgyxQdDn53jFrK6wFx

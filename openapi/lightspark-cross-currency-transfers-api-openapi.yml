openapi: 3.2.0
info:
  title: Grid Cross-Currency Transfers API
  description: API for managing global payments on the open Money Grid. Built by Lightspark. See the full documentation at https://docs.lightspark.com/.
  version: '2025-10-13'
  contact:
    name: Lightspark Support
    email: support@lightspark.com
  license:
    name: Proprietary
    url: https://lightspark.com/terms
servers:
- url: https://api.lightspark.com/grid/2025-10-13
  description: Production server
security:
- BasicAuth: []
- AgentAuth: []
tags:
- name: Cross-Currency Transfers
  description: Endpoints for creating and confirming quotes for transfers, both same-currency and cross-currency
paths:
  /receiver/uma/{receiverUmaAddress}:
    get:
      summary: Look up an UMA address for payment
      description: 'Lookup a receiving UMA address to determine supported currencies and exchange rates.

        This endpoint helps platforms determine what currencies they can send to a given UMA address.'
      operationId: lookupUma
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      parameters:
      - name: receiverUmaAddress
        in: path
        description: UMA address of the intended recipient
        required: true
        schema:
          type: string
      - name: senderUmaAddress
        in: query
        description: UMA address of the sender (optional if customerId is provided)
        required: false
        schema:
          type: string
      - name: customerId
        in: query
        description: System ID of the sender (optional if senderUmaAddress is provided)
        required: false
        schema:
          type: string
      - name: sendingCurrency
        in: query
        description: 'Currency code the sender will send from (e.g., USD). Selects which of the sender''s configured currencies the response is priced against: it is echoed back as the response''s `sendingCurrency`, and the `minSendingAmount`/`maxSendingAmount` bounds are denominated in its smallest unit. Defaults to the sender''s default currency.'
        required: false
        schema:
          type: string
        example: USD
      responses:
        '200':
          description: Successful lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverUmaLookupResponse'
        '400':
          description: Bad request - Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden. `USER_NOT_READY` when the recipient cannot receive payments yet. `COUNTERPARTY_NOT_ALLOWED` when the recipient's institution is not an allowed counterparty. `FORBIDDEN` when the token lacks the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: UMA address not found. The address is well-formed but no receiver exists at the counterparty VASP (`UMA_NOT_FOUND`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '412':
          description: Counterparty doesn't support UMA version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error412'
        '424':
          description: Counterparty issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error424'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: Counterparty returned an error or an invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: Counterparty could not be reached or timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
  /receiver/external-account/{accountId}:
    get:
      summary: Look up an external account for payment
      description: 'Lookup an external account by ID to determine supported currencies and exchange rates.

        This endpoint helps platforms determine what currencies they can send to a given external account, along with the current estimated exchange rates and minimum and maximum amounts that can be sent.'
      operationId: lookupExternalAccount
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      parameters:
      - name: accountId
        in: path
        description: System-generated ID of the external account
        required: true
        schema:
          type: string
          example: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
      - name: senderUmaAddress
        in: query
        description: UMA address of the sender (optional if customerId is provided)
        required: false
        schema:
          type: string
      - name: customerId
        in: query
        description: System ID of the sender (optional if senderUmaAddress is provided)
        required: false
        schema:
          type: string
      - name: sendingCurrency
        in: query
        description: 'Currency code the sender will send from (e.g., USD). Selects which of the sender''s configured currencies the response is priced against: it is echoed back as the response''s `sendingCurrency`, and the `minSendingAmount`/`maxSendingAmount` bounds are denominated in its smallest unit. Defaults to the sender''s default currency.'
        required: false
        schema:
          type: string
        example: USD
      responses:
        '200':
          description: Successful lookup
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiverExternalAccountLookupResponse'
        '400':
          description: Bad request - Missing or invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden. `USER_NOT_READY` when the recipient cannot receive payments yet. `COUNTERPARTY_NOT_ALLOWED` when the recipient's institution is not an allowed counterparty. `FORBIDDEN` when the token lacks the required permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: External account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '412':
          description: Counterparty doesn't support UMA version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error412'
        '424':
          description: Counterparty issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error424'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '502':
          description: Counterparty returned an error or an invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: Counterparty could not be reached or timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
  /payment-documents:
    post:
      summary: Upload a payment document
      description: 'Upload a supporting document for a payout that requires one. Supporting

        Documents

        lists which payouts need documents, the documents each

        `purposeOfPayment` needs, and what the payout partner checks in them.

        Upload each file here,

        then pass the returned `id` values in `documentIds` on `POST /quotes`.

        Grid attaches the files to the payment before it returns the quote.


        The request must use multipart/form-data with the file in the `file`

        field and metadata in the remaining fields. Each request uploads one file.

        To upload several files, send one request per file. You can send them in

        parallel. A quote accepts up to 3 documents.


        Supported formats are PDF, JPEG, and PNG. Grid detects the format from the

        file contents, not the file name. The file must be from 1 to 8,000,000

        bytes. An empty file, a larger file, and any other format return

        `400 INVALID_INPUT`.


        A payment document:


        - can be used until its `expiresAt`, 24 hours after upload

        - can be used on one quote only, and only on a quote for the customer in

        `customerId`, or on the platform''s own quote when `customerId` is

        omitted

        - has its file deleted by Grid once it is attached to the payment


        Grid does not check what a document says. The payout partner reviews each

        document after Grid attaches it, and may reject or delay the payout. A

        successful attachment means the payout partner received the file, not

        that it approved it.'
      operationId: uploadPaymentDocument
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      requestBody:
        $ref: '#/components/requestBodies/PaymentDocumentUploadRequestBody'
      responses:
        '201':
          description: Payment document uploaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDocument'
              example:
                id: PaymentDocument:019542f5-b3e7-1d02-0000-000000000001
                customerId: Customer:019542f5-b3e7-1d02-0000-000000000001
                documentType: INVOICE
                fileName: invoice-2025-0142.pdf
                sizeBytes: 482133
                contentType: application/pdf
                status: UPLOADED
                expiresAt: '2025-10-04T12:00:00Z'
                createdAt: '2025-10-03T12:00:00Z'
        '400':
          description: Bad request. Returned with `INVALID_INPUT` when the file is empty, larger than 8,000,000 bytes, or not a PDF, JPEG, or PNG, when `documentType` is not a valid value, or when a required field is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Customer not found. Returned with `CUSTOMER_NOT_FOUND` when `customerId` does not match a customer on your platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /payment-documents/{paymentDocumentId}:
    get:
      summary: Get a payment document
      description: Retrieve a payment document by ID. Use it to check whether the document can still be used on a quote, or which quote it is attached to.
      operationId: getPaymentDocument
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      parameters:
      - name: paymentDocumentId
        in: path
        description: Payment document ID
        required: true
        schema:
          type: string
          example: PaymentDocument:019542f5-b3e7-1d02-0000-000000000001
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentDocument'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Payment document not found. Returned with `PAYMENT_DOCUMENT_NOT_FOUND` when the ID does not match a payment document on your platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /quotes/{quoteId}:
    get:
      summary: Get quote by ID
      description: 'Retrieve a quote by its ID. If the quote has been settled, it will include

        the transaction ID. This allows clients to track the full lifecycle of a payment

        from quote creation to settlement.'
      operationId: getQuoteById
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      parameters:
      - name: quoteId
        in: path
        description: ID of the quote to retrieve
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Quote retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /quotes:
    post:
      summary: Create a transfer quote
      description: 'Generate a quote for a transfer between any combination of accounts

        and UMA addresses. This endpoint handles same-currency and cross-currency

        transfers alike, and provides the necessary instructions to execute the transfer.


        **Transfer Types Supported:**

        - **Account to Account**: Transfer between internal/external accounts, with or without currency exchange.

        - **Account to UMA**: Transfer from an internal account to an UMA address.

        - **UMA to Account or UMA to UMA**: This transfer type will only be funded by payment instructions, not from an internal account.


        **Key Features:**

        - **Flexible Amount Locking**: Always specify whether you want to lock the sending amount or receiving amount

        - **Currency Exchange**: Handles all cross-currency transfers with real-time exchange rates

        - **Payment Instructions**: For UMA or customer ID sources, provides banking details needed for execution


        **Same-currency transfers:** Use this endpoint for same-currency transfers too.

        Set `immediatelyExecute: true` to create and execute in a single request. The

        older `/transfer-in` and `/transfer-out` endpoints are deprecated.


        Requires a token with the `TRANSACT` permission; `VIEW` alone is not

        sufficient. A quote is the instrument a later execute draws on, and

        `immediatelyExecute` moves funds within this same request.'
      operationId: createQuote
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: 'A unique identifier for the request. If the same key is sent multiple times, the server will return the same response as the first request.

          Required when the request includes `documentIds`. A request that fails with `409 PAYMENT_DOCUMENT_ALREADY_USED`, `410 PAYMENT_DOCUMENT_EXPIRED`, or `424 PAYMENT_DOCUMENT_ATTACHMENT_FAILED` created no quote, so a retry with the same key runs the request again.

          '
        schema:
          type: string
          maxLength: 255
          example: <uuid>
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              sameCurrencyAccountToAccount:
                summary: Same-Currency Account to Account Transfer (immediate execution)
                value:
                  source:
                    sourceType: ACCOUNT
                    accountId: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                  destination:
                    destinationType: ACCOUNT
                    accountId: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                    paymentRail: ACH
                  lockedCurrencySide: SENDING
                  lockedCurrencyAmount: 12550
                  immediatelyExecute: true
                  remittanceInformation: INV-12345
                  statementDescriptor: PAYROLL
                  description: Same-currency payout, no exchange required.
              achPullToAccount:
                summary: ACH pull from an external account into an internal account (immediate execution)
                value:
                  source:
                    sourceType: ACCOUNT
                    accountId: ExternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                  destination:
                    destinationType: ACCOUNT
                    accountId: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                  lockedCurrencySide: SENDING
                  lockedCurrencyAmount: 50000
                  immediatelyExecute: true
                  statementDescriptor: ACMEFUND
                  description: Top up from linked bank account
              accountToAccount:
                summary: Account to Account Transfer
                value:
                  source:
                    sourceType: ACCOUNT
                    accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                  destination:
                    destinationType: ACCOUNT
                    accountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                  lockedCurrencySide: SENDING
                  lockedCurrencyAmount: 10000
                  description: Transfer between accounts, either internal or external.
              accountToUma:
                summary: Account to UMA Address Transfer
                value:
                  lookupId: LookupRequest:019542f5-b3e7-1d02-0000-000000000009
                  source:
                    sourceType: ACCOUNT
                    accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                  destination:
                    destinationType: UMA_ADDRESS
                    umaAddress: $receiver@uma.domain.com
                    currency: EUR
                  lockedCurrencySide: SENDING
                  lockedCurrencyAmount: 1000
                  description: 'Payment for invoice #1234'
              realTimeFundingToSparkWallet:
                summary: Real-time funding to Spark Wallet as an on-ramp flow. Immediate execution.
                value:
                  source:
                    sourceType: REALTIME_FUNDING
                    customerId: Customer:019542f5-b3e7-1d02-0000-000000000009
                    currency: USD
                  destination:
                    destinationType: ACCOUNT
                    accountId: ExternalAccount:b23dcbd6-dced-4ec4-b756-3c3a9ea3d456
                  lockedCurrencySide: RECEIVING
                  lockedCurrencyAmount: 10000
                  immediatelyExecute: true
                  description: Bitcoin reward payout!
              payoutWithSupportingDocuments:
                summary: Payout with supporting documents
                value:
                  lookupId: Lookup:019542f5-b3e7-1d02-0000-000000000009
                  source:
                    sourceType: ACCOUNT
                    accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                  destination:
                    destinationType: ACCOUNT
                    accountId: ExternalAccount:c34dcbd6-dced-4ec4-b756-3c3a9ea3d789
                  lockedCurrencySide: RECEIVING
                  lockedCurrencyAmount: 7250000
                  purposeOfPayment: ACCOUNTING_SERVICES
                  documentIds:
                  - PaymentDocument:019542f5-b3e7-1d02-0000-000000000001
                  - PaymentDocument:019542f5-b3e7-1d02-0000-000000000002
                  - PaymentDocument:019542f5-b3e7-1d02-0000-000000000003
                  description: Accounting services, invoice INV-2025-0142
      responses:
        '200':
          description: 'Transfer quote created successfully. The response includes exchange rates,

            fees, and transfer details. For transfers involving UMA addresses, payment

            instructions are also included for execution through banking systems.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
              example:
                id: Quote:019542f5-b3e7-1d02-0000-000000000006
                status: PENDING
                createdAt: '2025-10-03T12:00:00Z'
                expiresAt: '2025-10-03T12:05:00Z'
                source:
                  sourceType: ACCOUNT
                  accountId: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
                destination:
                  destinationType: ACCOUNT
                  accountId: ExternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                sendingCurrency:
                  code: USD
                  name: United States Dollar
                  symbol: $
                  decimals: 2
                receivingCurrency:
                  code: EUR
                  name: Euro
                  symbol: €
                  decimals: 2
                totalSendingAmount: 10000
                totalReceivingAmount: 9200
                exchangeRate: 0.92
                feesIncluded: 10
                platformFeesIncluded: 0
                transactionId: Transaction:019542f5-b3e7-1d02-0000-000000000005
        '202':
          description: 'Quote created and its execution started, but paused for Strong Customer Authentication. Returned only when `immediatelyExecute` is true and the customer''s provider requires SCA (e.g. EU): the quote has status `PENDING_AUTHORIZATION` and carries an `scaChallenge`. Authorize it via `POST /quotes/{quoteId}/authorize`, the same as a quote executed through `POST /quotes/{quoteId}/execute`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Bad request. Returned with `DOCUMENTS_REQUIRED` when the destination requires supporting documents for the `purposeOfPayment` and `documentIds` does not supply all of them. `details.missingRequirements` lists the requirement ID of each missing document. Returned with `INVALID_INPUT` for missing or invalid parameters. These include `documentIds` without an `Idempotency-Key` header, `documentIds` sent to a destination that does not require documents, a document whose `documentType` fills no remaining requirement for the `purposeOfPayment`, and a `purposeOfPayment` the destination does not accept.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden. `SANCTION_BLOCKED` when sanctions screening blocks the sender or the destination. `USER_NOT_READY` when the recipient cannot receive payments yet; this can clear later. `COUNTERPARTY_NOT_ALLOWED` when the counterparty is not allowed. `CUSTOMER_NOT_VERIFIED` when the customer's KYC is not approved. `END_USER_TERMS_NOT_ACCEPTED` when the customer has not accepted the End User Terms. `FORBIDDEN` when the token lacks the `TRANSACT` permission. `VELOCITY_LIMIT_EXCEEDED` when the recipient is over a velocity limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Not found. Returned with `PAYMENT_DOCUMENT_NOT_FOUND` when an ID in `documentIds` does not match a payment document of the sending customer on your platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '408':
          description: Request Timeout - the request body could not be read in time; retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error408'
        '409':
          description: 'Conflict. Returned with `BANK_ACCOUNT_VALIDATION_PENDING` when the US bank account on the request is still being validated. Grid verifies a newly added ACH account by sending a micro-entry and waiting out the return window, which takes a few banking days. The account is not rejected, so retry once validation completes. An account that failed validation outright returns `400` with `INVALID_BANK_ACCOUNT`.

            Returned with `PAYMENT_DOCUMENT_ALREADY_USED` when a document in `documentIds` is already attached to a quote. A document can be used on one quote only. Upload the file again and retry with the new ID. Grid created no quote, so you can reuse the same `Idempotency-Key`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '410':
          description: Gone. Returned with `PAYMENT_DOCUMENT_EXPIRED` when a document in `documentIds` passed its `expiresAt` before it was attached. Upload the file again and retry with the new ID. Grid created no quote, so you can reuse the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error410'
        '412':
          description: Counterparty doesn't support UMA version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error412'
        '424':
          description: Counterparty issue. Returned with `PAYMENT_DOCUMENT_ATTACHMENT_FAILED` when Grid could not attach a supporting document to the payment. Grid created no quote. Retry the same request with the same `Idempotency-Key`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error424'
        '429':
          description: Too many requests. Returned with `DAILY_VOLUME_LIMIT_EXCEEDED` when `immediatelyExecute` is set and the requested amount would exceed the configured daily volume limit for the trade corridor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '501':
          description: Not implemented
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error501'
        '502':
          description: Counterparty returned an error or an invalid response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error502'
        '504':
          description: Counterparty could not be reached or timed out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error504'
  /quotes/{quoteId}/execute:
    post:
      summary: Execute a quote
      description: 'Execute a quote by its ID. This endpoint initiates the transfer between

        the source and destination accounts.


        This endpoint can only be used for quotes with a `source` which is either an internal account,

        or has direct pull functionality (e.g. ACH pull with an external account).


        When the quote''s `source` is an internal account of type `EMBEDDED_WALLET`,

        the request must include a `Grid-Wallet-Signature` header. The header value

        is the full Grid wallet signature built over the `payloadToSign` value from

        the quote''s `paymentInstructions[].accountOrWalletInfo` entry with the

        session private key of a verified authentication credential on the source

        Embedded Wallet.


        Requires a token with the `TRANSACT` permission; `VIEW` alone is not

        sufficient to release a transfer. On an `EMBEDDED_WALLET` source this is in

        addition to the `Grid-Wallet-Signature` header: the signature proves the

        wallet holder authorized the payment, while `TRANSACT` is what authorizes

        your integration to release it.


        Once executed, the quote cannot be cancelled and the transfer will be processed.'
      operationId: executeQuote
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      parameters:
      - name: quoteId
        in: path
        required: true
        description: The unique identifier of the quote to execute
        schema:
          type: string
        example: Quote:019542f5-b3e7-1d02-0000-000000000001
      - name: Idempotency-Key
        in: header
        required: false
        description: 'A unique identifier for the request. If the same key is sent multiple times, the server will return the same response as the first request.

          '
        schema:
          type: string
          maxLength: 255
          example: <uuid>
      - name: Grid-Wallet-Signature
        in: header
        required: false
        description: Full Grid wallet signature over the `payloadToSign` returned in the quote's `paymentInstructions[].accountOrWalletInfo` entry, produced with the session private key of a verified authentication credential on the source Embedded Wallet. Required when the quote's source is an internal account of type `EMBEDDED_WALLET`; ignored for other source types.
        schema:
          type: string
        example: eyJwdWJsaWNLZXkiOiIwMmExYjIuLi4iLCJzY2hlbWUiOiJTSUdOQVRVUkVfU0NIRU1FX1RLX0FQSV9QMjU2Iiwic2lnbmF0dXJlIjoiMzA0NTAyMjEwMC4uLiJ9
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecuteQuoteRequest'
      responses:
        '200':
          description: 'Quote processed. The outcome depends on whether SCA applies to the customer (currently EU customers):


            - **No SCA required:** the transfer is initiated and the quote status advances (`PROCESSING` / `COMPLETED`).


            - **SCA required:** the transfer is **not** initiated yet. The quote is returned with status `PENDING_AUTHORIZATION` and an `scaChallenge`; release the transfer by authorizing the quote you already hold — `POST /quotes/{quoteId}/authorize` (re-calling `execute` returns 409). A pre-funded send is a single challenge, so one authorization releases it. The challenge (and its SMS code / passkey assertion) only comes into existence once this call initiates the transfer, so the proof is always supplied on the follow-up authorize, never inline on this call. If an SMS code lapses, re-send it via `POST /quotes/{quoteId}/authorize/resend`.

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Quote'
        '400':
          description: Bad request - Invalid quote ID or quote cannot be confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized. Also returned when the quote's source is an internal account of type `EMBEDDED_WALLET` and the provided `Grid-Wallet-Signature` header is missing, malformed, or does not match the quote's `payloadToSign`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden. The token lacks the `TRANSACT` permission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict - Quote already confirmed, expired, or in invalid state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '429':
          description: Too many requests. Returned with `DAILY_VOLUME_LIMIT_EXCEEDED` when executing the quote would exceed the configured daily volume limit for the trade corridor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error429'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /crypto/estimate-withdrawal-fee:
    post:
      summary: Estimate crypto withdrawal fee
      description: Estimate the network and application fees for a cryptocurrency withdrawal from a crypto internal account to an external blockchain address. Use this to show fee information to customers before they initiate a withdrawal.
      operationId: estimateCryptoWithdrawalFee
      tags:
      - Cross-Currency Transfers
      security:
      - BasicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstimateCryptoWithdrawalFeeRequest'
            examples:
              estimateUSDCWithdrawal:
                summary: Estimate fee for USDC withdrawal on Solana
                value:
                  internalAccountId: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                  currency: USDC
                  cryptoNetwork: SOLANA
                  amount: 1000000
                  destinationAddress: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
              estimateArbitrumWithdrawal:
                summary: Estimate fee for USDC withdrawal on Arbitrum
                value:
                  internalAccountId: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
                  currency: USDC
                  cryptoNetwork: ARBITRUM
                  amount: 1000000
                  destinationAddress: '0xAbCDEF1234567890aBCdEf1234567890ABcDef12'
      responses:
        '200':
          description: Fee estimation returned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstimateCryptoWithdrawalFeeResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Internal account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  schemas:
    PaymentSwiftAccountInfo:
      title: SWIFT Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/SwiftAccountInfo'
      - type: object
        required:
        - accountHolderName
        properties:
          accountHolderName:
            type: string
            description: The name of the account holder as it must appear on the wire. Remitting banks match this against the beneficiary name field, so payers should copy it exactly.
            example: Acme Exports Pte Ltd
            minLength: 1
            maxLength: 255
          bankAddress:
            type: string
            description: The address of the bank holding the account, when known.
            example: 12 Marina Boulevard, Singapore 018982
            minLength: 1
            maxLength: 1024
          reference:
            type: string
            description: Reference code to include with the payment when present. SWIFT payments are attributed by the destination account number/IBAN, so this account type typically requires no reference.
            example: UMA-Q12345-REF
    SwiftAccountInfoBase:
      type: object
      description: 'At least one of accountNumber or iban is always present: IBAN-only corridors (e.g. BR, GB) use iban, other corridors use accountNumber, and both appear when the bank exposes both identifiers for the same account.'
      required:
      - accountType
      - swiftCode
      - bankName
      - country
      properties:
        accountType:
          type: string
          enum:
          - SWIFT_ACCOUNT
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the bank account
          example: NG
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank
          example: DEUTDEFF
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
        bankName:
          type: string
          description: The name of the bank
          example: Deutsche Bank
          minLength: 1
          maxLength: 255
        accountNumber:
          type: string
          description: The bank account number. Required for most corridors. Use iban instead for IBAN-only corridors (e.g. BR, GB).
          example: '1234567890'
          minLength: 1
          maxLength: 34
        iban:
          type: string
          description: The IBAN of the bank account. Required for IBAN-only corridors (e.g. BR, GB). Use accountNumber for all other corridors.
          example: GB29NWBK60161331926819
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Za-z0-9]{11,30}$
      example:
        accountType: SWIFT_ACCOUNT
        country: NG
        swiftCode: DEUTDEFF
        bankName: Deutsche Bank
        accountNumber: '1234567890'
    CounterpartyFieldDefinition:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/CustomerInfoFieldName'
        mandatory:
          type: boolean
          description: Whether the field is mandatory
          example: true
      required:
      - name
      - mandatory
    PurposeOfPayment:
      type: string
      description: 'The purpose of the payment. This may be required when sending to certain geographies (e.g. India).


        Some destinations accept only certain purposes. A business payout to China must use one of the purposes listed in [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents), and each needs its own supporting documents.'
      enum:
      - GIFT
      - SELF
      - GOODS_OR_SERVICES
      - EDUCATION
      - HEALTH_OR_MEDICAL
      - REAL_ESTATE_PURCHASE
      - TAX_PAYMENT
      - LOAN_PAYMENT
      - UTILITY_BILL
      - DONATION
      - TRAVEL
      - FAMILY_SUPPORT
      - SALARY_PAYMENT
      - EXPORTED_GOODS_PREPAYMENT
      - EXPORTED_GOODS_POSTPAYMENT
      - SERVICE_CHARGES
      - OFFICE_EXPENSES
      - DELIVERY_FEES
      - HOTEL_ACCOMMODATION
      - COMMISSION_ON_GOODS
      - COMMISSION_ON_SERVICES
      - ACCOUNTING_SERVICES
      - EXHIBITION_SERVICES
      - OTHER
    BaseDestination:
      type: object
      required:
      - destinationType
      properties:
        destinationType:
          $ref: '#/components/schemas/DestinationType'
    AccountQuoteSource:
      title: Account
      allOf:
      - $ref: '#/components/schemas/BaseQuoteSource'
      - type: object
        required:
        - accountId
        - sourceType
        properties:
          sourceType:
            type: string
            enum:
            - ACCOUNT
          accountId:
            type: string
            description: Source account identifier
            example: InternalAccount:e85dcbd6-dced-4ec4-b756-3c3a9ea3d965
          customerId:
            type: string
            description: The customer on whose behalf the transaction is being initiated. Required when funding from a `BULK_SETTLEMENT` account. The customer is never the account owner, because the platform owns the account. When funding from an FBO account, this field is optional. If you omit it, the transaction is initiated on behalf of the platform. For any other account, it defaults to the account owner's customerId.
            example: Customer:019542f5-b3e7-1d02-0000-000000000001
        description: Source account details
    StatementDescriptor:
      type: string
      minLength: 1
      maxLength: 10
      pattern: ^[ -~]+$
      not:
        pattern: ^ *(0*|[Mm][Ii][Ss][Cc]|[Rr][Ee][Vv][Ee][Rr][Ss][Aa][Ll]|[Rr][Ee][Tt][Uu][Rr][Nn] [Ff][Ee][Ee]|[Aa][Uu][Tt][Oo][Ee][Nn][Rr][Oo][Ll][Ll]|[Nn][Oo][Nn][Ss][Ee][Tt][Tt][Ll][Ee][Dd]|[Rr][Ee][Cc][Ll][Aa][Ii][Mm]) *$
      description: 'Short text that labels this payment on the counterparty''s bank statement, such as `PAYROLL` or `INVOICE`. Used only when the quote moves money over ACH, for both an ACH credit to an external bank account and an ACH debit pulling from one, where it is sent as the NACHA Company Entry Description. Sending it on a quote that moves no ACH entry returns `400 INVALID_INPUT`. Free-text payment details belong in `remittanceInformation`, which ACH carries in the addenda record.

        Printable ASCII, up to 10 characters. Grid uses its default when omitted. Blank values, all zeros, `MISC`, and the values NACHA reserves for system entries (`REVERSAL`, `RETURN FEE`, `AUTOENROLL`, `NONSETTLED`, `RECLAIM`) are rejected with `400 INVALID_INPUT`, in any letter case and ignoring surrounding spaces.'
      example: PAYROLL
    Error429:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | RATE_LIMITED | Too many requests in a short window; retry after the interval indicated by the `Retry-After` response header |

            | DAILY_VOLUME_LIMIT_EXCEEDED | The requested amount would exceed the configured daily volume limit for this trade corridor or withdrawal currency |

            '
          enum:
          - RATE_LIMITED
          - DAILY_VOLUME_LIMIT_EXCEEDED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    StablecoinAssetType:
      type: string
      description: Type of asset
      enum:
      - USDC
      - USDT
    Error504:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | LOOKUP_REQUEST_FAILED | Network error or timeout reaching the counterparty during lookup. Retryable |

            | QUOTE_REQUEST_FAILED | Network error or timeout sending the quote request to the counterparty. Retryable |

            '
          enum:
          - LOOKUP_REQUEST_FAILED
          - QUOTE_REQUEST_FAILED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    PaymentBrlAccountInfo:
      title: BRL Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - qrCode
        properties:
          accountType:
            type: string
            enum:
            - BRL_ACCOUNT
          qrCode:
            type: string
            description: A PIX QR code payload that can be used to fund the transaction. This can be rendered as a QR code image or pasted into a PIX-compatible banking app.
            minLength: 1
    CurrencyPreference:
      type: object
      required:
      - currency
      - estimatedExchangeRate
      - min
      - max
      properties:
        currency:
          $ref: '#/components/schemas/Currency'
        estimatedExchangeRate:
          type: number
          description: An estimated exchange rate from the sender's currency to this currency. This is not a locked rate and is subject to change when calling the quotes endpoint.
          exclusiveMinimum: 0
          example: 1.08
        exchangeRate:
          type: number
          description: An estimated number of sending currency units per unit of this currency, in the same direction and units as `exchangeRate` on a quote. This is not a locked rate and is subject to change when calling the quotes endpoint.
          exclusiveMinimum: 0
          example: 0.925
        min:
          type: integer
          format: int64
          description: The minimum amount that can be received in this currency.
          exclusiveMinimum: 0
          example: 1
        max:
          type: integer
          format: int64
          description: The maximum amount that can be received in this currency.
          exclusiveMinimum: 0
          example: 1000000
        minSendingAmount:
          type: integer
          format: int64
          description: The minimum amount that can be sent for this currency, in the smallest unit of the sender's currency (e.g. cents for USD). Same semantics as `minSendingAmount` on the exchange rates endpoint. This is an estimate based on the current exchange rate and is subject to change when calling the quotes endpoint. Omitted when the sending-side bound cannot be resolved.
          minimum: 0
          example: 100
        maxSendingAmount:
          type: integer
          format: int64
          description: The maximum amount that can be sent for this currency, in the smallest unit of the sender's currency (e.g. cents for USD). Same semantics as `maxSendingAmount` on the exchange rates endpoint. This is an estimate based on the current exchange rate and is subject to change when calling the quotes endpoint. Omitted when the sending-side bound cannot be resolved.
          minimum: 0
          example: 500000
    ExecuteQuoteRequest:
      type: object
      description: Optional body for executing a quote. Only needed to request a specific Strong Customer Authentication factor (`scaFactor`) for the challenge this call issues; omit the body entirely otherwise.
      properties:
        scaFactor:
          $ref: '#/components/schemas/ScaFactor'
          description: Optional preferred factor for the Strong Customer Authentication challenge this call issues. Only relevant for customers in a region where SCA is required (e.g. EU); ignored otherwise. Valid values for a per-transaction challenge are `SMS_OTP` (default) and `PASSKEY` — `TOTP` cannot carry the required dynamic linking and is rejected here. Omit to default to `SMS_OTP`.
    Error501:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | UNRECOGNIZED_MANDATORY_PAYEE_DATA_KEY | Unrecognized mandatory payee data key |

            | NOT_IMPLEMENTED | Feature not implemented |

            | UNRECOGNIZED_MANDATORY_COUNTERPARTY_DATA_KEY | The counterparty requires a data key Grid does not recognise |

            '
          enum:
          - UNRECOGNIZED_MANDATORY_PAYEE_DATA_KEY
          - NOT_IMPLEMENTED
          - UNRECOGNIZED_MANDATORY_COUNTERPARTY_DATA_KEY
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    MxnAccountInfoBase:
      type: object
      required:
      - accountType
      - clabeNumber
      properties:
        accountType:
          type: string
          enum:
          - MXN_ACCOUNT
        clabeNumber:
          type: string
          description: The CLABE number of the bank
          example: '123456789012345678'
          minLength: 18
          maxLength: 18
          pattern: ^[0-9]{18}$
      example:
        accountType: MXN_ACCOUNT
        clabeNumber: '123456789012345678'
    CustomerInfoFieldName:
      type: string
      enum:
      - FULL_NAME
      - BIRTH_DATE
      - NATIONALITY
      - PHONE_NUMBER
      - EMAIL
      - POSTAL_ADDRESS
      - TAX_ID
      - REGISTRATION_NUMBER
      - USER_TYPE
      - COUNTRY_OF_RESIDENCE
      - ACCOUNT_IDENTIFIER
      - FI_LEGAL_ENTITY_NAME
      - FI_ADDRESS
      - PURPOSE_OF_PAYMENT
      - ULTIMATE_INSTITUTION_COUNTRY
      - IDENTIFIER
      - BUSINESS_TYPE
      - COMPANY_LEGAL_NAME
      - ID_TYPE
      - ID_NUMBER
      description: Name of a type of field containing info about a platform's customer or counterparty customer.
      example: FULL_NAME
    Error401:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | UNAUTHORIZED | Issue with API credentials |

            | INVALID_SIGNATURE | Signature header is invalid |

            | WALLET_SIGNATURE_MISSING | The `Grid-Wallet-Signature` header is required for this Embedded Wallet action but was not supplied |

            | WALLET_SIGNATURE_MALFORMED | The `Grid-Wallet-Signature` header could not be parsed (bad encoding, structure, or fields) |

            | WALLET_SIGNATURE_BODY_MISMATCH | The `Grid-Wallet-Signature` was computed over a different request body than the one received |

            | WALLET_SIGNATURE_INVALID | The `Grid-Wallet-Signature` failed cryptographic verification against the registered credential |

            | REQUEST_ID_MISSING | The `Request-Id` header is required on the signed retry but was not supplied (paired with `Grid-Wallet-Signature`) |

            '
          enum:
          - UNAUTHORIZED
          - INVALID_SIGNATURE
          - WALLET_SIGNATURE_MISSING
          - WALLET_SIGNATURE_MALFORMED
          - WALLET_SIGNATURE_BODY_MISMATCH
          - WALLET_SIGNATURE_INVALID
          - REQUEST_ID_MISSING
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    Error403:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | FORBIDDEN | Insufficient permissions |

            | USER_NOT_READY | Customer exists but is not ready for operation |

            | COUNTERPARTY_NOT_ALLOWED | Counterparty has not been enabled for your account |

            | VELOCITY_LIMIT_EXCEEDED | Counterparty has exceeded velocity limits |

            | END_USER_TERMS_NOT_ACCEPTED | Customer has not accepted the End User Terms |

            | CUSTOMER_NOT_VERIFIED | The customer is not verified and cannot perform this action |

            | SANCTION_BLOCKED | Blocked by sanction screening |

            | DESTINATION_NOT_ALLOWED | The agent may not pay this destination |

            '
          enum:
          - FORBIDDEN
          - USER_NOT_READY
          - COUNTERPARTY_NOT_ALLOWED
          - VELOCITY_LIMIT_EXCEEDED
          - END_USER_TERMS_NOT_ACCEPTED
          - CUSTOMER_NOT_VERIFIED
          - SANCTION_BLOCKED
          - DESTINATION_NOT_ALLOWED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    PaymentMxnAccountInfo:
      title: MXN Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/MxnAccountInfo'
      - type: object
        required:
        - reference
        properties:
          reference:
            type: string
            description: Unique reference code that must be included with the payment to properly credit it
            example: UMA-Q12345-REF
    UmaAddressDestination:
      title: UMA Address
      allOf:
      - $ref: '#/components/schemas/BaseDestination'
      - type: object
        required:
        - umaAddress
        - destinationType
        - currency
        properties:
          destinationType:
            type: string
            enum:
            - UMA_ADDRESS
          umaAddress:
            type: string
            maxLength: 200
            description: UMA address of the recipient
            example: $receiver@uma.domain.com
          currency:
            type: string
            description: Currency code for the destination. See [Supported Currencies](https://docs.lightspark.com/platform-overview/core-concepts/currencies-and-rails) for the full list of supported fiat and crypto currencies.
            example: EUR
        description: UMA address destination details
    PaymentArsAccountInfo:
      title: ARS Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - accountNumber
        properties:
          accountType:
            type: string
            enum:
            - ARS_ACCOUNT
          accountNumber:
            type: string
            description: The static CVU (Clave Virtual Uniforme) bank account number to pay to.
            minLength: 22
            maxLength: 22
            pattern: ^\d{22}$
            example: '0000003100074052501434'
    UsdAccountInfoBase:
      type: object
      required:
      - accountType
      - accountNumber
      - routingNumber
      properties:
        accountType:
          type: string
          enum:
          - USD_ACCOUNT
        accountNumber:
          type: string
          description: The account number of the bank
          minLength: 1
          maxLength: 34
        routingNumber:
          type: string
          description: The ABA routing number
          example: '021000021'
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{9}$
        bankName:
          type: string
          description: The name of the financial institution holding the account. Optional on every rail, and recommended for wires, where it identifies the beneficiary's institution on the payment message. Not checked against `GET /discoveries`.
          minLength: 1
          maxLength: 140
          example: Chase Bank
        intermediaryBankName:
          type: string
          description: The name of the intermediary financial institution, for accounts reachable only through a correspondent bank. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: JPMorgan Chase Bank
          minLength: 1
          maxLength: 140
        intermediaryRoutingNumber:
          type: string
          description: The ABA routing number of the intermediary financial institution. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: '021000021'
          minLength: 9
          maxLength: 9
          pattern: ^[0-9]{9}$
        fiToFiInformation:
          type: string
          description: Bank-to-bank instructions carried alongside the payment. Used on the WIRE rail; ignored on ACH, RTP and FEDNOW.
          example: /BNF/Invoice 4471
          maxLength: 210
      example:
        accountType: USD_ACCOUNT
        accountNumber: '1234567890'
        routingNumber: '021000021'
        bankName: Chase Bank
        intermediaryBankName: JPMorgan Chase Bank
        intermediaryRoutingNumber: '021000021'
        fiToFiInformation: /BNF/Invoice 4471
        bankAccountType: CHECKING
    UsdAccountInfo:
      allOf:
      - $ref: '#/components/schemas/UsdAccountInfoBase'
      - type: object
        required:
        - paymentRails
        properties:
          paymentRails:
            type: array
            items:
              type: string
              enum:
              - ACH
              - ACH_SAME_DAY
              - WIRE
              - RTP
              - FEDNOW
          bankAccountType:
            type: string
            description: Whether the account is a checking or a savings account. Grid uses this to set the ACH transaction code, so a value that does not match the account causes the receiving bank to return a notification of change.
            enum:
            - CHECKING
            - SAVINGS
            example: CHECKING
    QuoteDestinationOneOf:
      oneOf:
      - $ref: '#/components/schemas/AccountDestination'
      - $ref: '#/components/schemas/UmaAddressDestination'
      discriminator:
        propertyName: destinationType
        mapping:
          ACCOUNT: '#/components/schemas/AccountDestination'
          UMA_ADDRESS: '#/components/schemas/UmaAddressDestination'
    BaseWalletInfo:
      type: object
      required:
      - address
      - accountType
      properties:
        accountType:
          type: string
          enum:
          - BASE_WALLET
        address:
          type: string
          description: Base eth wallet address
          example: '0xAbCDEF1234567890aBCdEf1234567890ABcDef12'
    SparkWalletInfo:
      type: object
      required:
      - address
      - accountType
      properties:
        accountType:
          type: string
          enum:
          - SPARK_WALLET
        address:
          type: string
          description: Spark wallet address
          example: spark1pgssyuuuhnrrdjswal5c3s3rafw9w3y5dd4cjy3duxlf7hjzkp0rqx6dj6mrhu
    QuoteLockSide:
      type: string
      enum:
      - SENDING
      - RECEIVING
      description: The side of the quote which should be locked and specified in the `lockedCurrencyAmount`. For example, if I want to send exactly $5 MXN from my wallet, I would set this to "sending", and the `lockedCurrencyAmount` to 500 (in cents). If I want the receiver to receive exactly $10 USD, I would set this to "receiving" and the `lockedCurrencyAmount` to 10000 (in cents).
    PaymentDocumentType:
      type: string
      description: 'What a supporting document is. These are kinds of evidence, not file formats: `INVOICE` means the file is an invoice.


        [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents) lists the types each requirement accepts. When you upload a file with `POST /payment-documents`, `documentType` declares which type the file is.'
      enum:
      - PURCHASE_ORDER
      - LOGISTICS_BILL
      - CUSTOMS_DECLARATION
      - INVOICE
      - CONTRACT
      - DELIVERY_SLIP
      - BILL_OF_LADING
      - FLIGHT_TICKET
      - TRAVEL_DOCUMENT
      - HOTEL_BOOKING_CONFIRMATION
      example: INVOICE

        supportedCurrencies:
          type: array
          description: List of currencies supported by the receiving account
          items:
            $ref: '#/components/schemas/CurrencyPreference'
        requiredPayerDataFields:
          type: array
          description: Fields required by the receiving institution about the payer before payment can be completed
          items:
            $ref: '#/components/schemas/CounterpartyFieldDefinition'
        lookupId:
          type: string
          description: Unique identifier for the lookup. Needed in the subsequent create quote request.
          example: Lookup:019542f5-b3e7-1d02-0000-000000000009
    Error424:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | PAYREQ_REQUEST_FAILED | Payment request failed |

            | COUNTERPARTY_PUBKEY_FETCH_ERROR | Error fetching counterparty public key |

            | NO_COMPATIBLE_UMA_VERSION | No compatible UMA version |

            | LNURLP_REQUEST_FAILED | LNURLP request failed |

            | EMAIL_OTP_CREDENTIAL_SYNC_FAILED | Failed to update one or more tied EMAIL_OTP credentials |

            | SMS_OTP_CREDENTIAL_SYNC_FAILED | One or more tied SMS_OTP credentials could not be updated |

            | PAYMENT_DOCUMENT_ATTACHMENT_FAILED | Grid could not attach a supporting document to the payment, so it created no quote. Retry the same request with the same `Idempotency-Key` |

            '
          enum:
          - PAYREQ_REQUEST_FAILED
          - COUNTERPARTY_PUBKEY_FETCH_ERROR
          - NO_COMPATIBLE_UMA_VERSION
          - LNURLP_REQUEST_FAILED
          - EMAIL_OTP_CREDENTIAL_SYNC_FAILED
          - SMS_OTP_CREDENTIAL_SYNC_FAILED
          - PAYMENT_DOCUMENT_ATTACHMENT_FAILED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    EstimateCryptoWithdrawalFeeRequest:
      type: object
      required:
      - internalAccountId
      - currency
      - cryptoNetwork
      - amount
      - destinationAddress
      properties:
        internalAccountId:
          type: string
          description: The ID of the crypto internal account to withdraw from.
          example: InternalAccount:a12dcbd6-dced-4ec4-b756-3c3a9ea3d123
        currency:
          type: string
          description: The currency code of the asset to withdraw (e.g. USDC).
          example: USDC
        cryptoNetwork:
          type: string
          description: 'The blockchain network for the withdrawal. Example values: SOLANA, ETHEREUM, BASE, POLYGON, ARBITRUM, SPARK, LIGHTNING, BITCOIN.'
          example: SOLANA
        amount:
          type: integer
          description: The amount to withdraw in the smallest unit of the currency.
          example: 1000000
        destinationAddress:
          type: string
          description: The blockchain address to withdraw funds to.
          example: 7xKXtg2CW87d97TXJSDpbD5jBkheTqA83TZRuJosgAsU
    PaymentDocumentStatus:
      type: string
      description: 'Where the payment document is in its lifecycle.


        | Status | Terminal | Meaning |

        |--------|----------|---------|

        | `UPLOADED` | No | Ready to use. Pass the `id` in `documentIds` on `POST /quotes` before `expiresAt`. |

        | `ATTACHED` | Yes | Attached to the payment behind the quote in `quoteId`. Grid has deleted the file. |

        | `EXPIRED` | Yes | Not attached to a quote before `expiresAt`. The document can no longer be used. |

        '
      enum:
      - UPLOADED
      - ATTACHED
      - EXPIRED
      example: UPLOADED
    PaymentCopAccountInfo:
      title: COP Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - paymentUrl
        properties:
          accountType:
            type: string
            enum:
            - COP_ACCOUNT
          paymentUrl:
            type: string
            format: uri

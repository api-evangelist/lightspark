              type: string
              enum:
              - SWIFT
    BasePaymentAccountInfo:
      type: object
      required:
      - accountType
      properties:
        accountType:
          $ref: '#/components/schemas/PaymentAccountType'
    PaymentSparkWalletInfo:
      title: Spark Wallet
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/SparkWalletInfo'
      - type: object
        required:
        - assetType
        properties:
          assetType:
            type: string
            description: Type of asset or configured Spark token currency code
          invoice:
            type: string
            description: Invoice for the payment
            example: sparkrt1pgss8ter0fhc4c220f3zftmpz49h8wqte8eg3m5zkrraplgc048jucgszg3ssqgjzqqekv73mmh842yj7drsjwh7t7tz5zt8wf5kghm5v4ehggszppjp5s80cg3qjdzc55g2567tn3lj705hdsr577tg8ah795mlnt6807y657qhkmgfkf9w75p4wz3l8vhua85zdn6ryj32zuj0p00pv2l5z4u47mw6h4s
    CryptoNetwork:
      type: string
      enum:
      - BITCOIN
      - ETHEREUM
      - SOLANA
      - BASE
      - POLYGON
      - TRON
      - PLASMA
      - ARBITRUM
      - SPARK
      description: The blockchain network an on-chain transaction settled on. Whether this is the mainnet or a test network (e.g. Solana devnet) is determined by your platform's environment — sandbox platforms operate on test networks, production platforms on mainnet — mirroring how `cryptoNetwork` is interpreted elsewhere in the API.
      example: SOLANA
    PaymentPolygonWalletInfo:
      title: Polygon Wallet
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/PolygonWalletInfo'
      - type: object
        properties:
          assetType:
            type: string
            description: Type of asset
            enum:
            - USDC
    PlatformFeeOverride:
      type: object
      description: Overrides the platform-collected fee for this transaction. When present, it replaces any configured platform-collected fees that would otherwise apply to the transaction. Currently only supported when the quote's source currency is USD; the fixed fee must be denominated in the source currency.
      required:
      - platformFixedFee
      - platformVariableFeeBps
      properties:
        platformFixedFee:
          $ref: '#/components/schemas/FixedFee'
          description: Fixed fee charged for this transaction. Must be denominated in the quote's source currency (USD today).
        platformVariableFeeBps:
          type: integer
          minimum: 0
          maximum: 10000
          description: Variable fee in basis points (1 bps = 0.01%) to apply to the transaction's source-currency amount.
          example: 30
      example:
        platformFixedFee:
          amount: 50
          currency: USD
        platformVariableFeeBps: 30
    FieldError:
      type: object
      required:
      - field
      description: One field-level validation failure. Field-validation errors on submit endpoints (e.g. `POST /customers`, `PATCH /customers/{id}`) emit an array of these under `details.errors` so platforms can render form-field-level UX for every failure in a single round-trip.
      properties:
        field:
          type: string
          description: Dot-notation path to the offending field.
          example: identifier
        constraint:
          $ref: '#/components/schemas/FieldConstraint'
        message:
          type: string
          description: Human-readable explanation of what's wrong with this field.
          example: Value is not one of the allowed enum members.
    TransactionPendingReason:
      type: string
      enum:
      - COUNTERPARTY_DECLARATION_REQUIRED
      - WALLET_VERIFICATION_REQUIRED
      - COUNTERPARTY_INFORMATION_REQUIRED
      - COMPLIANCE_REVIEW
      description: 'Why a transaction is pending.


        | Reason | Description |

        |--------|-------------|

        | `COUNTERPARTY_DECLARATION_REQUIRED` | The customer must declare who controls the sending wallet. |

        | `WALLET_VERIFICATION_REQUIRED` | The customer must verify ownership of the sending wallet. |

        | `COUNTERPARTY_INFORMATION_REQUIRED` | Information about the sender is required. |

        | `COMPLIANCE_REVIEW` | The customer''s action is complete and the deposit remains under compliance review. |

        '
    SolanaWalletInfo:
      type: object
      required:
      - address
      - accountType
      properties:
        accountType:
          type: string
          enum:
          - SOLANA_WALLET
        address:
          type: string
          description: Solana wallet address
          example: 4Nd1m6Qkq7RfKuE5vQ9qP9Tn6H94Ueqb4xXHzsAbd8Wg
    SandboxFundRequest:
      type: object
      required:
      - amount
      properties:
        amount:
          type: integer
          format: int64
          description: Amount to add in the smallest unit of the account's currency (e.g., cents for USD/EUR, satoshis for BTC)
          exclusiveMinimum: 0
          maximum: 100000000000
          example: 100000
        remittanceInformation:
          type: string
          maxLength: 80
          pattern: ^[ -~]*$
          description: 'Simulates the free-form payment information a depositor''s bank sends with the funds. Depending on the payment rail, a real sender attaches it as the ACH Addenda record, the FedNow or RTP remittanceInformation field, or the wire OBI (Originator to Beneficiary Information). Only printable ASCII characters are allowed.

            It is reported on the resulting transaction: the incoming transaction for the credit, or the swept transaction for a `RULE_BASED` account. When it is set, the credit''s `source` is a `REALTIME_FUNDING` ACH deposit from a placeholder sandbox depositor.

            A production ACH deposit reports this text as `source.railDetails.addenda`. Sandbox credits do not include `railDetails` yet, so the value appears only in the deprecated `source.remittanceInformation`.'
          example: INV-2026-0042
        description:
          type: string
          maxLength: 1024
          description: 'Optional description/memo for the simulated credit, reported as the `description` of the incoming transaction. Defaults to a generated description when omitted.

            Not supported for `RULE_BASED` accounts: the swept transaction''s description comes from the account''s sweep rule, so sending it returns `400 INVALID_INPUT`.'
          example: Test deposit for invoice reconciliation
    WireRailDetails:
      title: Wire Transfer
      description: A domestic wire over Fedwire.
      allOf:
      - $ref: '#/components/schemas/BaseUsdBankRailDetails'
      - type: object
        required:
        - paymentRail
        - status
        properties:
          bankAccount:
            $ref: '#/components/schemas/WireBankAccountDetails'
          paymentRail:
            type: string
            enum:
            - WIRE
          status:
            $ref: '#/components/schemas/WireRailStatus'
          imad:
            type: string
            description: Fedwire Input Message Accountability Data assigned when the wire was sent.
            example: 20260929MMQFMP9C000123
          originatorToBeneficiaryInformation:
            type: string
            description: Free-form originator-to-beneficiary information (OBI) sent with the wire.
            example: INV-12345
    SandboxCardSimulationResponse:
      type: object
      required:
      - issuerTransactionToken
      description: Response body for the sandbox card-event simulators. The simulate call pokes the card issuer's sandbox; the resulting card operation is delivered asynchronously via the issuer's events webhook, never synchronously in this response.
      properties:
        issuerTransactionToken:
          type: string
          description: The card issuer's transaction token for the simulated event. Correlates the eventual webhook-delivered card operation back to this simulate call.
          example: f3a1c2d4-5b6e-7890-abcd-ef0123456789
    OnChainTransaction:
      type: object
      required:
      - transactionHash
      - network
      properties:
        transactionHash:
          type: string
          description: On-chain transaction hash of the crypto transfer for this leg of the transaction.
          example: h82pJGF9p7kpzb6eU326EFZf2cDnimbTFVeJtx1qtBmUNJAEqN76R7PwPfHt3oWb8R6cKvhgyxQdDn53jFrK6wFx
        network:
          $ref: '#/components/schemas/CryptoNetwork'
          description: Blockchain network the transaction settled on (mainnet vs test network is determined by your platform environment).
    TransactionDestinationType:
      type: string
      enum:
      - ACCOUNT
      - UMA_ADDRESS
      description: Type of transaction destination
      example: ACCOUNT
    RailDetailsOneOf:
      description: 'The rail transfer that moved funds for this side of the transaction. `paymentRail` determines the shape: each rail carries its own identifiers. Absent until a rail transfer exists for this side, and on sides whose funds move within Grid.'
      oneOf:
      - $ref: '#/components/schemas/OnChainRailDetails'
      - $ref: '#/components/schemas/AchRailDetails'
      - $ref: '#/components/schemas/WireRailDetails'
      - $ref: '#/components/schemas/FedNowRailDetails'
      - $ref: '#/components/schemas/RtpRailDetails'
      discriminator:
        propertyName: paymentRail
        mapping:
          ONCHAIN: '#/components/schemas/OnChainRailDetails'
          ACH: '#/components/schemas/AchRailDetails'
          ACH_SAME_DAY: '#/components/schemas/AchRailDetails'
          WIRE: '#/components/schemas/WireRailDetails'
          FEDNOW: '#/components/schemas/FedNowRailDetails'
          RTP: '#/components/schemas/RtpRailDetails'
    SandboxUmaReceiveRequest:
      type: object
      required:
      - senderUmaAddress
      - receivingCurrencyCode
      - receivingCurrencyAmount
      properties:
        senderUmaAddress:
          type: string
          description: UMA address of the sender from the sandbox
          example: $success.usd@sandbox.grid.uma.money
        receiverUmaAddress:
          type: string
          description: UMA address of the receiver (optional if customerId is provided)
          example: $receiver@uma.domain
        customerId:
          type: string
          description: System ID of the receiver (optional if receiverUmaAddress is provided)
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        receivingCurrencyCode:
          type: string
          description: The currency code for the receiving amount
          example: USD
        receivingCurrencyAmount:
          type: integer
          format: int64
          description: The amount to be received in the smallest unit of the currency (eg. cents)
          exclusiveMinimum: 0
          example: 1000
    CardCapabilities:
      type: object
      description: Actions supported by the card program associated with this resource.
      required:
      - supportsSpendLimits
      - supportsSpendLimitsAtIssuance
      - supportsTransactionCountLimit
      - supports3dSecurePassword
      - supportsPanReveal
      - supportsDigitalWalletTokenization
      properties:
        supportsSpendLimits:
          type: boolean
          description: Whether a card in this program can have `maxSpendPerTransaction` and `maxSpendPerDay` at all. On card programs where the card issuer makes authorization decisions, these limits can only be set after issuance through `PATCH /cards/{id}`. Check `supportsSpendLimitsAtIssuance` to determine whether you can supply them when issuing a card.
          example: true
        supportsSpendLimitsAtIssuance:
          type: boolean
          description: Whether `maxSpendPerTransaction` and `maxSpendPerDay` may be supplied on `POST /cards`. This is true for card programs where Grid makes the authorization decision and false for card programs where the card issuer makes authorization decisions.
          example: true
        supportsTransactionCountLimit:
          type: boolean
          description: Whether cards in this program accept `maxTransactionsPerDay`.
          example: true
        supports3dSecurePassword:
          type: boolean
          description: Whether cards in this program accept a caller-supplied `threeDSecurePassword`.
          example: false
        supportsPanReveal:
          type: boolean
          description: Whether cards in this program can be revealed through `POST /cards/{id}/reveal`.
          example: true
        supportsDigitalWalletTokenization:
          type: boolean
          description: Whether cards in this program can be added to Apple Pay, Google Pay, or Samsung Pay from your app through `POST /cards/{id}/tokenize`. Manual entry into a wallet works regardless of this flag.
          example: true
    BaseTransactionDestination:
      type: object
      required:
      - destinationType
      properties:
        destinationType:
          $ref: '#/components/schemas/TransactionDestinationType'
        currency:
          type: string
          description: Currency code for the destination
          example: EUR
    InternalAccountStatus:
      title: Internal Account Status
      type: string
      enum:
      - PENDING
      - ACTIVE
      - CLOSED
      - FROZEN
      - FAILED
      description: 'Status of a Grid internal account. The status determines whether the account can send or receive payments.


        - `PENDING`: The account is under review and is being provisioned. The account cannot send or receive payments until provisioning completes.

        - `ACTIVE`: The account is ready to send and receive payments.

        - `CLOSED`: The account cannot send or receive payments. A customer can initiate the closing of an internal account, after which the account transitions to this status.

        - `FROZEN`: The account cannot send or receive payments. Grid may freeze an account in response to compliance or fraud signals; payments are blocked while the account remains frozen.

        - `FAILED`: The account could not be provisioned. Grid was unable to create the underlying account, so it cannot send or receive payments and requires remediation.'
      example: ACTIVE
    PaymentCopAccountInfo:
      title: COP Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'

components:
  schemas:
    SandboxCardDisputeOpenRequest:
      type: object
      required:
      - cardTransactionId
      description: Sandbox-only request body for `POST /sandbox/cards/{id}/simulate/dispute_open`. Opens a dispute against a settled `CardTransaction`, as the card issuer does when a cardholder files a claim.
      properties:
        cardTransactionId:
          type: string
          description: The id of the settled `CardTransaction` to dispute. Must have at least one settled clearing and no dispute already open.
          example: Transaction:019542f5-b3e7-1d02-0000-000000000100
        amount:
          type: integer
          format: int64
          description: The disputed amount in the smallest unit of the transaction's currency. Defaults to the settled amount; must not exceed it.
          exclusiveMinimum: 0
          example: 1500
        reason:
          type: string
          description: Free-text reason recorded on the opening event.
          example: Merchandise not received
    WireRailStatus:
      type: string
      enum:
      - PENDING
      - SETTLED
      - FAILED
      description: 'Status of the wire on Fedwire.


        | Status | Description |

        |--------|-------------|

        | `PENDING` | Submitted to Fedwire and not yet delivered. |

        | `SETTLED` | Fedwire delivered the wire. |

        | `FAILED` | Fedwire or the receiving bank rejected the wire and no funds moved. |'
      example: SETTLED
    PaymentSwiftAccountInfo:
      title: SWIFT Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - $ref: '#/components/schemas/SwiftAccountInfo'
      - type: object
        required:
        - accountHolderName
        properties:
          accountHolderName:
            type: string
            description: The name of the account holder as it must appear on the wire. Remitting banks match this against the beneficiary name field, so payers should copy it exactly.
            example: Acme Exports Pte Ltd
            minLength: 1
            maxLength: 255
          bankAddress:
            type: string
            description: The address of the bank holding the account, when known.
            example: 12 Marina Boulevard, Singapore 018982
            minLength: 1
            maxLength: 1024
          reference:
            type: string
            description: Reference code to include with the payment when present. SWIFT payments are attributed by the destination account number/IBAN, so this account type typically requires no reference.
            example: UMA-Q12345-REF
    TestWebhookResponse:
      type: object
      required:
      - response_status
      properties:
        url:
          type: string
          format: uri
          description: URL where the webhook was sent
          example: https://api.mycompany.com/webhooks/uma
        response_status:
          type: integer
          description: The HTTP status code returned by the webhook endpoint
          example: 200
        response_body:
          type: string
          description: The raw body content returned by the webhook endpoint in response to the request
    SwiftAccountInfoBase:
      type: object
      description: 'At least one of accountNumber or iban is always present: IBAN-only corridors (e.g. BR, GB) use iban, other corridors use accountNumber, and both appear when the bank exposes both identifiers for the same account.'
      required:
      - accountType
      - swiftCode
      - bankName
      - country
      properties:
        accountType:
          type: string
          enum:
          - SWIFT_ACCOUNT
        country:
          type: string
          description: The ISO 3166-1 alpha-2 country code of the bank account
          example: NG
          minLength: 2
          maxLength: 2
          pattern: ^[A-Z]{2}$
        swiftCode:
          type: string
          description: The SWIFT/BIC code of the bank
          example: DEUTDEFF
          minLength: 8
          maxLength: 11
          pattern: ^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$
        bankName:
          type: string
          description: The name of the bank
          example: Deutsche Bank
          minLength: 1
          maxLength: 255
        accountNumber:
          type: string
          description: The bank account number. Required for most corridors. Use iban instead for IBAN-only corridors (e.g. BR, GB).
          example: '1234567890'
          minLength: 1
          maxLength: 34
        iban:
          type: string
          description: The IBAN of the bank account. Required for IBAN-only corridors (e.g. BR, GB). Use accountNumber for all other corridors.
          example: GB29NWBK60161331926819
          minLength: 15
          maxLength: 34
          pattern: ^[A-Z]{2}[0-9]{2}[A-Za-z0-9]{11,30}$
      example:
        accountType: SWIFT_ACCOUNT
        country: NG
        swiftCode: DEUTDEFF
        bankName: Deutsche Bank
        accountNumber: '1234567890'
    PurposeOfPayment:
      type: string
      description: 'The purpose of the payment. This may be required when sending to certain geographies (e.g. India).


        Some destinations accept only certain purposes. A business payout to China must use one of the purposes listed in [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents), and each needs its own supporting documents.'
      enum:
      - GIFT
      - SELF
      - GOODS_OR_SERVICES
      - EDUCATION
      - HEALTH_OR_MEDICAL
      - REAL_ESTATE_PURCHASE
      - TAX_PAYMENT
      - LOAN_PAYMENT
      - UTILITY_BILL
      - DONATION
      - TRAVEL
      - FAMILY_SUPPORT
      - SALARY_PAYMENT
      - EXPORTED_GOODS_PREPAYMENT
      - EXPORTED_GOODS_POSTPAYMENT
      - SERVICE_CHARGES
      - OFFICE_EXPENSES
      - DELIVERY_FEES
      - HOTEL_ACCOMMODATION
      - COMMISSION_ON_GOODS
      - COMMISSION_ON_SERVICES
      - ACCOUNTING_SERVICES
      - EXHIBITION_SERVICES
      - OTHER
    SweepRule:
      title: Sweep Rule
      type: object
      description: The routing rule attached to a rule-based account. Returned on the account rather than as a resource of its own, because the rule has no lifecycle apart from the account.
      required:
      - destination
      properties:
        destination:
          allOf:
          - $ref: '#/components/schemas/SweepRuleDestination'
          description: Where funds that settle into this account are swept.
        minimumAmount:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: '**In this rule-based account''s currency, not the destination''s.** The smallest balance the corridor to the destination can carry; a settled balance below it is not swept. Zero means no floor, which is the case for a same-currency internal destination — a book transfer with no rail, fee or conversion to justify one. Configuration rather than a moving estimate, so there is nothing to re-poll.'
        maximumAmount:
          allOf:
          - $ref: '#/components/schemas/CurrencyAmount'
          description: '**In this rule-based account''s currency, not the destination''s.** The largest balance the corridor to the destination can carry; a settled balance above it is not swept. Null means no ceiling.'
        purposeOfPayment:
          allOf:
          - $ref: '#/components/schemas/PurposeOfPayment'
          description: The purpose of payment applied to each sweep.
          example: SELF
        description:
          type: string
          description: Free-form description recorded on each sweep. Not delivered to the recipient.
          example: Rent sweep
        remittanceInformation:
          type: string
          description: Free-form information that travels with each sweep to the recipient.
          example: Unit 4B March
        platformFeeOverride:
          allOf:
          - $ref: '#/components/schemas/PlatformFeeOverride'
          description: Fee terms applied to every sweep this rule drives. Null when the platform's configured fees apply.
    UsdBankAccountDetails:
      title: US Bank Account Details
      type: object
      description: 'The account on the other end of the transfer: the sender''s account on a source, the recipient''s account on a destination.'
      properties:
        accountHolderName:
          type: string
          description: Name of the account holder.
          example: John Sender
        routingNumber:
          type: string
          description: 9-digit ABA routing number of the account's bank.
          example: '021000021'
        accountNumber:
          type: string
          description: Account number, masked to its last four digits.
          example: '****6789'
    SandboxCardBalanceInquiryRequest:

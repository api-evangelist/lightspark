      properties:
        cardTransactionId:
          type: string
          description: The id of the disputed `CardTransaction`; it must have an open dispute.
          example: Transaction:019542f5-b3e7-1d02-0000-000000000100
        amount:
          type: integer
          format: int64
          description: The amount to credit, or to take back, in the smallest unit of the transaction's currency. Must not exceed the disputed amount.
          exclusiveMinimum: 0
          example: 1500
    InternalAccount:
      type: object
      required:
      - id
      - type
      - status
      - balance
      - totalBalance
      - fundingPaymentInstructions
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          description: The ID of the internal account
          example: InternalAccount:12dcbd6-dced-4ec4-b756-3c3a9ea3d123
        customerId:
          type: string
          description: The ID of the customer associated with the internal account. If this field is empty, the internal account belongs to the platform.
          example: Customer:019542f5-b3e7-1d02-0000-000000000001
        type:
          $ref: '#/components/schemas/InternalAccountType'
        status:
          $ref: '#/components/schemas/InternalAccountStatus'
        balance:
          $ref: '#/components/schemas/CurrencyAmount'
          description: The balance available to spend, excluding pending and held funds
        totalBalance:
          $ref: '#/components/schemas/CurrencyAmount'
          description: The total balance, including pending and held funds
        fundingPaymentInstructions:
          type: array
          description: Payment instructions for funding the account. Empty while funding is withheld. Only bank (`USD_ACCOUNT`, `EUR_ACCOUNT`, `SWIFT_ACCOUNT`) and network wallet types appear here.
          items:
            $ref: '#/components/schemas/PaymentInstructions'
        onBehalfOfCustomerId:
          type: string
          description: The customer whose payments this platform-owned account receives. Only set by regulated financial institutions. Omitted for accounts that name no such customer, which includes every account owned by a customer.
          example: Customer:019542f5-b3e7-1d02-0000-000000000002
        label:
          type: string
          maxLength: 255
          description: The platform-supplied label recorded when the account was created. Null for accounts that carry none.
          example: invoice-4417
        sweepRule:
          allOf:
          - $ref: '#/components/schemas/SweepRule'
          description: The routing rule attached to this account. Null for accounts that carry no rule, which is every account other than a `RULE_BASED` one.
        privateEnabled:
          type: boolean
          description: Whether wallet privacy is enabled for the Embedded Wallet. Only present for `EMBEDDED_WALLET` internal accounts.
          example: true
        cardCapabilities:
          $ref: '#/components/schemas/CardCapabilities'
          description: Actions supported for a card issued now with this account as its funding source. They can change if the platform's card routing changes and do not describe cards already issued using the account. The funding source a create request supplies selects the issuer and therefore the resulting card's capabilities; read this field from that account. Absent when this account cannot fund a card.
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the internal account was created
          example: '2025-10-03T12:30:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Timestamp when the internal account was last updated
          example: '2025-10-03T12:30:00Z'
    PaymentBrlAccountInfo:
      title: BRL Account
      allOf:
      - $ref: '#/components/schemas/BasePaymentAccountInfo'
      - type: object
        required:
        - qrCode
        properties:
          accountType:
            type: string
            enum:
            - BRL_ACCOUNT
          qrCode:
            type: string
            description: A PIX QR code payload that can be used to fund the transaction. This can be rendered as a QR code image or pasted into a PIX-compatible banking app.
            minLength: 1
    TransactionDestinationOneOf:
      oneOf:
      - $ref: '#/components/schemas/AccountTransactionDestination'
      - $ref: '#/components/schemas/UmaAddressTransactionDestination'
      discriminator:
        propertyName: destinationType
        mapping:
          ACCOUNT: '#/components/schemas/AccountTransactionDestination'
          UMA_ADDRESS: '#/components/schemas/UmaAddressTransactionDestination'
    OutgoingTransactionFailureReason:
      type: string
      enum:
      - QUOTE_EXPIRED
      - QUOTE_RATE_UNAVAILABLE
      - QUOTE_EXECUTION_FAILED
      - FUNDING_AMOUNT_MISMATCH
      - SCA_NOT_COMPLETED
      - PAYOUT_RETURNED
      - LIMIT_EXCEEDED
      - ACCOUNT_CANNOT_RECEIVE
      - ACCOUNT_INVALID
      - COMPLIANCE_REJECTED
      - LIGHTNING_PAYMENT_FAILED
      - COUNTERPARTY_POST_TX_FAILED
      - SWEEP_AMOUNT_OUT_OF_RANGE
      - SWEEP_QUOTE_FAILED
      description: 'Reason for failure of an outgoing transaction. This is used to provide more

        context on why a transaction failed. If the transaction is not in a failed

        state, this field is omitted.


        When a payout partner rejects or fails a payment, one of the granular payout

        reasons (`PAYOUT_RETURNED`, `LIMIT_EXCEEDED`, `ACCOUNT_CANNOT_RECEIVE`,

        `ACCOUNT_INVALID`, `COMPLIANCE_REJECTED`) is returned when available.

        `COUNTERPARTY_POST_TX_FAILED` is a coarse fallback used only when no granular

        reason is available.


        `SCA_NOT_COMPLETED` means the customer did not satisfy the Strong Customer

        Authentication challenge before it expired, so the transaction was never

        authorized and no funds were moved. Only occurs for customers in a region

        where SCA is required (e.g. the EU). Create a new quote to try again, and have

        the customer authorize it while the challenge is live.


        | Reason | Description |

        |--------|-------------|

        | `QUOTE_EXPIRED` | The quote was not executed before its expiry window |

        | `QUOTE_RATE_UNAVAILABLE` | The quoted exchange rate was no longer available when the quote was executed, so nothing was exchanged. Create a new quote to get a current rate |

        | `QUOTE_EXECUTION_FAILED` | The quote could not be executed. Covers any internal failure on the way to settlement, whether or not funds were debited — a debited amount is refunded automatically |

        | `FUNDING_AMOUNT_MISMATCH` | The funds received did not match the expected amount |

        | `SCA_NOT_COMPLETED` | The customer did not complete the Strong Customer Authentication challenge before it expired |

        | `PAYOUT_RETURNED` | The receiving bank accepted the payout and then returned or reversed it |

        | `LIMIT_EXCEEDED` | The payout exceeds a recipient-, account-, or corridor-level limit at the partner |

        | `ACCOUNT_CANNOT_RECEIVE` | The account exists but can''t accept this payment — dormant, frozen, restricted, or the currency or payment rail isn''t supported for that account. A sweep whose rule names a rail the destination cannot accept reports this |

        | `ACCOUNT_INVALID` | The recipient account couldn''t be found or the details are wrong — bad IBAN/account number, beneficiary not found, or account closed |

        | `COMPLIANCE_REJECTED` | The payout partner rejected the recipient on compliance grounds — sanctions, watchlist, or KYC/AML screening |

        | `LIGHTNING_PAYMENT_FAILED` | Deprecated — superseded by `QUOTE_EXECUTION_FAILED`. The Lightning settlement leg failed |

        | `COUNTERPARTY_POST_TX_FAILED` | Deprecated — coarse fallback retained for historical transactions when no granular payout reason is available |

        | `SWEEP_AMOUNT_OUT_OF_RANGE` | The amount was outside the range the corridor to the rule''s destination can carry — below its minimum or above its maximum. The rule''s `minimumAmount` and `maximumAmount` give the current band |

        | `SWEEP_QUOTE_FAILED` | Grid could not price the sweep to the rule''s destination. A sweep that was priced and then failed on the way to settlement reports `QUOTE_EXECUTION_FAILED`, the same as any other payout |


        The `SWEEP_*` reasons apply to a payment that settled into a rule-based

        account and could not be swept onward. A rule-based account never holds a

        balance, so the funds are moved to the account holder''s own account in the

        same currency.

        '
    AchPaymentRail:
      type: string
      enum:
      - ACH
      - ACH_SAME_DAY
    TransactionDirection:
      type: string
      enum:
      - CREDIT
      - DEBIT
      description: 'Whether the transaction credits (funds in) or debits (funds out) the customer''s account. Independent of `type`: an incoming transaction is normally a `CREDIT`, but an inbound ACH pull, for example, is an `INCOMING` transaction with a `DEBIT` direction.'
    TransactionSourceOneOf:
      oneOf:
      - $ref: '#/components/schemas/AccountTransactionSource'
      - $ref: '#/components/schemas/UmaAddressTransactionSource'
      - $ref: '#/components/schemas/RealtimeFundingTransactionSource'
      discriminator:
        propertyName: sourceType
        mapping:
          ACCOUNT: '#/components/schemas/AccountTransactionSource'
          UMA_ADDRESS: '#/components/schemas/UmaAddressTransactionSource'
          REALTIME_FUNDING: '#/components/schemas/RealtimeFundingTransactionSource'
    MxnAccountInfoBase:
      type: object
      required:
      - accountType
      - clabeNumber
      properties:
        accountType:
          type: string
          enum:
          - MXN_ACCOUNT
        clabeNumber:
          type: string
          description: The CLABE number of the bank
          example: '123456789012345678'
          minLength: 18
          maxLength: 18
          pattern: ^[0-9]{18}$
      example:
        accountType: MXN_ACCOUNT
        clabeNumber: '123456789012345678'
    Error401:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | UNAUTHORIZED | Issue with API credentials |

            | INVALID_SIGNATURE | Signature header is invalid |

            | WALLET_SIGNATURE_MISSING | The `Grid-Wallet-Signature` header is required for this Embedded Wallet action but was not supplied |

            | WALLET_SIGNATURE_MALFORMED | The `Grid-Wallet-Signature` header could not be parsed (bad encoding, structure, or fields) |

            | WALLET_SIGNATURE_BODY_MISMATCH | The `Grid-Wallet-Signature` was computed over a different request body than the one received |

            | WALLET_SIGNATURE_INVALID | The `Grid-Wallet-Signature` failed cryptographic verification against the registered credential |

            | REQUEST_ID_MISSING | The `Request-Id` header is required on the signed retry but was not supplied (paired with `Grid-Wallet-Signature`) |

            '
          enum:
          - UNAUTHORIZED
          - INVALID_SIGNATURE
          - WALLET_SIGNATURE_MISSING
          - WALLET_SIGNATURE_MALFORMED
          - WALLET_SIGNATURE_BODY_MISMATCH
          - WALLET_SIGNATURE_INVALID
          - REQUEST_ID_MISSING
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    RefundReason:
      type: string
      enum:
      - TRANSACTION_FAILED
      - USER_CANCELLATION
      - TIMEOUT
      description: Reason for the refund
      example: TRANSACTION_FAILED
    Error403:
      type: object
      required:
      - reason
      - code
      properties:
        code:
          type: string
          description: '| Error Code | Description |

            |------------|-------------|

            | FORBIDDEN | Insufficient permissions |

            | USER_NOT_READY | Customer exists but is not ready for operation |

            | COUNTERPARTY_NOT_ALLOWED | Counterparty has not been enabled for your account |

            | VELOCITY_LIMIT_EXCEEDED | Counterparty has exceeded velocity limits |

            | END_USER_TERMS_NOT_ACCEPTED | Customer has not accepted the End User Terms |

            | CUSTOMER_NOT_VERIFIED | The customer is not verified and cannot perform this action |

            | SANCTION_BLOCKED | Blocked by sanction screening |

            | DESTINATION_NOT_ALLOWED | The agent may not pay this destination |

            '
          enum:
          - FORBIDDEN
          - USER_NOT_READY
          - COUNTERPARTY_NOT_ALLOWED
          - VELOCITY_LIMIT_EXCEEDED
          - END_USER_TERMS_NOT_ACCEPTED
          - CUSTOMER_NOT_VERIFIED
          - SANCTION_BLOCKED
          - DESTINATION_NOT_ALLOWED
        reason:
          type: string
          description: Error message
        details:
          type: object
          description: Additional error details
          additionalProperties: true
    AccountTransactionDestination:
      title: Account Destination
      allOf:
      - $ref: '#/components/schemas/BaseTransactionDestination'

      type: object
      required:
      - cardTransactionId
      description: 'Request body for `POST /sandbox/cards/{id}/simulate/authorization_reversal`: which authorization to reverse, and optionally how much of it.'
      properties:
        cardTransactionId:
          type: string
          description: The authorization to reverse. It must still be fully open, with nothing settled against it yet.
          example: Transaction:019542f5-b3e7-1d02-0000-000000000100
        amount:
          type: integer
          format: int64
          description: How much to reverse, in the smallest unit of the transaction's currency (cents for USD). Leave it out to reverse the whole authorization. Send an amount to reverse only that much and leave the rest on hold.
          exclusiveMinimum: 0
          example: 1250
    AchRailStatus:
      type: string
      enum:
      - PENDING
      - SETTLED
      - RETURNED
      - RETURN_DISHONORED
      - RETURN_CONTESTED
      - REVERSED
      - FAILED
      description: 'Status of the entry on the ACH network.


        | Status | Description |

        |--------|-------------|

        | `PENDING` | Submitted to the ACH network and not yet settled. |

        | `SETTLED` | The entry settled. |

        | `RETURNED` | The receiving bank returned the entry, before or after it settled. |

        | `RETURN_DISHONORED` | The originating bank dishonored the return, so the returned funds came back. |

        | `RETURN_CONTESTED` | The receiving bank contested the dishonor, so the funds went back again. |

        | `REVERSED` | The originator reversed the entry after it settled. |

        | `FAILED` | The entry was rejected before submission and no funds moved. |


        A return, dishonor or contest can arrive days after the step before it. This status

        reports the ACH entry; the transaction''s top-level `status` reports where the funds

        are now. A return moves the transaction to `FAILED`. On an incoming payment, a

        dishonor brings the credit back and moves it to `COMPLETED`, and a contest moves it

        to `FAILED` again. A returned payout stays `FAILED` through a dishonor, since it has

        already been refunded; the rail status still records the dishonor.'
      example: SETTLED

        amount:
          type: string
          pattern: ^[0-9]+$
          description: Amount to mint in the stablecoin's smallest unit. The amount must convert exactly to a whole fiat cent for the token decimals.
          example: '1000000'
        fundingSource:
          $ref: '#/components/schemas/StablecoinMintFundingSource'
        destination:
          $ref: '#/components/schemas/StablecoinMintDestination'
        description:
          type: string
          maxLength: 1024
          description: Optional platform-provided operation description.
          example: Initial program funding mint
    StablecoinBurnSource:
      oneOf:
      - $ref: '#/components/schemas/StablecoinExternalAccountBurnSource'
      - $ref: '#/components/schemas/StablecoinGridInternalBurnSource'
      - $ref: '#/components/schemas/StablecoinProviderBalanceBurnSource'
      discriminator:
        propertyName: type
        mapping:
          EXTERNAL_ACCOUNT: '#/components/schemas/StablecoinExternalAccountBurnSource'
          GRID_INTERNAL_ACCOUNT: '#/components/schemas/StablecoinGridInternalBurnSource'
          PROVIDER_INTERNAL_BALANCE: '#/components/schemas/StablecoinProviderBalanceBurnSource'
    StablecoinOperationSource:
      type: object
      description: 'Source of a stablecoin operation, as reported on a `StablecoinOperation`. A single merged shape (superset of the mint funding source and burn source request variants) so the field is unambiguously deserializable regardless of operation type: `externalAccountId` is present for external-account funded mints, `accountId` for Grid internal account sources, and `sourceTokenIdentifier`/`cryptoNetwork` for provider internal balance sources.'
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/StablecoinOperationSourceType'
        externalAccountId:
          type: string
          description: Grid `ExternalAccount` funding the operation, present for ACH debit mints.
          example: ExternalAccount:019542f5-b3e7-1d02-0000-000000000101
        accountId:
          type: string
          description: Grid internal account id, present for Grid internal account sources.
          example: InternalAccount:019542f5-b3e7-1d02-0000-000000000102
        sourceTokenIdentifier:
          type: string
          description: Provider token/value type, present for provider internal balance sources.
          example: USDC
        cryptoNetwork:
          type: string
          description: Source crypto network, present for provider internal balance sources.
          example: SOLANA
    StablecoinProviderBalanceBurnSource:

openapi: 3.2.0
info:
  title: Grid Stablecoins API
  description: API for managing global payments on the open Money Grid. Built by Lightspark. See the full documentation at https://docs.lightspark.com/.
  version: '2025-10-13'
  contact:
    name: Lightspark Support
    email: support@lightspark.com
  license:
    name: Proprietary
    url: https://lightspark.com/terms
servers:
- url: https://api.lightspark.com/grid/2025-10-13
  description: Production server
security:
- BasicAuth: []
- AgentAuth: []
tags:
- name: Stablecoins
  description: Stablecoin issuance endpoints. Link provider accounts, register provider-created stablecoins, create direct mint/burn issuer operations, and track operation status.
paths:
  /stablecoins:
    post:
      summary: Register an existing provider-created stablecoin
      description: Register an existing provider-created stablecoin as a Grid `Stablecoin`. This endpoint links provider token metadata to Grid; it does not create the token with the provider. Grid derives the active provider account link from the authenticated platform, provider, and provider environment.
      operationId: registerStablecoin
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        description: Required idempotency key for retrying this request safely.
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StablecoinRegisterRequest'
      responses:
        '201':
          description: Stablecoin registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stablecoin'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Referenced stablecoin provider account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    get:
      summary: List stablecoins
      description: Retrieve stablecoins registered to the authenticated platform.
      operationId: listStablecoins
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      parameters:
      - name: issuanceStatus
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StablecoinIssuanceStatus'
      - name: gridOperationsStatus
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StablecoinGridOperationsStatus'
      - name: provider
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StablecoinProvider'
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Opaque cursor returned as `nextCursor` from the previous response.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinListResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /stablecoins/{stablecoinId}:
    parameters:
    - name: stablecoinId
      in: path
      description: System-generated stablecoin identifier
      required: true
      schema:
        type: string
    get:
      summary: Get a stablecoin
      description: Retrieve a single registered stablecoin by its Grid identifier.
      operationId: getStablecoin
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stablecoin'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Stablecoin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /stablecoins/{stablecoinId}/request-grid-enablement:
    parameters:
    - name: stablecoinId
      in: path
      description: System-generated stablecoin identifier
      required: true
      schema:
        type: string
    post:
      summary: Request Grid enablement for a stablecoin
      description: 'Ask Lightspark to approve a registered stablecoin as a Grid settlement currency. Grid enablement is a reviewed workflow rather than a self-service switch, so this endpoint only records the request: it moves `gridOperationsStatus` from `NOT_ENABLED` to `PENDING_APPROVAL` and returns the updated stablecoin. Lightspark drives the remaining `ENABLING` and `ENABLED` steps.


        The request is idempotent. Repeating it while the stablecoin is already `PENDING_APPROVAL` succeeds and changes nothing. A stablecoin in any other Grid operations status cannot be requested, and returns `409`.'
      operationId: requestStablecoinGridEnablement
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Grid enablement requested
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stablecoin'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '403':
          description: Forbidden. The caller may not request Grid enablement for this stablecoin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error403'
        '404':
          description: Stablecoin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: The stablecoin is not in a Grid operations status that can be requested for enablement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /stablecoins/{stablecoinId}/mints:
    parameters:
    - name: stablecoinId
      in: path
      description: System-generated stablecoin identifier
      required: true
      schema:
        type: string
    post:
      summary: Create a stablecoin mint operation
      description: Create a provider-backed mint operation for a registered stablecoin. Funding and destination accounts are normal Grid `ExternalAccount` objects; any provider-specific Brale address linkage is managed internally by Grid. Wire-funded mints return funding instructions and remain pending until the provider reports funds received.
      operationId: createStablecoinMint
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        description: Required idempotency key for retrying this mint request safely.
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StablecoinMintRequest'
      responses:
        '201':
          description: Mint operation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinOperation'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Stablecoin or referenced account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '503':
          description: Provider temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
  /stablecoins/{stablecoinId}/burns:
    parameters:
    - name: stablecoinId
      in: path
      description: System-generated stablecoin identifier
      required: true
      schema:
        type: string
    post:
      summary: Create a stablecoin burn operation
      description: Create a provider-backed burn/redemption operation for a registered stablecoin. Burn sources and fiat destinations are normal Grid account objects; provider-specific Brale address ids are resolved and stored internally. External Spark wallet sources return funding instructions and remain pending until the provider reports funds received.
      operationId: createStablecoinBurn
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        description: Required idempotency key for retrying this burn request safely.
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StablecoinBurnRequest'
      responses:
        '201':
          description: Burn operation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinOperation'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Stablecoin or referenced account not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
        '503':
          description: Provider temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error503'
  /stablecoins/{stablecoinId}/operations:
    parameters:
    - name: stablecoinId
      in: path
      description: System-generated stablecoin identifier
      required: true
      schema:
        type: string
    get:
      summary: List stablecoin issuer operations
      description: List issuer mint and burn operations for a stablecoin, most recent first, with cursor pagination.
      operationId: listStablecoinOperations
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      parameters:
      - name: operationType
        in: query
        description: Filter operations by type. When omitted, both mints and burns are returned.
        required: false
        schema:
          $ref: '#/components/schemas/StablecoinOperationType'
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Opaque cursor returned as `nextCursor` from the previous response.
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinOperationListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Stablecoin not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /stablecoin-operations/{stablecoinOperationId}:
    parameters:
    - name: stablecoinOperationId
      in: path
      description: System-generated stablecoin issuer operation identifier
      required: true
      schema:
        type: string
    get:
      summary: Get a stablecoin issuer operation
      description: Retrieve a single stablecoin issuer operation by its Grid identifier.
      operationId: getStablecoinOperation
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinOperation'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Stablecoin operation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /stablecoin-provider-accounts:
    post:
      summary: Link a stablecoin provider account
      description: Link provider API credentials for the authenticated platform. Provider credentials are account-scoped and can be reused for multiple stablecoins. Currently, the only supported provider is `BRALE`; the provider environment is derived from the authenticated Grid platform mode.
      operationId: linkStablecoinProviderAccount
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        description: Idempotency key for retrying this request safely. Replays return the prior result; conflicting payloads are rejected.
        required: true
        schema:
          type: string
          maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StablecoinProviderAccountLinkRequest'
      responses:
        '201':
          description: Stablecoin provider account linked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinProviderAccount'
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '409':
          description: Conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error409'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    get:
      summary: List stablecoin provider account links
      description: Retrieve stablecoin provider account links for the authenticated platform.
      operationId: listStablecoinProviderAccounts
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      parameters:
      - name: provider
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StablecoinProvider'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/StablecoinProviderAccountStatus'
      - name: limit
        in: query
        description: Maximum number of results to return (default 20, max 100)
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        description: Cursor for pagination (returned from previous request)
        required: false
        schema:
          type: string
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinProviderAccountListResponse'
        '400':
          description: Bad request - Invalid parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error400'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
  /stablecoin-provider-accounts/{stablecoinProviderAccountId}:
    parameters:
    - name: stablecoinProviderAccountId
      in: path
      description: System-generated stablecoin provider account link identifier
      required: true
      schema:
        type: string
    get:
      summary: Get a stablecoin provider account link
      description: Retrieve a stablecoin provider account link by id for the authenticated platform.
      operationId: getStablecoinProviderAccount
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      responses:
        '200':
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StablecoinProviderAccount'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Stablecoin provider account link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
    delete:
      summary: Revoke a stablecoin provider account link
      description: Revoke the provider credentials behind a stablecoin provider account link. The stored credential material is cleared and the link's `status` becomes `REVOKED`; the link itself remains readable. Stablecoins registered under a revoked link can no longer mint or burn, and registering a new stablecoin under it is rejected with `STABLECOIN_PROVIDER_ACCOUNT_REVOKED`. Linking the same provider account again reactivates the link with the new credentials. Revoking a link that is already revoked succeeds and changes nothing.
      operationId: revokeStablecoinProviderAccount
      tags:
      - Stablecoins
      security:
      - BasicAuth: []
      responses:
        '204':
          description: Stablecoin provider account link revoked
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error401'
        '404':
          description: Stablecoin provider account link not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error404'
        '500':
          description: Internal service error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error500'
components:
  schemas:
    StablecoinOperationType:
      type: string
      enum:
      - MINT
      - BURN
      description: Stablecoin issuer operation type.
    PaymentDocumentRequirementId:
      type: string
      description: 'A stable identifier for one required document within a purpose''s requirements. The same ID means the same requirement across quotes. It is separate from `PaymentDocumentType`. The requirement ID names the document to supply, and the document type names what a file is. The two differ where a requirement accepts alternatives. For example, a file declared as either `PURCHASE_ORDER` or `DELIVERY_SLIP` fills the `SUPPORTING_PROOF` requirement.


        [Supporting Documents](https://docs.lightspark.com/payouts-and-b2b/payment-flow/send-payment#supporting-documents) lists the IDs each purpose requires.


        Treat the ID as an opaque value, not a member of a fixed list. Grid may add new IDs as requirements change.'
      example: SUPPORTING_PROOF
    StablecoinProviderBalanceFundingSource:
      title: Provider Internal Balance
      allOf:
      - $ref: '#/components/schemas/StablecoinMintFundingSourceBase'
      - type: object
        required:
        - type
        - sourceTokenIdentifier
        - cryptoNetwork
        properties:
          type:
            type: string
            enum:
            - PROVIDER_INTERNAL_BALANCE
            description: Provider internal balance funding. Reserved for the follow-up provider-balance mint flow.
            example: PROVIDER_INTERNAL_BALANCE
          sourceTokenIdentifier:
            type: string
            description: Provider token/value type spent from the provider internal balance.
            example: USDC
          cryptoNetwork:
            type: string
            description: Source crypto network for the provider internal balance funds.
            example: SOLANA
        description: Provider internal balance funding source, reserved for future provider-funded mint flows.
    Stablecoin:
      type: object
      required:
      - id
      - name
      - symbol
      - baseCurrency
      - network
      - decimals
      - issuanceStatus
      - gridOperationsStatus
      - networkTokenIdentifier
      - provider
      - stablecoinProviderAccountId
      - providerEnvironment
      - providerTokenIdentifier
      - createdAt
      - updatedAt
      properties:
        id:
          type: string
          description: System-generated stablecoin identifier.
          example: Stablecoin:019542f5-b3e7-1d02-0000-000000000002
        name:
          type: string
          description: Stablecoin display name.
          example: Acme Dollar
        symbol:
          type: string
          description: Stablecoin symbol.
          example: ACME
        baseCurrency:
          type: string
          description: Fiat currency the stablecoin is denominated against.
          example: USD
        network:
          $ref: '#/components/schemas/StablecoinNetwork'
        decimals:
          type: integer
          description: Number of decimal places used by the stablecoin.
          example: 6
        issuanceStatus:
          $ref: '#/components/schemas/StablecoinIssuanceStatus'
        gridOperationsStatus:
          $ref: '#/components/schemas/StablecoinGridOperationsStatus'
        networkTokenIdentifier:
          type: string
          description: Token identifier in the namespace selected by `network`.
          example: btkn1qw508d6qejxtdg4y5r3zarvary0c5xw7k
        currency:
          type: string
          description: Grid currency code after the stablecoin is enabled for Grid operations.
          example: ACME
        provider:
          $ref: '#/components/schemas/StablecoinProvider'
        stablecoinProviderAccountId:
          type: string
          description: Stablecoin provider account link selected for this stablecoin.
          example: StablecoinProviderAccount:019542f5-b3e7-1d02-0000-000000000001
        providerEnvironment:
          $ref: '#/components/schemas/StablecoinProviderEnvironment'
        providerTokenIdentifier:
          type: string
          description: Provider token identifier. For Brale this maps to `value_type`.
          example: ACME
        createdAt:
          type: string
          format: date-time
          description: Creation timestamp.
          example: '2026-05-20T16:40:00Z'
        updatedAt:
          type: string
          format: date-time
          description: Last update timestamp.
          example: '2026-05-20T17:10:00Z'
    StablecoinBurnDestinationType:
      type: string
      enum:
      - EXTERNAL_ACCOUNT
      - GRID_INTERNAL_ACCOUNT
      description: Burn destination variant.
    StablecoinGridInternalBurnSource:
      title: Grid Internal Account
      allOf:
      - $ref: '#/components/schemas/StablecoinBurnSourceBase'
      - type: object
        required:
        - type
        - accountId
        properties:
          type:
            type: string
            enum:
            - GRID_INTERNAL_ACCOUNT
            description: Grid internal account burn. Reserved for the Grid-controlled ledger movement flow.
            example: GRID_INTERNAL_ACCOUNT
          accountId:
            type: string
            description: Grid internal source account id.
            example: InternalAccount:019542f5-b3e7-1d02-0000-000000000204
        description: Grid internal account burn source, reserved for future Grid-controlled burn flows.
    StablecoinBurnSourceBase:
      type: object
      required:
      - type
      properties:
        type:
          $ref: '#/components/schemas/StablecoinBurnSourceType'
    StablecoinWireFundingSource:
      title: Wire
      allOf:
      - $ref: '#/components/schemas/StablecoinMintFundingSourceBase'
      - type: object
        required:
        - type
        properties:
          type:
            type: string
            enum:
            - WIRE
            description: Wire-funded mint. Funding instructions are returned on the resulting operation.
            example: WIRE
        description: Wire funding source. The issuer wires fiat to the provider using the returned funding instructions.
    StablecoinMintDestination:
      type: object
      description: Account that receives the minted stablecoin. External and Grid-managed accounts are represented as a single account reference, matching the `accountId` pattern used elsewhere in the API; the id prefix (`ExternalAccount:` or `InternalAccount:`) determines which. In the initial Brale-backed flow this must reference an active Spark external account.
      required:
      - accountId
      properties:
        accountId:
          type: string
          description: Grid account receiving the minted stablecoin. Accepts an `ExternalAccount:` id (initial Brale-backed flow) or an `InternalAccount:` id for Grid-managed destinations.
          example: ExternalAccount:019542f5-b3e7-1d02-0000-000000000201
    StablecoinProviderAccountStatus:
      type: string
      enum:
      - ACTIVE
      - INVALID
      - REVOKED
      description: Status of the linked stablecoin provider account credentials.
    StablecoinMintFundingSourceType:
      type: string
      enum:
      - WIRE
      - ACH_DEBIT
      - SAME_DAY_ACH_DEBIT
      - GRID_INTERNAL_ACCOUNT
      - PROVIDER_INTERNAL_BALANCE
      description: Funding source variant. Grid internal account and provider internal balance funding are reserved for follow-up support.
      example: ACH_DEBIT
    StablecoinProviderAccountLinkRequest:
      type: object
      required:
      - provider
      - apiClientId
      - apiClientSecret
      properties:
        provider:
          $ref: '#/components/schemas/StablecoinProvider'
        apiClientId:
          type: string
          description: Provider API client id used to verify and link the provider account.
          example: provider_client_123
        apiClientSecret:
          type: string
          writeOnly: true
          description: Provider API client secret. Grid verifies and stores this secret encrypted; it is never returned.
          example: provider_secret_456
        providerAccountId:
          type: string
          description: Provider account id. Optional when the submitted credentials expose exactly one provider account.
          example: 2VcUIonJeVQzFoBuC7LdFT0dRe4
    StablecoinMintFundingSource:
      oneOf:
      - $ref: '#/components/schemas/StablecoinWireFundingSource'
      - $ref: '#/components/schemas/StablecoinAchDebitFundingSource'
      - $ref: '#/components/schemas/StablecoinSameDayAchDebitFundingSource'

aid: lightspark
name: Lightspark
description: >-
  Lightspark builds global money-movement infrastructure on open payment networks. Its developer
  product is the Grid API — a dated-version REST API (OpenAPI 3.1, 104 paths, 564 schemas, 12
  webhooks) for cross-border payouts, on/off-ramps, stablecoins, embedded wallets, card issuing,
  KYC/KYB verification and payments to Universal Money Addresses ($user@domain). Grid is unusually
  agent-native: it ships a first-class agent surface with device-code credentials, per-agent policy
  and human-in-the-loop approvals, a hosted MCP server, a published Claude agent skill, an
  open-source CLI, and generated TypeScript and Kotlin SDKs. Lightspark also operates the Spark and
  UMA protocol stacks and is backed by a16z, Matrix Partners, Paradigm and Ribbit Capital.

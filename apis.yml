apis:
- aid: lightspark:lightspark-agent-management-api
  name: Lightspark Agent Management API
  description: >-
    Endpoints for creating and managing agents (experimental), called by the partner's backend using platform
    credentials. Covers the full agent lifecycle: creation, policy configuration, pausing, deletion, the
    device code installation flow, and approving or rejecting transactions initiated by agents.
  humanURL: https://docs.lightspark.com/
  baseURL: https://api.lightspark.com/grid/2025-10-13
  tags:
  - Agent Management
  properties:
  - type: OpenAPI
    url: openapi/lightspark-agent-management-api-openapi.yml
  - type: Documentation
    url: https://docs.lightspark.com/
  - type: APIReference
    url: https://docs.lightspark.com/api-reference/authentication
  - type: Spectral
    url: rules/lightspark-grid-spectral.yaml
  - type: Webhooks
    url: asyncapi/lightspark-grid-webhooks.yml
  - type: SourceCode
    url: https://github.com/lightsparkdev/grid-api
- aid: lightspark:lightspark-agent-operations-api
  name: Lightspark Agent Operations API
  description: >-
    Endpoints called by the agent itself using its own credentials (obtained via device code redemption).
    Scoped to the agent's associated customer — all requests automatically operate on behalf of that customer
    and are subject to the agent's policy. When an action requires approval, the resulting transaction
    enters a pending state and must be approved by the platform via `POST /transactions/{transactionId}/approve`.
  humanURL: https://docs.lightspark.com/
  baseURL: https://api.lightspark.com/grid/2025-10-13
  tags:
  - Agent Operations
  properties:
  - type: OpenAPI

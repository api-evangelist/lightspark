- aid: lightspark:lightspark-agent-operations-api
  name: Lightspark Agent Operations API
  description: >-
    Endpoints called by the agent itself using its own credentials (obtained via device code redemption).
    Scoped to the agent's associated customer — all requests automatically operate on behalf of that customer
    and are subject to the agent's policy. When an action requires approval, the resulting transaction
    enters a pending state and must be approved by the platform via `POST /transactions/{transactionId}/approve`.
  humanURL: https://docs.lightspark.com/
  baseURL: https://api.lightspark.com/grid/2025-10-13
